// ─── Canvas ユーティリティ ─────────────────────
function rr(ctx,x,y,w,h,r){
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();
}
function burst(ctx,cx,cy,ro,ri,n,color){
  ctx.beginPath();
  for(let i=0;i<n*2;i++){const a=(i*Math.PI)/n-Math.PI/2,r=i%2===0?ro:ri;i===0?ctx.moveTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r):ctx.lineTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r);}
  ctx.closePath();ctx.fillStyle=color;ctx.fill();
}
function ds(ctx,t,x,y,fill,stroke,sw){
  ctx.strokeStyle=stroke;ctx.lineWidth=sw;ctx.lineJoin="round";ctx.strokeText(t,x,y);ctx.fillStyle=fill;ctx.fillText(t,x,y);
}
function wrapText(ctx,text,x,y,maxW,lineH){
  if(!text)return;const chars=[...text];let line="",curY=y;
  for(let i=0;i<chars.length;i++){const test=line+chars[i];if(ctx.measureText(test).width>maxW&&line){ctx.fillText(line,x,curY);line=chars[i];curY+=lineH;}else line=test;}
  if(line)ctx.fillText(line,x,curY);
}
function cropSquare(img){
  const nw=img.naturalWidth||img.width||800,nh=img.naturalHeight||img.height||800,size=Math.min(nw,nh);
  const c=document.createElement("canvas");c.width=size;c.height=size;
  c.getContext("2d").drawImage(img,(nw-size)/2,(nh-size)/2,size,size,0,0,size,size);return c;
}

function drawAd(ctx,src,f,ai,W,H){
  const brand=ai&&ai.brand||f.brand||"BRAND",capacity=ai&&ai.capacity||f.capacity||"",feature=ai&&ai.feature||f.feature||"",subtitle=ai&&ai.subtitle||f.subtitle||"",tag1=ai&&ai.tag1||f.tag1||"",tag2=ai&&ai.tag2||f.tag2||"",delivery=ai&&ai.delivery||f.delivery||"",catchCopy=ai&&ai.catchCopy||"";
  const bg=ctx.createLinearGradient(0,0,W,H);bg.addColorStop(0,"#FFE000");bg.addColorStop(0.45,"#FF8C00");bg.addColorStop(1,"#CC0000");
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  ctx.save();ctx.translate(W/2,H/2);
  for(let i=0;i<28;i++){ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,W,(i*2*Math.PI)/28,((i+0.5)*2*Math.PI)/28);ctx.fillStyle=i%2===0?"rgba(255,255,255,0.09)":"rgba(0,0,0,0.04)";ctx.fill();}
  ctx.restore();
  const iS=H*0.65;ctx.save();ctx.shadowColor="rgba(0,0,0,0.45)";ctx.shadowBlur=55;ctx.shadowOffsetX=16;ctx.shadowOffsetY=16;ctx.drawImage(src,W-iS-6,H-iS,iS,iS);ctx.restore();
  ctx.textBaseline="alphabetic";
  ctx.font="900 68px "+FONT;ds(ctx,brand,44,100,"#fff","rgba(0,0,0,0.3)",6);
  ctx.font="900 130px "+FONT;ds(ctx,capacity,36,248,"#003399","#fff",10);
  ctx.font="900 50px "+FONT;ds(ctx,feature,36,322,"#fff","#CC0000",7);
  if(catchCopy){ctx.font="700 34px "+FONT;ctx.fillStyle="#FFF9C4";ctx.shadowColor="rgba(0,0,0,0.6)";ctx.shadowBlur=10;wrapText(ctx,catchCopy,36,376,W*0.54,42);ctx.shadowBlur=0;}
  else{ctx.font="700 28px "+FONT;ctx.fillStyle="#FFF9C4";ctx.shadowColor="rgba(0,0,0,0.5)";ctx.shadowBlur=8;ctx.fillText(subtitle,36,374);ctx.shadowBlur=0;}
  [tag1,tag2].filter(Boolean).forEach(function(tag,i){const ty=440+i*76;ctx.font="700 24px "+FONT;const tw=ctx.measureText(tag).width+50;ctx.fillStyle="#003399";rr(ctx,36,ty-34,tw,48,10);ctx.fill();ctx.fillStyle="#fff";ctx.fillText((i===0?"🌀":"☀️")+" "+tag,50,ty);});
  if(delivery){ctx.fillStyle="#CC0000";ctx.fillRect(0,H-108,W*0.63,68);ctx.font="700 23px "+FONT;ctx.fillStyle="#FFE000";ctx.fillText("🚚 "+delivery,18,H-68);}
  burst(ctx,W-153,H-148,138,88,14,"#CC0000");
  ctx.save();ctx.font="900 43px "+FONT;ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillStyle="#FFE000";ctx.fillText("激安！",W-153,H-148);ctx.restore();

}
function drawFlea(ctx,src,f,ai,W,H){

  ctx.fillStyle="#FAF7F3";ctx.fillRect(0,0,W,H);
  for(let x=20;x<W;x+=36)for(let y=20;y<H;y+=36){ctx.beginPath();ctx.arc(x,y,1.4,0,Math.PI*2);ctx.fillStyle="rgba(0,0,0,0.05)";ctx.fill();}
  const iS=H*0.50;ctx.save();ctx.shadowColor="rgba(0,0,0,0.12)";ctx.shadowBlur=28;ctx.drawImage(src,(W-iS)/2,46,iS,iS);ctx.restore();
  const sep=H*0.60;ctx.fillStyle="#E0D8D0";ctx.fillRect(40,sep,W-80,2);
  ctx.font="900 50px "+FONT;ctx.fillStyle="#1A1A1A";ctx.fillText(brand+" "+capacity,44,sep+64);
  if(condition){ctx.font="700 22px "+FONT;const cw=ctx.measureText(condition).width+30;ctx.fillStyle="#E8F5E9";rr(ctx,44,sep+86,cw,44,10);ctx.fill();ctx.fillStyle="#2E7D32";ctx.fillText("✅ "+condition,60,sep+114);}
  let px=44;[tag1,tag2].filter(Boolean).forEach(function(t){ctx.font="600 19px "+FONT;const pw=ctx.measureText(t).width+22;ctx.fillStyle="#FFF3E0";rr(ctx,px,sep+144,pw,36,8);ctx.fill();ctx.fillStyle="#E65100";ctx.fillText(t,px+11,sep+168);px+=pw+9;});
  ctx.font="400 22px "+FONT;ctx.fillStyle="#666";ctx.fillText(delivery,44,sep+224);
  ctx.font="400 18px "+FONT;ctx.fillStyle="#999";ctx.fillText(note,44,sep+254);
  ctx.fillStyle="#FF6157";ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(152,0);ctx.lineTo(0,152);ctx.fill();
  ctx.save();ctx.translate(18,50);ctx.rotate(-Math.PI/4);ctx.font="700 18px "+FONT;ctx.fillStyle="#fff";ctx.textAlign="center";ctx.fillText("中古品",0,0);ctx.restore();ctx.textAlign="left";
}
function drawShop(ctx,src,f,ai,W,H){
  const brand=ai&&ai.brand||f.brand||"BRAND",model=ai&&ai.model||f.model||"",capacity=ai&&ai.capacity||f.capacity||"",features=ai&&ai.features||f.features||"",condition=ai&&ai.condition||f.condition||"",note=ai&&ai.note||f.note||"";

  if(condition){ctx.font="400 18px "+FONT;const cw=ctx.measureText(condition).width+22;ctx.fillStyle="rgba(255,255,255,0.15)";rr(ctx,W-cw-30,25,cw,44,8);ctx.fill();ctx.fillStyle="#CCDDFF";ctx.fillText(condition,W-cw-16,55);}
  const iS=H*0.47;ctx.save();ctx.shadowColor="rgba(0,0,0,0.08)";ctx.shadowBlur=24;ctx.drawImage(src,(W-iS)/2,120,iS,iS);ctx.restore();
  const mid=120+iS+22;const lg=ctx.createLinearGradient(0,0,W,0);lg.addColorStop(0,"#0D1B3E");lg.addColorStop(0.5,"#4A90D9");lg.addColorStop(1,"#0D1B3E");
  ctx.fillStyle=lg;ctx.fillRect(44,mid,W-88,3);

  ctx.font="900 84px "+FONT;ctx.fillStyle="#0D1B3E";ctx.fillText(capacity,44,mid+136);
  let sx=44,sy=mid+162;features.split(",").filter(Boolean).forEach(function(s,i){ctx.font="600 18px "+FONT;const sw=ctx.measureText(s.trim()).width+24;ctx.fillStyle=i%2===0?"#0D1B3E":"#EEF2FF";rr(ctx,sx,sy,sw,40,20);ctx.fill();ctx.fillStyle=i%2===0?"#fff":"#0D1B3E";ctx.fillText(s.trim(),sx+12,sy+26);sx+=sw+8;if(sx>W-140){sx=44;sy+=49;}});
  ctx.font="400 20px "+FONT;ctx.fillStyle="#888";ctx.fillText(note,44,H-28);
  ctx.fillStyle=lg;ctx.fillRect(0,H-7,W,7);
}

// ─── Claude API強化 ───────────────────────────
async function enhanceWithClaude(tmplId,fields,photoBase64){
  const tmplDesc={ad:"派手な日本の中古家電広告（黄色〜赤グラデーション・インパクト重視）",flea:"メルカリ・ジモティー風フリマ出品",shop:"ECサイト・ショップ風クリーンな商品ページ"};
  const fieldStr=Object.entries(fields).filter(function(e){return e[1];}).map(function(e){return e[0]+": "+e[1];}).join("\n");
  const res=await fetch("https://api.anthropic.com/v1/messages",{
    method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:600,messages:[{role:"user",content:[
      {type:"image",source:{type:"base64",media_type:"image/jpeg",data:photoBase64}},
      {type:"text",text:"この商品写真を見て、"+tmplDesc[tmplId]+"のための最適な広告コピーをJSONのみで返答してください（説明不要）:\n入力情報:\n"+fieldStr+"\n\n{\"brand\":\"\",\"capacity\":\"\",\"feature\":\"\",\"subtitle\":\"改善したキャッチコピー\",\"catchCopy\":\"写真から読み取った特徴を活かした一言（20文字以内）\",\"tag1\":\"\",\"tag2\":\"\",\"delivery\":\"\",\"condition\":\"\",\"note\":\"\",\"extraNote\":\"写真から気づいた外観コメント\",\"model\":\"\",\"features\":\"\"}"}
    ]}]})
  });
  if(!res.ok)throw new Error("Claude API: "+res.status);
  const data=await res.json();
  const text=data.content.map(function(c){return c.text||"";}).join("");
  const match=text.match(/\{[\s\S]*\}/);
  if(!match)throw new Error("JSON取得失敗");
  return JSON.parse(match[0]);
}

function LoginScreen(props){
  const [pw,setPw]=useState("");
  const [err,setErr]=useState(false);
  const [shake,setShake]=useState(false);
  function tryLogin(){
    if(pw===APP_PASSWORD){props.onLogin();}
    else{setErr(true);setShake(true);setPw("");setTimeout(function(){setShake(false);},450);}
  }
  return React.createElement("div",{style:{minHeight:"100vh",background:"linear-gradient(160deg,#0f0f23,#1a1a3e,#0a1628)",display:"flex",alignItems:"center",justifyContent:"center"}},
    React.createElement("div",{style:{background:"rgba(255,255,255,0.07)",borderRadius:24,padding:"44px 32px",border:"1px solid rgba(255,255,255,0.12)",width:"88%",maxWidth:320,textAlign:"center",animation:shake?"shake 0.4s":"none"}},
      React.createElement("div",{style:{fontSize:46,marginBottom:11}},"🔒"),
      React.createElement("h2",{style:{color:"#fff",fontSize:19,fontWeight:900,margin:"0 0 5px"}},"スタッフ専用"),
      React.createElement("p",{style:{color:"#777",fontSize:12,marginBottom:22}},"合言葉を入力してください"),
      React.createElement("input",{type:"password",placeholder:"合言葉",value:pw,autoFocus:true,
        onChange:function(e){setPw(e.target.value);setErr(false);},
        onKeyDown:function(e){if(e.key==="Enter")tryLogin();},
        style:{width:"100%",padding:"12px 14px",borderRadius:10,border:err?"2px solid #ef4444":"1px solid rgba(255,255,255,0.2)",background:"rgba(255,255,255,0.08)",color:"#fff",fontSize:17,outline:"none",textAlign:"center",boxSizing:"border-box",marginBottom:8,letterSpacing:6}}),
      err&&React.createElement("div",{style:{color:"#f87171",fontSize:12,marginBottom:8}},"合言葉が違います"),
      React.createElement("button",{onClick:tryLogin,style:{width:"100%",padding:"13px",borderRadius:11,background:"linear-gradient(135deg,#FFD700,#FF6B00)",border:"none",color:"#1a1a2e",fontWeight:900,fontSize:16,cursor:"pointer"}},"入室する →")
    )
  );
}

// ─── メインアプリ ──────────────────────────────
function MainApp(props){
  const [mode,setMode]=useState("instant");
  const [tmplId,setTmplId]=useState("ad");
  const [cropped,setCropped]=useState(null);
  const [photoB64,setPhotoB64]=useState(null);
  const [photoLoading,setPhotoLoading]=useState(false);
  const [fields,setFields]=useState({});
  const [loading,setLoading]=useState(false);
  const [loadMsg,setLoadMsg]=useState("");
  const [result,setResult]=useState(null);
  const [error,setError]=useState("");
  const canvasRef=useRef(null);
  const tmpl=TEMPLATES[tmplId];

  function handlePhoto(e){
    const file=e.target.files&&e.target.files[0];
    if(!file)return;
    setPhotoLoading(true);setCropped(null);setPhotoB64(null);setResult(null);setError("");
    const reader=new FileReader();
    reader.onload=function(ev){
      const dataURL=ev.target.result;
      const img=new Image();
      img.onload=function(){
        try{
          const c=cropSquare(img);setCropped(c);
          const small=document.createElement("canvas");small.width=512;small.height=512;
          small.getContext("2d").drawImage(c,0,0,512,512);
          setPhotoB64(small.toDataURL("image/jpeg",0.8).split(",")[1]);
        }catch(err){setError("写真処理エラー: "+err.message);}
        setPhotoLoading(false);
      };
      img.onerror=function(){setError("画像読み込み失敗");setPhotoLoading(false);};
      img.src=dataURL;
    };
    reader.onerror=function(){setError("ファイル読み込み失敗");setPhotoLoading(false);};
    reader.readAsDataURL(file);
    e.target.value="";
  }

  async function doInstant(){
    if(!cropped)return;
    setLoading(true);setLoadMsg("生成中...");setError("");
    try{
      await document.fonts.ready;
      const canvas=canvasRef.current;canvas.width=1080;canvas.height=1080;
      const ctx=canvas.getContext("2d");
      if(tmplId==="ad")drawAd(ctx,cropped,fields,null,1080,1080);
      else if(tmplId==="flea")drawFlea(ctx,cropped,fields,null,1080,1080);
      else drawShop(ctx,cropped,fields,null,1080,1080);
      setResult(canvas.toDataURL("image/png"));
    }catch(e){setError("生成失敗: "+e.message);}
    setLoading(false);setLoadMsg("");
  }

  async function doAI(){
    if(!cropped||!photoB64){setError("写真をアップロードしてください");return;}
    setLoading(true);setError("");
    try{
      setLoadMsg("🤖 Claudeが写真を解析中...");
      const aiFields=await enhanceWithClaude(tmplId,fields,photoB64);
      setLoadMsg("🎨 広告画像を生成中...");
      await document.fonts.ready;
      const canvas=canvasRef.current;canvas.width=1080;canvas.height=1080;
      const ctx=canvas.getContext("2d");
      if(tmplId==="ad")drawAd(ctx,cropped,fields,aiFields,1080,1080);
      else if(tmplId==="flea")drawFlea(ctx,cropped,fields,aiFields,1080,1080);
      else drawShop(ctx,cropped,fields,aiFields,1080,1080);
      setResult(canvas.toDataURL("image/png"));
    }catch(e){setError("エラー: "+e.message);}
    setLoading(false);setLoadMsg("");
  }

  function doDownload(){
    if(!result)return;
    const a=document.createElement("a");a.download="商品_"+tmplId+"_"+Date.now()+".png";a.href=result;a.click();
  }

  const card={background:"rgba(255,255,255,0.06)",borderRadius:15,padding:"15px 17px",marginBottom:12,border:"1px solid rgba(255,255,255,0.08)"};
  const ctit={fontSize:11,color:"#FFD700",fontWeight:700,marginBottom:10,letterSpacing:1};
  const sel={width:"100%",padding:"10px 12px",borderRadius:8,border:"1px solid rgba(255,255,255,0.13)",background:"rgba(255,255,255,0.07)",color:"#fff",fontSize:14,marginBottom:10,outline:"none"};
  const canGo=!!cropped&&!loading&&!photoLoading;
  const isAI=mode==="ai";

  function mBtn(active){return{flex:1,padding:"11px 5px",borderRadius:10,border:active?"2px solid #FFD700":"2px solid rgba(255,255,255,0.1)",background:active?"rgba(255,215,0,0.12)":"rgba(255,255,255,0.04)",color:active?"#FFD700":"#bbb",cursor:"pointer",fontWeight:active?700:400,fontSize:12};}
  function tBtn(active){return{flex:1,padding:"8px 3px",borderRadius:9,border:active?"2px solid #60a5fa":"2px solid rgba(255,255,255,0.09)",background:active?"rgba(96,165,250,0.12)":"rgba(255,255,255,0.03)",color:active?"#60a5fa":"#bbb",cursor:"pointer",fontWeight:active?700:400,fontSize:11};}

  const e=React.createElement;
  return e("div",{style:{minHeight:"100vh",background:"linear-gradient(160deg,#0f0f23,#1a1a3e,#0a1628)",padding:13}},
    e("div",{style:{maxWidth:620,margin:"0 auto"}},

      // ヘッダー
      e("div",{style:{textAlign:"center",marginBottom:14}},
        e("h1",{style:{fontSize:20,fontWeight:900,background:"linear-gradient(90deg,#FFD700,#FF6B00)",WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent",margin:0}},"📸 商品画像ジェネレーター"),
        e("p",{style:{color:"#555",fontSize:10,margin:"3px 0 0"}},"スタッフ専用")
      ),

      // モード
      e("div",{style:card},
        e("div",{style:ctit},"⚡ 生成モード"),
        e("div",{style:{display:"flex",gap:9}},
          e("button",{onClick:function(){setMode("instant");setResult(null);},style:mBtn(mode==="instant")},
            e("div",{style:{fontSize:18}},"⚡"),e("div",{style:{fontWeight:700,marginTop:2,fontSize:12}},"即時生成"),e("div",{style:{fontSize:10,opacity:.6,marginTop:1}},"無料・高速")),
          e("button",{onClick:function(){setMode("ai");setResult(null);},style:mBtn(mode==="ai")},
            e("div",{style:{fontSize:18}},"✨"),e("div",{style:{fontWeight:700,marginTop:2,fontSize:12}},"Claude AI強化"),e("div",{style:{fontSize:10,opacity:.6,marginTop:1}},"写真解析・コピー最適化"))
        ),
        mode==="ai"&&e("div",{style:{background:"rgba(168,85,247,0.1)",borderRadius:9,padding:"9px 12px",marginTop:10,fontSize:12,color:"#d8b4fe",border:"1px solid rgba(168,85,247,0.25)"}},"✨ Claudeが写真を見てキャッチコピーを自動改善します")
      ),

      // テンプレート
      e("div",{style:card},
        e("div",{style:ctit},"① テンプレート"),
        e("div",{style:{display:"flex",gap:7}},
          Object.values(TEMPLATES).map(function(t){
            return e("button",{key:t.id,onClick:function(){setTmplId(t.id);setFields({});setResult(null);},style:tBtn(tmplId===t.id)},
              e("div",{style:{fontSize:16}},t.label.split(" ")[0]),
              e("div",{style:{fontSize:10,marginTop:2}},t.label.split(" ").slice(1).join(" ")),
              e("div",{style:{fontSize:9,opacity:.55,marginTop:1}},t.desc));
          })
        )
      ),

      // 写真
      e("div",{style:card},
        e("div",{style:ctit},"② 商品写真"),
        e("div",{style:{border:"2px dashed rgba(255,255,255,0.2)",borderRadius:12,padding:16,textAlign:"center",background:"rgba(255,255,255,0.02)",minHeight:110,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center"}},
          photoLoading?[e("div",{key:"sp",className:"spinner"}),e("div",{key:"t",style:{color:"#FFD700",fontWeight:700,fontSize:14}},"写真を読み込み中..."),e("div",{key:"s",style:{color:"#666",fontSize:11,marginTop:4}},"少しお待ちください")]:
          cropped?[e("img",{key:"i",src:cropped.toDataURL(),alt:"preview",style:{maxHeight:170,maxWidth:"100%",borderRadius:9,marginBottom:8}}),e("div",{key:"t",style:{color:"#60a5fa",fontSize:12}},"✅ 読み込み完了")]:
          [e("div",{key:"ic",style:{fontSize:36,marginBottom:7}},"📷"),e("div",{key:"t",style:{color:"#fff",fontSize:14,fontWeight:700}},"写真を選択してください"),e("div",{key:"s",style:{color:"#666",fontSize:11,marginTop:3}},"下のボタンから選択")]
        ),
        e("div",{style:{display:"flex",gap:8,marginTop:10}},
          e("label",{style:{flex:1,display:"block"}},
            e("div",{style:{padding:"11px",borderRadius:9,background:"rgba(255,255,255,0.07)",border:"1px solid rgba(255,255,255,0.15)",textAlign:"center",cursor:"pointer",fontSize:13,color:"#ddd",fontWeight:600}},"🖼️ 写真から選ぶ"),
            e("input",{type:"file",accept:"image/*",onChange:handlePhoto,style:{display:"none"}})
          ),
          e("label",{style:{flex:1,display:"block"}},
            e("div",{style:{padding:"11px",borderRadius:9,background:"rgba(255,255,255,0.07)",border:"1px solid rgba(255,255,255,0.15)",textAlign:"center",cursor:"pointer",fontSize:13,color:"#ddd",fontWeight:600}},"📸 カメラで撮影"),
            e("input",{type:"file",accept:"image/*",capture:"environment",onChange:handlePhoto,style:{display:"none"}})
          )
        )
      ),

      // フィールド
      e("div",{style:card},
        e("div",{style:ctit},"③ 項目を選ぶ"),
        tmpl.fields.map(function(f){
          return e("div",{key:f.key},
            e("label",{style:{display:"block",fontSize:11,color:"#aaa",marginBottom:3}},f.label),
            e("select",{value:fields[f.key]||"",onChange:function(ev){setFields(function(p){const n=Object.assign({},p);n[f.key]=ev.target.value;return n;});},style:sel},
              e("option",{value:""},"── 選択してください ──"),
              f.opts.map(function(o){return e("option",{key:o,value:o},o);})
            )
          );
        })
      ),

      // エラー
      error&&e("div",{style:{background:"rgba(220,38,38,0.15)",border:"1px solid rgba(220,38,38,0.4)",borderRadius:8,padding:"10px 13px",marginBottom:11,color:"#fca5a5",fontSize:13}},error),

      // ローディング
      loading&&e("div",{style:{background:"rgba(255,255,255,0.05)",borderRadius:10,padding:18,textAlign:"center",marginBottom:11}},
        e("div",{className:"spinner"}),
        e("div",{style:{color:"#FFD700",fontWeight:700,fontSize:14}},loadMsg)
      ),

      // 生成ボタン
      e("button",{
        onClick:isAI?doAI:doInstant,disabled:!canGo,
        style:{width:"100%",padding:"15px",borderRadius:12,background:canGo?(isAI?"linear-gradient(135deg,#a855f7,#7c3aed)":"linear-gradient(135deg,#FFD700,#FF6B00)"):"rgba(255,255,255,0.07)",border:"none",color:canGo?(isAI?"#fff":"#1a1a2e"):"#444",fontWeight:900,fontSize:16,cursor:canGo?"pointer":"not-allowed",marginBottom:12,letterSpacing:1}
      },loading?"処理中...":isAI?"✨ Claude AI強化で生成する":"⚡ 即時生成する（無料）"),

      e("canvas",{ref:canvasRef,style:{display:"none"}}),

      // 結果
      result&&!loading&&e("div",{style:Object.assign({},card,{textAlign:"center"})},
        e("div",{style:ctit},"✅ 完成！"),
        e("img",{src:result,alt:"result",style:{width:"100%",borderRadius:9,marginBottom:13}}),
        e("button",{onClick:doDownload,style:{padding:"12px 42px",borderRadius:9,background:"#0f0f23",border:"2px solid #FFD700",color:"#FFD700",fontWeight:700,fontSize:14,cursor:"pointer"}},"⬇️ PNG でダウンロード")
      ),

      e("div",{style:{textAlign:"center",marginTop:14}},
        e("button",{onClick:props.onLogout,style:{background:"none",border:"none",color:"#444",fontSize:11,cursor:"pointer"}},"🔒 ログアウト")
      )
    )
  );
}

// ─── ルート ──────────────────────────────────
function App(){
  const [loggedIn,setLoggedIn]=useState(false);
  return loggedIn
    ?React.createElement(MainApp,{onLogout:function(){setLoggedIn(false);}})
    :React.createElement(LoginScreen,{onLogin:function(){setLoggedIn(true);}});
}

ReactDOM.createRoot(document.getElementById("app")).render(React.createElement(App));
</script>
</body>
