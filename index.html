<body>
<div id="R"></div>
<script>
const {useState,useEffect,useMemo,useCallback}=React;
const h=React.createElement;

const VER="v2.2.3";
const G={
  bg:"#0f172a",
  card:{background:"rgba(255,255,255,.03)",borderRadius:16,padding:16,marginBottom:16,border:"1px solid rgba(255,255,255,.06)"},

  ta:{width:"100%",background:"rgba(255,255,255,.05)",border:"1px solid rgba(255,255,255,.1)",borderRadius:8,padding:"10px 12px",color:"#fff",fontSize:13,outline:"none",minHeight:120,lineHeight:1.6,resize:"none"},
  sel:{width:"100%",background:"rgba(255,255,255,.05)",border:"1px solid rgba(255,255,255,.1)",borderRadius:8,padding:"10px 12px",color:"#fff",fontSize:14,outline:"none",appearance:"none",marginBottom:9},
  err:{background:"rgba(239,68,68,.1)",border:"1px solid rgba(239,68,68,.2)",color:"#f87171",padding:10,borderRadius:8,fontSize:12,marginBottom:12}
};
const PB=(bg,c,ex={})=>({width:"100%",padding:"14px",borderRadius:12,background:bg,color:c,border:"none",fontSize:15,fontWeight:900,cursor:"pointer",transition:".2s",display:"flex",alignItems:"center",justifyContent:"center",gap:8,...ex});

// ── AI API ──────────────────────────────
async function aiOAI(key,messages,max=800){
  const r=await fetch("https://api.openai.com/v1/chat/completions",{
    method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+key},
    body:JSON.stringify({model:"gpt-4o",messages,max_tokens:max,temperature:.7})
  });
  const d=await r.json();if(d.error)throw new Error(d.error.message);
  return d.choices[0].message.content;
}
const imgMsg=(b64)=>({type:"image_url",image_url:{url:`data:image/jpeg;base64,${b64}`}});

async function doDesc(ocr,userInputs,b64,key){
  const facts=Object.entries({
    メーカー:ocr.brand,型番:ocr.model,容量:ocr.capacity,
    年式:ocr.year,消費電力:ocr.wattage,寸法:ocr.dimensions,
    色:ocr.color,シリーズ:ocr.series,
  }).filter(([,v])=>v&&v!=="不明"&&v).map(([k,v])=>`${k}: ${v}`).join("\n");

  const userStr=Object.entries(userInputs).filter(([,v])=>v).map(([k,v])=>`${k}: ${v}`).join("\n");

  const prompt=`あなたは中古販売のプロです。以下の情報からメルカリ用商品説明文を生成し、同時にファクトチェックも行ってください。

【確認済み情報(これ以外のスペック・機能・付属品の記述は絶対禁止)】
${facts||"(なし)"}

【ユーザー入力情報】
${userStr||"(なし)"}

【出力スタイル・構成】
1. 冒頭に型番・商品名(1行)
2. ✅ 箇条書きで特徴・ポイント(3〜5個、確認できた情報のみ)
3. 【商品の状態】(傷・汚れを具体的に、ユーザー入力の傷情報を優先)
4. 【付属品】(ユーザーが付属品を入力した場合のみ記載)
5. 最後に「ご不明点がございましたらお気軽にお問い合わせください！」

【ルール】
- 絵文字は適度に(1段落に1〜2個まで、✅は箇条書きのみ)
- 目標600〜900文字
- 画像・確認情報にない機能・年式・バッテリー状態・消耗品状態の推測は一切記述しない
- 「〜と思われます」「〜でしょう」などの推測表現禁止
- ファクトチェック結果やシステムメッセージは出力に含めない
- 説明文本文のみを出力する(注釈・補足・見出し不要)`;

  return (await aiOAI(key,[{role:"user",content:[imgMsg(b64),{type:"text",text:prompt}]}],1100)).trim();
}

// DALL-E 3 生成
const STYLE={
  appliance:"Japanese used home appliance advertisement flyer. Bright YELLOW-ORANGE radial burst background. Product cleanly placed on right side with drop shadow and floor reflection. Left: large RED bold brand (top), MASSIVE NAVY BLUE capacity number with thick white outline stroke (biggest element), ORANGE-RED category name with white outline. Bottom-left dark red delivery banner. Bottom-right explosive red starburst if urgent. Style: professional Hardoff/Jimoty Japanese resale flyer.",
  apple:"Apple minimalist: pure white background, product centered with soft shadow, generous whitespace, black typography, thin black bars top/bottom.",
  dyson:"Dyson premium: pure black, purple radial glow behind product, floor reflection, gradient purple-to-white text.",
  pc:"Tech dark: deep navy, blue-green radial glows, product right, gradient blue-green text left.",
  ikea:"IKEA style: warm cream background, IKEA blue header bar, natural shadow, bold typography.",
  small:"Simple warm yellow background, centered product, clean typography.",
  other:"Clean dark professional background.",
};

async function doDalleGen(b64,catId,subCat,data,key){
  if(!key||!key.startsWith("sk-"))throw new Error("OpenAI APIキーが必要です");
  // 商品の外観説明を取得
  const desc=await aiOAI(key,[{role:"user",content:[imgMsg(b64),{type:"text",text:"Describe ONLY what is clearly visible: product type, exact color, shape, any visible text/labels. 2 sentences, English only, no speculation."}]}],200);
  const info=[data.brand,data.mainSpec,subCat,data.catchCopy,data.condition,data.delivery].filter(Boolean).join(", ");
  const dbText=data.dbText||"";
  const prompt=`Professional Japanese product advertisement, 1:1 square.
PRODUCT: ${desc.trim()}
INFO: ${info}
DATABASE INFORMATION:
${dbText}
STYLE (MANDATORY): ${STYLE[catId]||STYLE.other}
RULES:
- Keep the exact original appliance photo unchanged.
- DO NOT redraw the appliance.
- DO NOT recreate the appliance.
- Use the original product photo directly.
- Preserve all real details, labels, scratches, buttons, reflections and proportions.
- Photorealistic.
- Real product photo appearance.
- NOT illustration.
- NOT 3D render.
- NOT vector art.
- Model numbers are NOT capacity values.
- Never infer capacity from model numbers.
ONLY add:
- Japanese advertisement text
- burst background
- glow effects
- shadows
- delivery banners
- sale badges
- product cleanly extracted from background with no white halo, natural drop shadow and floor shadow, large clear Japanese ad text, NO watermarks, NO price tags.${data.urgent?" Large red starburst with '激安' text.":""}
Quality: professional Photoshop-level Japanese used goods ad.`;

  const r=await fetch("https://api.openai.com/v1/images/generations",{
    method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+key},
    body:JSON.stringify({model:"dall-e-3",prompt:prompt.substring(0,3900),size:"1024x1024"})
  });
  const d=await r.json();if(d.error)throw new Error(d.error.message);
  if(d.data?.[0]?.url)return d.data[0].url;
  if(d.data?.[0]?.b64_json)return "data:image/png;base64,"+d.data[0].b64_json;
  throw new Error("画像生成レスポンス異常");
}

// ── 画像をリサイズしてbase64に ────────────
function imgToB64(file,maxSize=900){
  return new Promise((res,rej)=>{
    const reader=new FileReader();
    reader.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        const sc=Math.min(1,maxSize/Math.max(img.width,img.height));
        const c=document.createElement("canvas");
        c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
        c.getContext("2d").drawImage(img,0,0,c.width,c.height);
        res({b64:c.toDataURL("image/jpeg",.88).split(",")[1],src:e.target.result,w:c.width,h:c.height});
      };
      img.onerror=rej;img.src=e.target.result;
    };
    reader.onerror=rej;reader.readAsDataURL(file);
  });
}

// ── コンポーネント ────────────────────────
function Sp({msg}){return h("div",{style:{textAlign:"center",padding:14}},h("div",{className:"sp"}),msg&&h("div",{style:{color:"#FFD700",fontSize:11,fontWeight:700}},msg));}
function Err({msg}){return msg?h("div",{style:G.err},msg):null;}

// OCRタグ(タップで編集・×で削除)
function OcrTag({label,value,mono,conf,onChange,onDelete}){
  const [ed,setEd]=useState(false);
  const [v,setV]=useState(value);
  const cc=conf>=.8?"#4ade80":conf>=.5?"#fcd34d":"rgba(255,255,255,.5)";
  if(ed)return h("span",{style:{display:"inline-flex",alignItems:"center",gap:3,padding:"4px 8px",background:"rgba(255,255,255,.09)",borderRadius:8,border:"1px solid #FFD700",marginBottom:4,marginRight:4}},
    h("input",{value:v,onChange:e=>setV(e.target.value),autoFocus:true,
      onKeyDown:e=>{if(e.key==="Enter"||e.key===","){onChange(v);setEd(false);}if(e.key==="Escape")setEd(false);},
      style:{background:"none",border:"none",color:"#fff",fontSize:11,outline:"none",width:80}}),
    h("span",{onClick:()=>setEd(false),style:{cursor:"pointer",fontSize:14}},"×")
  );
  return h("span",{style:{display:"inline-flex",alignItems:"center",gap:4,padding:"4px 8px",background:"rgba(255,255,255,.06)",borderRadius:8,border:"1px solid rgba(255,255,255,.1)",marginBottom:4,marginRight:4,cursor:"pointer"},onClick:()=>setEd(true)},
    h("span",{style:{fontSize:9,color:"rgba(255,255,255,.4)",fontWeight:700}},label),
    h("span",{style:{fontSize:11,fontWeight:700,color:cc}},value),
    h("span",{onClick:e=>{e.stopPropagation();onDelete();},style:{marginLeft:4,color:"rgba(255,255,255,.2)",fontSize:14}},"×")
  );
}

function Login({ok}){
  const [k,setK]=useState(localStorage.getItem("oai_key")||"");
  const save=()=>{if(k.startsWith("sk-")){localStorage.setItem("oai_key",k);ok();}else alert("有効なAPIキーを入力してください");};
  return h("div",{style:{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",padding:20,background:G.bg}},
    h("div",{style:{width:"100%",maxWidth:360,textAlign:"center"}},
      h("div",{style:{fontSize:32,marginBottom:8}},"🎨"),
      h("h1",{style:{fontSize:20,fontWeight:900,marginBottom:24}},"メルカリAI広告生成"),
      h("div",{style:G.card},
        h("label",{style:G.lbl},"OpenAI API Key"),
        h("input",{type:"password",placeholder:"sk-...",value:k,onChange:e=>setK(e.target.value),style:{...G.inp,textAlign:"center",marginBottom:16}}),
        h("button",{onClick:save,style:PB("linear-gradient(135deg,#6366f1,#4f46e5)","#fff")},"利用開始")
      ),
      h("p",{style:{fontSize:11,color:"rgba(255,255,255,.3)",lineHeight:1.6}},"キーはブラウザにのみ保存されます。\nGPT-4oとDALL-E 3を使用します。")
    )
  );
}

function Main({logout}){
  const apiKey=localStorage.getItem("oai_key");
  const hasApi=!!apiKey;
  const [images,setImages]=useState([]);
  const [analyzing,setAnalyzing]=useState(false);
  const [ocrData,setOcrData]=useState(null);
  const [catId,setCatId]=useState("appliance");
  const [freeCat,setFreeCat]=useState("");
  const [mainSpec,setMainSpec]=useState("");
  const [catchCopy,setCatchCopy]=useState("");
  const [condition,setCondition]=useState("");
  const [delivery,setDelivery]=useState("");
  const [accessories,setAccessories]=useState("");
  const [scratchNote,setScratchNote]=useState("");
  const [negotiable,setNegotiable]=useState(false);
  const [urgent,setUrgent]=useState(false);
  const [genLoading,setGenLoading]=useState(false);
  const [genMsg,setGenMsg]=useState("");
  const [aiImgUrl,setAiImgUrl]=useState(null);
  const [descLoading,setDescLoading]=useState(false);
  const [descResult,setDescResult]=useState("");
  const [error,setError]=useState("");
  const [copied,setCopied]=useState(false);

  const isOther=catId==="other";
  const subCat=isOther?freeCat:catId;

  // 画像アップロード & 解析
  const onFile=async e=>{
    const files=Array.from(e.target.files);if(!files.length)return;
    setAnalyzing(true);setError("");
    try{
      const res=await imgToB64(files[0]);
      setImages([res]);
      // OCR & 解析
      const prompt=`Analyze this product image for resale. Return JSON only:
{
  "brand": "maker name",
  "model": "model number",
  "capacity": "L or kg if appliance",
  "year": "manufacture year",
  "wattage": "W",
  "dimensions": "WxDxH",
  "color": "main color",
  "series": "product series",
  "category": "appliance|apple|dyson|pc|ikea|small|other",
  "suggested_catch": "short catchy Japanese phrase",
  "main_spec": "most important spec (e.g. 137L, 8kg, M1 Max)"
}`;
      const json=await aiOAI(apiKey,[{role:"user",content:[imgMsg(res.b64),{type:"text",text:prompt}]}],500);
      const data=JSON.parse(json.replace(/```json|```/g,""));
      setOcrData(data);
      if(data.category)setCatId(data.category);
      if(data.suggested_catch)setCatchCopy(data.suggested_catch);
      if(data.main_spec)setMainSpec(data.main_spec);
    }catch(e){setError("解析失敗: "+e.message);}
    setAnalyzing(false);
  };

  // AI画像生成
  async function runDalle(){
    if(!images.length){setError("写真をアップロードしてください");return;}
    if(!hasApi){setError("OpenAI APIキーが必要です");return;}
    setGenLoading(true);setGenMsg("🤖 商品を解析中...");setError("");setAiImgUrl(null);
    try{
      let dbText = descResult;
      if(!dbText){
        setGenMsg("📝 先に商品説明(DB)を生成中...");
        const ui={状態:condition,配送:delivery,カテゴリ:isOther?freeCat:subCat,スペック:mainSpec,付属品:accessories,傷状態:scratchNote,値下げ:negotiable?"応相談":"",キャッチコピー:catchCopy};
        dbText = await doDesc(ocrData||{},ui,images[0].b64,apiKey);
        setDescResult(dbText);
      }
      const data={brand:ocrData?.brand,mainSpec,catchCopy,condition,delivery,urgent,dbText};
      setGenMsg("🎨 実写保持AI広告を生成中(20〜40秒)...");
      const url=await doDalleGen(images[0].b64,catId,isOther?freeCat:subCat,data,apiKey);
      setAiImgUrl(url);
    }catch(e){setError("AI生成: "+e.message);}
    setGenLoading(false);setGenMsg("");
  }

  // 説明文生成
  async function runDesc(){
    if(!images.length){setError("写真をアップロードしてください");return;}
    if(!hasApi){setError("OpenAI APIキーが必要です");return;}
    setDescLoading(true);setDescResult("");setError("");
    try{
      const ui={状態:condition,配送:delivery,カテゴリ:isOther?freeCat:subCat,スペック:mainSpec,付属品:accessories,傷状態:scratchNote,値下げ:negotiable?"応相談":"",キャッチコピー:catchCopy};
      const txt=await doDesc(ocrData||{},ui,images[0].b64,apiKey);
      setDescResult(txt);
    }catch(e){setError("説明文: "+e.message);}
    setDescLoading(false);
  }

  const canGo=images.length>0&&hasApi&&!genLoading&&!analyzing;

  return h("div",{style:{minHeight:"100vh",background:G.bg,padding:12}},
    h("header",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16,padding:"4px 8px"}},
      h("div",null,
        h("h1",{style:{fontSize:18,fontWeight:900,margin:0,background:"linear-gradient(to right,#fff,#94a3b8)",WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent"}},"AI広告ジェネレーター"),
        h("p",{style:{color:"rgba(255,255,255,.22)",fontSize:9,margin:"1px 0 0"}},"GPT-4o · 実写保持AI広告 · "+VER)
      ),
      h("button",{onClick:logout,style:{background:"rgba(255,255,255,.05)",border:"none",color:"rgba(255,255,255,.4)",fontSize:10,padding:"6px 12px",borderRadius:20,cursor:"pointer"}},"ログアウト")
    ),

    // STEP 1: 写真
    h("div",{style:G.card},
      h("div",{style:G.ct},"📸 STEP 1 · 商品写真をアップロード"),
      h("div",{style:{display:"flex",gap:10,overflowX:"auto",paddingBottom:4}},
        images.map((img,i)=>h("div",{key:i,style:{position:"relative",flexShrink:0}},
          h("img",{src:img.src,style:{width:80,height:80,objectFit:"cover",borderRadius:12,border:"2px solid #FFD700"}}),
          h("div",{onClick:()=>setImages([]),style:{position:"absolute",top:-5,right:-5,background:"#ef4444",color:"#fff",width:20,height:20,borderRadius:10,display:"flex",alignItems:"center",justifyContent:"center",fontSize:12,cursor:"pointer",fontWeight:900}},"×")
        )),
        h("label",{style:{width:80,height:80,borderRadius:12,background:"rgba(255,255,255,.05)",border:"2px dashed rgba(255,255,255,.1)",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",cursor:"pointer",flexShrink:0}},
          h("span",{style:{fontSize:24,marginBottom:2}},"+"),
          h("span",{style:{fontSize:9,fontWeight:700,color:"rgba(255,255,255,.4)"}},"追加"),
          h("input",{type:"file",accept:"image/*",onChange:onFile,style:{display:"none"}})
        )
      ),
      analyzing&&h(Sp,{msg:"AIが写真を解析しています..."})
    ),

    // STEP 2: 解析結果
    ocrData&&h("div",{style:G.card},
      h("div",{style:G.ct},"🔍 STEP 2 · AI解析結果 (タップで修正)"),
      h("div",{style:{display:"flex",flexWrap:"wrap"}},
        Object.entries(ocrData).map(([k,v])=>{
          if(["category","suggested_catch","main_spec"].includes(k)) return null;
          return h(OcrTag,{key:k,label:k,value:v,onChange:nv=>setOcrData({...ocrData,[k]:nv}),onDelete:()=>setOcrData({...ocrData,[k]:""})});
        })
      )
    ),

    // STEP 3: 入力
    h("div",{style:G.card},
      h("div",{style:G.ct},"📝 STEP 3 · 広告・出品情報の詳細"),
      h("label",{style:G.lbl},"デザイン・カテゴリ"),
      h("select",{value:catId,onChange:e=>setCatId(e.target.value),style:G.sel},
        h("option",{value:"appliance"},"家電チラシ風 (オレンジ)"),
        h("option",{value:"apple"},"Apple風 (ミニマル)"),
        h("option",{value:"dyson"},"Dyson風 (高級感)"),
        h("option",{value:"pc"},"ゲーミングPC風 (サイバー)"),
        h("option",{value:"ikea"},"IKEA風 (北欧)"),
        h("option",{value:"small"},"小物・雑貨 (シンプル)"),
        h("option",{value:"other"},"その他 (自由入力)")
      ),
      isOther&&h("input",{placeholder:"カテゴリ名を入力 (例: スニーカー)",value:freeCat,onChange:e=>setFreeCat(e.target.value),style:{...G.inp,marginBottom:9}}),
      h("label",{style:G.lbl},"主要スペック (画像に大きく表示)"),
      h("input",{placeholder:"例: 137L, M1 Max, 2023年製",value:mainSpec,onChange:e=>setMainSpec(e.target.value),style:{...G.inp,marginBottom:9}}),
      h("label",{style:G.lbl},"キャッチコピー"),
      h("input",{placeholder:"例: 一人暮らしにぴったり！",value:catchCopy,onChange:e=>setCatchCopy(e.target.value),style:{...G.inp,marginBottom:9}}),
      h("label",{style:G.lbl},"商品の状態"),
      h("select",{value:condition,onChange:e=>setCondition(e.target.value),style:G.sel},
        h("option",{value:""},"── 選択してください ──"),
        ["美品","動作確認済み","良品","やや使用感あり","ジャンク・現状渡し"].map(o=>h("option",{key:o,value:o},o))
      ),
      h("label",{style:G.lbl},"配送・受け渡し"),
      h("select",{value:delivery,onChange:e=>setDelivery(e.target.value),style:G.sel},
        h("option",{value:""},"── 選択してください ──"),
        ["配達可(要相談)","配達可(無料)","自己搬出のみ","発送対応可","引き取り限定","近隣エリア配達対応"].map(o=>h("option",{key:o,value:o},o))
      ),
      h("label",{style:G.lbl},"付属品(任意)"),
      h("input",{placeholder:"例: 本体・取扱説明書・ホースセット付き",value:accessories,onChange:e=>setAccessories(e.target.value),style:{...G.inp,marginBottom:9}}),
      h("label",{style:G.lbl},"傷・状態の記述(画像解析から自動入力 or 手入力)"),
      h("textarea",{placeholder:"例: 動作良好。外観にわずかなスレはありますが目立ちません。",value:scratchNote,onChange:e=>setScratchNote(e.target.value),style:{...G.ta,minHeight:70,marginBottom:9}}),
      h("div",{style:{display:"flex",gap:12,flexWrap:"wrap"}},
        h("label",{style:{display:"flex",alignItems:"center",gap:5,cursor:"pointer",fontSize:12,color:negotiable?"#fcd34d":"rgba(255,255,255,.32)"}},
          h("input",{type:"checkbox",checked:negotiable,onChange:e=>setNegotiable(e.target.checked),style:{accentColor:"#fcd34d",width:14,height:14}}),"💬 値下げ応相談"),
        h("label",{style:{display:"flex",alignItems:"center",gap:5,cursor:"pointer",fontSize:12,color:urgent?"#f87171":"rgba(255,255,255,.32)"}},
          h("input",{type:"checkbox",checked:urgent,onChange:e=>setUrgent(e.target.checked),style:{accentColor:"#f87171",width:14,height:14}}),"🔥 即売希望(激安バッジ)")
      )
    ),
    h(Err,{msg:error}),

    // STEP 4: 説明文生成(メルカリのみ・1択)
    h("div",{style:G.card},
      h("div",{style:G.ct},"📝 STEP 4 · メルカリ商品説明 自動生成"),
      h("div",{style:{fontSize:11,color:"rgba(255,255,255,.4)",marginBottom:10,lineHeight:1.5}},"ファクトチェック付き・確認できた情報のみで生成します"),
      descLoading&&h(Sp,{msg:"生成・ファクトチェック中..."}),
      h("button",{onClick:runDesc,disabled:descLoading||!images.length||!hasApi,
        style:PB(images.length&&hasApi&&!descLoading?"linear-gradient(135deg,#f59e0b,#ef4444)":"rgba(255,255,255,.05)",images.length&&hasApi&&!descLoading?"#fff":"rgba(255,255,255,.2)",{marginBottom:8,fontSize:13})},
        descLoading?"生成中...":"✨ メルカリ用説明文を自動生成する"
      ),
      descResult&&!descLoading&&h("div",null,
        h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:5}},
          h("span",{style:{fontSize:9,color:"#4ade80",fontWeight:700}},"✅ ファクトチェック済"),
          h("span",{style:{fontSize:10,color:descResult.length>900?"#f87171":descResult.length>600?"#fcd34d":"#4ade80",fontWeight:700}},descResult.length+"文字")
        ),
        h("textarea",{value:descResult,onChange:e=>setDescResult(e.target.value),style:G.ta}),
        h("button",{onClick:()=>{navigator.clipboard?.writeText(descResult).then(()=>{setCopied(true);setTimeout(()=>setCopied(false),2500);});},
          style:PB("rgba(255,255,255,.04)","rgba(255,255,255,.62)",{border:"1px solid rgba(255,255,255,.09)",marginTop:6,marginBottom:0,fontSize:12})},
          copied?"✅ コピー完了！":"📋 コピーする"
        )
      )
    ),

    // STEP 5: AI画像生成
    genLoading&&h(Sp,{msg:genMsg}),
    h("button",{onClick:runDalle,disabled:!canGo,
      style:PB(canGo?"linear-gradient(135deg,#10b981,#059669)":"rgba(255,255,255,.06)",canGo?"#fff":"rgba(255,255,255,.22)")},
      genLoading?"生成中...":hasApi?"🎨 STEP5 DB情報から広告画像を生成":"🎨 STEP5 AI広告生成(要API設定)"
    ),
    // 生成結果
    aiImgUrl&&!genLoading&&h("div",{style:{...G.card,textAlign:"center"}},
      h("div",{style:G.ct},"🎨 STEP5 AI広告生成 完了"),
      h("img",{src:aiImgUrl,style:{width:"100%",borderRadius:9,marginBottom:11,boxShadow:"0 6px 26px rgba(0,0,0,.5)"}}),
      h("button",{onClick:()=>window.open(aiImgUrl,"_blank"),style:{padding:"11px 22px",borderRadius:8,background:"linear-gradient(135deg,#10b981,#059669)",border:"none",color:"#fff",fontWeight:900,fontSize:13,cursor:"pointer"}},"⬇️ 画像を開く(長押しで保存)")
    ),

    h("div",{style:{height:14}})
  );
}
function App(){const [ok,setOk]=useState(false);return ok?h(Main,{logout:()=>setOk(false)}):h(Login,{ok:()=>setOk(true)});}
ReactDOM.createRoot(document.getElementById("R")).render(h(App));
</script>
</body>
</html>
