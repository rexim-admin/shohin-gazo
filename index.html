// ── AI ────────────────────────────────────
async function aiOAI(key,msgs,max=800){
  const r=await fetch("https://api.openai.com/v1/chat/completions",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+key},body:JSON.stringify({model:"gpt-4o",max_tokens:max,messages:msgs})});
  const d=await r.json();if(d.error)throw new Error(d.error.message);
  return d.choices[0].message.content;
}
function imgMsg(b64){return{type:"image_url",image_url:{url:"data:image/jpeg;base64,"+b64}};}
function parseJ(t){const m=t.match(/\{[\s\S]*\}/);if(!m)throw new Error("JSON解析失敗");return JSON.parse(m[0]);}
// OCR + 傷解析を1回のAPIコールで実行(コスト削減・高速化)
async function doAnalyze(b64s,key){
  const imgParts=b64s.map(b=>imgMsg(b));
  const prompt=`これらの商品画像を総合解析してください。1枚目がメイン商品画像、2枚目以降が詳細・傷の画像です。
【OCR情報抽出】優先順位順:
1.型番 2.メーカー 3.容量・サイズ(単位付き) 4.年式 5.消費電力(W) 6.寸法(mm/cm) 7.カテゴリ 8.色 9.シリーズ名
【傷・状態解析】2〜4枚目があれば詳細に分析:
- 全体的な状態グレード
- 目視できる傷・汚れの箇所と程度
- 変色・焼け・錆の有無
厳守: 読めない情報は"不明"。推測禁止。
JSONのみ返答:
{
  "brand":"","model":"","capacity":"","year":"","wattage":"","dimensions":"","category":"","color":"","series":"",
  "confidence":{"brand":0.0,"model":0.0,"capacity":0.0},
  "rawOCR":"","suggestCatId":"appliance|ikea|apple|dyson|pc|small|other","suggestSubCat":"",
  "specTags":["容量: XX","年式: XXXX","消費電力: XXW","型番: XXXX"],
  "scratchGrade":"美品|良品|やや使用感あり|使用感あり",
  "scratchDetail":"傷・状態の詳細説明",
  "scratchShort":"短め1〜2行の状態説明文",
  "scratchStandard":"標準3〜4行の状態説明文(メルカリ用)",
  "scratchDetailed":"詳細5〜6行の状態説明文(メルカリ用)"
}`;
  const text=await aiOAI(key,[{role:"user",content:[...imgParts,{type:"text",text:prompt}]}],1100);
  return parseJ(text);
}
// 型番から正式スペックを照合
async function doModelLookup(model,brand,ocrData,key){
  if(!model||model==="不明")return ocrData;
  const prompt=`型番「${model}」(メーカー:${brand||"不明"})の正式スペックを照合してください。
OCR解析結果(参考): ${JSON.stringify(ocrData)}
【ルール】
- 型番から確実に判明する情報を優先してください。
- OCR結果が型番のスペックと矛盾する場合(例:型番は86LなのにOCRが25L)、型番のスペックを優先してください。
- 存在しないスペック(例:冷蔵庫で25L、電子レンジで23Wなど)は出力しないでください。
- 容量、年式、ドア数、色、カテゴリを重点的に確認してください。
JSONのみ返答:
{
  "brand":"","model":"","capacity":"","year":"","wattage":"","dimensions":"","category":"","color":"","series":"",
  "specTags":["容量: XX","年式: XXXX","型番: XXXX"],
  "lookupSuccess":true
}`;
  try{
    const text=await aiOAI(key,[{role:"user",content:prompt}],800);
    const lookup=parseJ(text);
    return {...ocrData,...lookup,confidence:{...ocrData.confidence,model:1.0}};
  }catch{return ocrData;}
}
// メルカリ商品説明生成(ファクトチェック込み・1回のプロンプトで完結)
async function doDesc(ocr,userInputs,b64,key){
  const facts=Object.entries({
    メーカー:ocr.brand,型番:ocr.model,容量:ocr.capacity,
    年式:ocr.year,消費電力:ocr.wattage,寸法:ocr.dimensions,
    色:ocr.color,シリーズ:ocr.series,
  }).filter(([,v])=>v&&v!=="不明"&&v).map(([k,v])=>`${k}: ${v}`).join("\n");
  const userStr=Object.entries(userInputs).filter(([,v])=>v).map(([k,v])=>`${k}: ${v}`).join("\n");
  const prompt=`あなたは中古販売のプロです。以下の情報からメルカリ用商品説明文を生成し、同時にファクトチェックも行ってください。
【確認済み情報(型番照合済み・これ以外のスペック・機能・付属品の記述は絶対禁止)】
${facts||"(なし)"}
【ユーザー入力情報】
${userStr||"(なし)"}
【出力スタイル・構成】
1. 冒頭に型番・商品名(1行)
2. ✅ 箇条書きで特徴・ポイント(3〜5個、確認できた情報のみ)
3. 【商品の状態】(傷・汚れを具体的に、ユーザー入力の傷情報を優先)
4. 【付属品】(ユーザーが付属品を入力した場合のみ記載)
5. 最後に「ご不明点がございましたらお気軽にお問い合わせください！」
【ルール】
- 絵文字は適度に(1段落に1〜2個まで、✅は箇条書きのみ)
- 目標600〜900文字
- 画像・確認情報にない機能・年式・バッテリー状態・消耗品状態の推測は一切記述しない
- 「〜と思われます」「〜でしょう」などの推測表現禁止
- ファクトチェック結果やシステムメッセージは出力に含めない
- 説明文本文のみを出力する(注釈・補足・見出し不要)`;
  return (await aiOAI(key,[{role:"user",content:[imgMsg(b64),{type:"text",text:prompt}]}],1100)).trim();
}

const PRESETS={

async function doDalleGen(b64,catId,subCat,data,key,mode){
  if(!key||!key.startsWith("sk-"))throw new Error("OpenAI APIキーが必要です");
  
  let styleDesc=PRESETS[mode]?.s||"";
  if(mode==="auto"){
    if(catId==="appliance")styleDesc=PRESETS.sale.s;
    else if(catId==="ikea")styleDesc=PRESETS.ikea.s;
    else if(catId==="apple")styleDesc=PRESETS.apple.s;
    else if(catId==="pc")styleDesc=PRESETS.gadget.s;
    else styleDesc=PRESETS.luxury.s;
  }

  const info=[data.brand,data.mainSpec,subCat,data.catchCopy,data.condition,data.delivery].filter(Boolean).join(", ");
  const dbText=data.dbText||"";
  const prompt=`Professional Japanese product advertisement, 1:1 square.
INFO: ${info}
DATABASE INFORMATION:
${dbText}
STYLE (MANDATORY): ${styleDesc}
RULES:
- Keep the ORIGINAL product photo exactly unchanged.
- Do NOT redraw the product.
- Do NOT recreate the product.
- Do NOT change the product shape.
- Preserve all scratches, labels, reflections, proportions and details.
- ONLY add advertisement design elements around the product.
- Photorealistic Japanese recycle-shop advertisement.
- NOT illustration.
- NOT CGI.
- NOT 3D render.
- Do NOT generate extra product photos.
- Do NOT create collage layouts.
- Use ONLY the original main product photo.
- Model numbers are NOT capacity values.
- Never infer capacity from model numbers.
ONLY add:
- Japanese advertisement text (amount based on style)
- background elements (burst, glow, or clean)
- shadows
- delivery banners
- sale badges
- natural drop shadow and floor shadow, large clear Japanese ad text, NO watermarks, NO price tags, product color/shape must exactly match photo.${data.urgent?" Large red starburst with '激安' text.":""}
Quality: professional Photoshop-level Japanese used goods ad.`;

  const byteString=atob(b64);
  const ab=new ArrayBuffer(byteString.length);
  const ia=new Uint8Array(ab);
  for(let i=0;i<byteString.length;i++)ia[i]=byteString.charCodeAt(i);
  const blob=new Blob([ab],{type:"image/png"});

  const fd=new FormData();
  fd.append("image",blob,"image.png");
  fd.append("prompt",prompt.substring(0,3900));
  fd.append("model","gpt-image-1");
  fd.append("n",1);
  fd.append("size","1024x1024");

  const r=await fetch("https://api.openai.com/v1/images/edits",{
    method:"POST",headers:{"Authorization":"Bearer "+key},
    body:fd
  });
  const d=await r.json();if(d.error)throw new Error(d.error.message);
  if(d.data?.[0]?.url)return d.data[0].url;
  if(d.data?.[0]?.b64_json)return "data:image/png;base64,"+d.data[0].b64_json;
  throw new Error("画像生成レスポンス異常");
}
// ── 画像をリサイズしてbase64に ────────────
function imgToB64(file,maxSize=900){
  return new Promise((res,rej)=>{
    const reader=new FileReader();
    reader.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        const sc=Math.min(1,maxSize/Math.max(img.width,img.height));
        const c=document.createElement("canvas");
        c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
        c.getContext("2d").drawImage(img,0,0,c.width,c.height);
        res({b64:c.toDataURL("image/png").split(",")[1],src:e.target.result,w:c.width,h:c.height});
      };
      img.onerror=rej;img.src=e.target.result;
    };
    reader.onerror=rej;reader.readAsDataURL(file);
  });
}

function Sp({msg}){return h("div",{style:{textAlign:"center",padding:14}},h("div",{className:"sp"}),msg&&h("div",{style:{color:"#FFD700",fontSize:11,fontWeight:700}},msg));}
function Err({msg}){return msg?h("div",{style:G.err},msg):null;}
// OCRタグ(タップで編集・×で削除)
function OcrTag({label,value,mono,conf,onChange,onDelete}){
  const [ed,setEd]=useState(false);
  const [v,setV]=useState(value);
  const cc=conf>=.8?"#4ade80":conf>=.5?"#fcd34d":"rgba(255,255,255,.5)";
  if(ed)return h("span",{style:{display:"inline-flex",alignItems:"center",gap:3,padding:"4px 8px",background:"rgba(255,255,255,.09)",borderRadius:8,border:"1px solid #FFD700",marginBottom:4,marginRight:4}},
    h("input",{value:v,onChange:e=>setV(e.target.value),autoFocus:true,
      onKeyDown:e=>{if(e.key==="Enter"||e.key===","){onChange(v);setEd(false);}if(e.key==="Escape")setEd(false);},
      style:{background:"none",border:"none",color:"#fff",fontSize:11,outline:"none",width:80}}),
    h("span",{onClick:()=>setEd(false),style:{cursor:"pointer",fontSize:14}},"×")
  );
  return h("span",{style:{display:"inline-flex",alignItems:"center",gap:4,padding:"4px 8px",background:"rgba(255,255,255,.06)",borderRadius:8,border:"1px solid rgba(255,255,255,.1)",marginBottom:4,marginRight:4,cursor:"pointer"},onClick:()=>setEd(true)},
    h("span",{style:{fontSize:9,color:"rgba(255,255,255,.4)",fontWeight:700}},label),
    h("span",{style:{fontSize:11,fontWeight:700,color:cc}},value),
    h("span",{onClick:e=>{e.stopPropagation();onDelete();},style:{marginLeft:4,color:"rgba(255,255,255,.2)",fontSize:14}},"×")
  );
}
// OCR結果パネル
function OcrPanel({ocr,setOcr}){
  if(!ocr)return null;
  const fields=[
    {k:"brand",l:"メーカー"},{k:"model",l:"型番"},{k:"capacity",l:"容量/サイズ",mono:true},
    {k:"year",l:"年式"},{k:"color",l:"色"},{k:"series",l:"シリーズ"},
    {k:"wattage",l:"消費電力"},{k:"dimensions",l:"寸法"},
  ];
  const conf=ocr.confidence||{};
  return h("div",{style:G.card},
    h("div",{style:G.ct},ocr.lookupSuccess?"✅ 型番照合済みスペック (タップで編集)":"AI解析結果 (タップで編集)"),
    h("div",{style:{display:"flex",flexWrap:"wrap"}},
      fields.map(f=>
        h(OcrTag,{key:f.k,label:f.l,value:ocr[f.k],mono:f.mono,conf:conf[f.k],
          onChange:v=>setOcr({...ocr,[f.k]:v}),
          onDelete:()=>setOcr({...ocr,[f.k]:"不明"})})
      )
    ),
    ocr.rawOCR&&h("div",{style:{marginTop:6,fontSize:10,color:"rgba(255,255,255,.2)",lineHeight:1.5}},"読み取り: "+ocr.rawOCR.slice(0,120)),
    ocr.suggestSubCat&&h("div",{style:{marginTop:5,fontSize:11,color:"#60a5fa"}},"💡 推奨: "+ocr.suggestSubCat)
  );
}
// スペック追加タグ入力
function SpecTags({value,onChange,suggestions}){
  const tags=value?value.split(" ").filter(t=>t.trim()):[];
  function addTag(t){
    const trimmed=t.trim();
    if(!trimmed||tags.includes(trimmed))return;
    onChange([...tags,trimmed].join(" "));
  }
  function removeTag(i){onChange(tags.filter((_,j)=>j!==i).join(" "));}
  return h("div",null,
    suggestions&&suggestions.length>0&&h("div",{style:{marginBottom:6}},
      h("div",{style:{fontSize:10,color:"#888",marginBottom:4}},"タップで追加"),
      h("div",{style:{display:"flex",flexWrap:"wrap",gap:4}},
        suggestions.map((s,i)=>h("button",{key:i,
          onClick:()=>addTag(s),
          style:{padding:"5px 11px",borderRadius:7,
            background:tags.includes(s)?"rgba(255,215,0,.18)":"rgba(255,215,0,.07)",
            border:tags.includes(s)?"1px solid rgba(255,215,0,.5)":"1px solid rgba(255,215,0,.18)",
            color:tags.includes(s)?"#FFD700":"#fcd34d",fontSize:11,cursor:"pointer"}},s))
      )
    ),
    tags.length>0&&h("div",{style:{display:"flex",flexWrap:"wrap",gap:4,marginBottom:6}},
      tags.map((t,i)=>h("span",{key:i,style:{display:"inline-flex",alignItems:"center",gap:4,padding:"4px 10px",background:"rgba(255,255,255,.09)",border:"1px solid rgba(255,255,255,.18)",borderRadius:8,fontSize:11,color:"rgba(255,255,255,.85)"}},
        t,
        h("button",{onClick:()=>removeTag(i),style:{background:"none",border:"none",color:"rgba(255,100,100,.7)",cursor:"pointer",fontSize:11,lineHeight:1,padding:0}},"×")
      ))
    ),
    h("input",{
      placeholder:"手入力して Enterで追加",
      style:{...G.inp,fontSize:13},
      onKeyDown:e=>{if(e.key==="Enter"&&e.target.value.trim()){addTag(e.target.value.trim());e.target.value="";e.preventDefault();}}
    })
  );
}

    ["Short","Standard","Detailed"].map(k=>{

      );

}

function ApiPage({apiKey,onSave,back}){
  const [key,setKey]=useState(apiKey);const [saved,setSaved]=useState(false);
  const valid=key.startsWith("sk-")&&key.length>20;
  const conn=apiKey&&apiKey.startsWith("sk-");
  function doSave(){onSave(key);setSaved(true);setTimeout(()=>setSaved(false),2000);}
  return h("div",{style:{minHeight:"100vh",background:G.bg,padding:20}},
    h("div",{style:{display:"flex",alignItems:"center",gap:10,marginBottom:20}},
      h("button",{onClick:back,style:{background:"none",border:"none",color:"#FFD700",fontSize:20,cursor:"pointer"}},"←"),
      h("h2",{style:{margin:0,fontSize:17,fontWeight:900}},"API設定")
    ),
    h("div",{style:G.card},
      h("div",{style:G.ct},"OpenAI API Key"),
      h("input",{type:"password",value:key,onChange:e=>setKey(e.target.value),style:{...G.inp,marginBottom:12},placeholder:"sk-proj-..."}),
      !conn&&h("div",{style:{color:"#f87171",fontSize:10,marginBottom:12}},"⚠️ APIキーが設定されていません"),
      valid&&h("div",{style:{color:"#4ade80",fontSize:10,marginBottom:6}},"✅ 有効な形式"),
      h("div",{style:{display:"flex",gap:8}},
        h("button",{onClick:doSave,disabled:!valid,style:PB(valid?"linear-gradient(135deg,#60a5fa,#3b82f6)":"rgba(255,255,255,.06)",valid?"#fff":"rgba(255,255,255,.22)",{flex:2,marginBottom:0})},saved?"✅ 保存しました！":"💾 保存する"),
        conn&&h("button",{onClick:()=>{setKey("");onSave("");},style:PB("rgba(239,68,68,.1)","#f87171",{flex:1,marginBottom:0,border:"1px solid rgba(239,68,68,.22)"})},"🔌 切断")
      )
    )
  );
}
// ── LOGIN ─────────────────────────────────
function Login({ok}){
  const [pw,setPw]=useState("");const [err,setErr]=useState(false);const [sh,setSh]=useState(false);
  function go(){if(pw===PW)ok();else{setErr(true);setSh(true);setPw("");setTimeout(()=>setSh(false),420);}}
  return h("div",{style:{minHeight:"100vh",background:G.bg,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:20}},
    h("div",{style:{textAlign:"center",marginBottom:22}},
      h("div",{style:{fontSize:38,marginBottom:7}},"🏷️"),
      h("h1",{style:{fontSize:19,fontWeight:900,background:"linear-gradient(90deg,#FFD700,#FF8C00)",WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent",margin:"0 0 4px"}},"中古販売CTRエンジン"),
      h("div",{style:{fontSize:11,color:"rgba(255,255,255,.22)"}},VER)
    ),
    h("div",{style:{background:"rgba(255,255,255,.044)",borderRadius:17,padding:"30px 22px",border:"1px solid rgba(255,255,255,.068)",width:"100%",maxWidth:290,textAlign:"center",animation:sh?"shake .4s":"none"}},
      h("p",{style:{color:"rgba(255,255,255,.32)",fontSize:12,marginBottom:14}},"スタッフ専用"),
      h("input",{type:"password",placeholder:"パスワードを入力",value:pw,onChange:e=>setPw(e.target.value),onKeyDown:e=>e.key==="Enter"&&go(),style:{...G.inp,textAlign:"center",marginBottom:15,border:err?"1px solid #ef4444":"1px solid rgba(255,255,255,.1)"}}),
      h("button",{onClick:go,style:PB("linear-gradient(135deg,#FFD700,#FF8C00)","#000")},"ログイン")
    )
  );
}
// ── MAIN ──────────────────────────────────
function Main({logout}){
  const init=load();
  const [screen,setScreen]=useState("main");
  const [apiKey,setApiKey]=useState(init.apiKey||"");
  const [images,setImages]=useState([]);
  const [imgLoading,setImgLoading]=useState(false);
  const [analyzing,setAnalyzing]=useState(false);
  const [ocrData,setOcrData]=useState(null);
  const [catId,setCatId]=useState("appliance");
  const [subCat,setSubCat]=useState("");
  const [freeCat,setFreeCat]=useState("");
  const [condition,setCondition]=useState("");
  const [delivery,setDelivery]=useState("");
  const [negotiable,setNegotiable]=useState(false);
  const [urgent,setUrgent]=useState(false);
  const [mainSpec,setMainSpec]=useState("");
  const [catchCopy,setCatchCopy]=useState("");
  const [accessories,setAccessories]=useState("");
  const [scratchNote,setScratchNote]=useState("");
  const [styleMode,setStyleMode]=useState("auto");
  const [genLoading,setGenLoading]=useState(false);
  const [genMsg,setGenMsg]=useState("");
  const [aiImgUrl,setAiImgUrl]=useState(null);
  const [error,setError]=useState("");
  const [descResult,setDescResult]=useState("");
  const [descLoading,setDescLoading]=useState(false);
  const [copied,setCopied]=useState(false);
  const hasApi=apiKey&&apiKey.startsWith("sk-")&&apiKey.length>20;
  const catTree=CATS[catId];
  const isOther=subCat==="フリー入力"||subCat==="その他"||catId==="other";

  // STEP2(OCR)からSTEP3(スペック)へのリアルタイム同期
  useEffect(()=>{
    if(ocrData){
      const tags=ocrData.specTags||[];
      const combined=[ocrData.capacity,ocrData.year,ocrData.model].filter(v=>v&&v!=="不明");
      const newSpec=[...new Set([...combined,...tags])].join(" ");
      setMainSpec(newSpec);
      if(ocrData.suggestCatId&&CATS[ocrData.suggestCatId])setCatId(ocrData.suggestCatId);
      if(ocrData.suggestSubCat)setSubCat(ocrData.suggestSubCat);
    }
  },[ocrData]);

  function handleApiSave(k){setApiKey(k);save({apiKey:k});}
  if(screen==="api")return h(ApiPage,{apiKey,onSave:handleApiSave,back:()=>setScreen("main")});
  async function handlePhotos(ev){
    const files=Array.from(ev.target.files||[]);
    if(!files.length)return;
    if(images.length+files.length>4){setError("最大4枚まで登録できます");return;}
    if(!hasApi){setError("画像の登録にはOpenAI APIキーが必要です");return;}
    setImgLoading(true);setError("");
    try{
      const results=await Promise.all(files.slice(0,4-images.length).map(f=>imgToB64(f,900)));
      setImages(prev=>[...prev,...results]);
      setOcrData(null);setAiImgUrl(null);setDescResult("");
    }catch(e){setError("画像処理エラー: "+e.message);}
    setImgLoading(false);ev.target.value="";
  }
  function removeImg(i){setImages(prev=>prev.filter((_,j)=>j!==i));setOcrData(null);}
  function moveToFirst(i){setImages(prev=>{const a=[...prev];const [el]=a.splice(i,1);a.unshift(el);return a;});}
  async function runAnalyze(){
    if(!images.length){setError("写真をアップロードしてください");return;}
    if(!hasApi){setError("解析にはOpenAI APIキーが必要です");return;}
    setAnalyzing(true);setError("");
    try{
      setGenMsg("🔍 写真をAI解析中...");
      const ocr=await doAnalyze(images.map(i=>i.b64),apiKey);
      if(ocr.model&&ocr.model!=="不明"){
        setGenMsg("🔎 型番から正式スペック照合中...");
        const lookup=await doModelLookup(ocr.model,ocr.brand,ocr,apiKey);
        setOcrData(lookup);
      }else{setOcrData(ocr);}
      setDescResult("");
    }catch(e){setError("解析エラー: "+e.message);}
    setAnalyzing(false);setGenMsg("");
  }
  async function runDalle(){
    if(!images.length){setError("写真をアップロードしてください");return;}
    if(!hasApi){setError("OpenAI APIキーが必要です");return;}
    setGenLoading(true);setGenMsg("🤖 商品を解析中...");setError("");setAiImgUrl(null);
    try{
      let dbText = descResult;
      if(!dbText){
        setGenMsg("📝 先に商品説明(DB)を生成中...");
        const ui={状態:condition,配送:delivery,カテゴリ:isOther?freeCat:subCat,スペック:mainSpec,付属品:accessories,傷状態:scratchNote,値下げ:negotiable?"応相談":"",キャッチコピー:catchCopy};
        dbText = await doDesc(ocrData||{},ui,images[0].b64,apiKey);
        setDescResult(dbText);
      }
      const data={brand:ocrData?.brand,mainSpec,catchCopy,condition,delivery,urgent,dbText};
      setGenMsg("🎨 実写保持AI広告を生成中(20〜40秒)...");
      const url=await doDalleGen(images[0].b64,catId,isOther?freeCat:subCat,data,apiKey,styleMode);
      setAiImgUrl(url);
    }catch(e){setError("AI生成: "+e.message);}
    setGenLoading(false);setGenMsg("");
  }
  async function runDesc(){
    if(!images.length){setError("写真をアップロードしてください");return;}
    if(!hasApi){setError("OpenAI APIキーが必要です");return;}
    setDescLoading(true);setDescResult("");setError("");
    try{
      const ui={状態:condition,配送:delivery,カテゴリ:isOther?freeCat:subCat,スペック:mainSpec,付属品:accessories,傷状態:scratchNote,値下げ:negotiable?"応相談":"",キャッチコピー:catchCopy};
      const txt=await doDesc(ocrData||{},ui,images[0].b64,apiKey);
      setDescResult(txt);
    }catch(e){setError("説明文: "+e.message);}
    setDescLoading(false);
  }
  const canGo=images.length>0&&hasApi&&!genLoading&&!analyzing;
  return h("div",{style:{minHeight:"100vh",background:G.bg,padding:12}},
    h("header",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16,padding:"4px 8px"}},
      h("div",null,
        h("h1",{style:{fontSize:18,fontWeight:900,margin:0,background:"linear-gradient(to right,#fff,#94a3b8)",WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent"}},"AI広告ジェネレーター"),
        h("p",{style:{color:"rgba(255,255,255,.22)",fontSize:9,margin:"1px 0 0"}},"GPT-4o · 実写保持AI広告 · "+VER)
      ),
      h("div",{style:{display:"flex",gap:8}},
        h("button",{onClick:()=>setScreen("api"),style:{background:"rgba(255,255,255,.05)",border:"none",color:"rgba(255,255,255,.4)",fontSize:10,padding:"6px 12px",borderRadius:20,cursor:"pointer"}},"API設定"),
        h("button",{onClick:logout,style:{background:"rgba(255,255,255,.05)",border:"none",color:"rgba(255,255,255,.4)",fontSize:10,padding:"6px 12px",borderRadius:20,cursor:"pointer"}},"ログアウト")
      )
    ),
    h("div",{style:G.card},
      h("div",{style:G.ct},"Step 1 · 商品写真 (最大4枚)"),
      h("div",{style:{display:"flex",gap:8,overflowX:"auto",paddingBottom:5}},
        images.map((img,i)=>h("div",{key:i,style:{position:"relative",flexShrink:0}},
          h("img",{src:img.src,onClick:()=>moveToFirst(i),style:{width:74,height:74,objectFit:"cover",borderRadius:10,border:i===0?"2px solid #FFD700":"1px solid rgba(255,255,255,.1)",cursor:"pointer"}}),
          h("div",{onClick:()=>removeImg(i),style:{position:"absolute",top:-4,right:-4,background:"#ef4444",color:"#fff",width:18,height:18,borderRadius:9,display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,cursor:"pointer",fontWeight:900}},"×"),
          i===0&&h("div",{style:{position:"absolute",bottom:0,left:0,right:0,background:"rgba(255,215,0,.8)",color:"#000",fontSize:8,textAlign:"center",fontWeight:900,borderBottomLeftRadius:8,borderBottomRightRadius:8}},"メイン")
        )),
        images.length<4&&h("label",{style:{width:74,height:74,borderRadius:10,background:"rgba(255,255,255,.03)",border:"2px dashed rgba(255,255,255,.08)",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",cursor:"pointer",flexShrink:0}},
          h("span",{style:{fontSize:20,color:"rgba(255,255,255,.2)"}},"+"),
          h("input",{type:"file",accept:"image/*",multiple:true,onChange:handlePhotos,style:{display:"none"}})
        )
      ),
      imgLoading&&h(Sp,{msg:"画像処理中..."}),
      h("button",{onClick:runAnalyze,disabled:!images.length||analyzing||!hasApi,
        style:PB(images.length&&!analyzing&&hasApi?"linear-gradient(135deg,#6366f1,#4f46e5)":"rgba(255,255,255,.05)",images.length&&!analyzing&&hasApi?"#fff":"rgba(255,255,255,.2)",{marginTop:12,marginBottom:0,fontSize:13})},
        analyzing?"解析中...":"🔍 写真をAI解析する"
      )
    ),
    (analyzing||genMsg)&&h(Sp,{msg:genMsg||"解析中..."}),
    h(OcrPanel,{ocr:ocrData,setOcr:d=>{setOcrData(d);setDescResult("");}}),
    h(ScratchPanel,{ocr:ocrData,onSelect:t=>{setScratchNote(t);setDescResult("");}}),
    h("div",{style:G.card},
      h("div",{style:G.ct},"Step 2 · カテゴリ"),
      h("div",{style:{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:6,marginBottom:10}},
        Object.entries(CATS).map(([id,cat])=>{
          const act=catId===id;
          return h("button",{key:id,onClick:()=>{setCatId(id);setSubCat("");setFreeCat("");setDescResult("");},
            style:{padding:"8px 4px",borderRadius:9,border:act?`2px solid ${cat.c}`:"1px solid rgba(255,255,255,.07)",background:act?"rgba(255,255,255,.06)":"rgba(255,255,255,.022)",color:act?cat.c:"rgba(255,255,255,.36)",cursor:"pointer",fontWeight:act?700:400,fontSize:11,textAlign:"center"}},
            cat.l
          );
        })
      ),
      h("label",{style:G.lbl},"サブカテゴリ"),
      h("select",{value:subCat,onChange:e=>{setSubCat(e.target.value);setDescResult("");},style:G.sel},
        h("option",{value:""},"── 選択してください ──"),
        catTree.subs.map(s=>h("option",{key:s,value:s},s))
      ),
      isOther&&h("div",null,
        h("label",{style:G.lbl},"フリー入力(詳細カテゴリ)"),
        h("input",{placeholder:"例: スマートウォッチ・ゲーム機・ドライヤー など",value:freeCat,onChange:e=>{setFreeCat(e.target.value);setDescResult("");},style:{...G.inp,marginBottom:0}})
      )
    ),
    h("div",{style:G.card},
      h("div",{style:G.ct},"Step 3 · 確定スペック確認"),
      h("label",{style:G.lbl},"主要スペック(型番から自動同期・手入力も可)"),
      h(SpecTags,{
        value:mainSpec,
        onChange:v=>{setMainSpec(v);setDescResult("");},
        suggestions:ocrData?.specTags||[],
      }),
      h("div",{style:{marginBottom:9}}),
      h("label",{style:G.lbl},"キャッチコピー(任意)"),
      h("input",{placeholder:"例: 一人暮らしにぴったり！",value:catchCopy,onChange:e=>{setCatchCopy(e.target.value);setDescResult("");},style:{...G.inp,marginBottom:9}}),
      h("label",{style:G.lbl},"商品の状態"),
      h("select",{value:condition,onChange:e=>{setCondition(e.target.value);setDescResult("");},style:G.sel},
        h("option",{value:""},"── 選択してください ──"),
        ["美品","動作確認済み","良品","やや使用感あり","ジャンク・現状渡し"].map(o=>h("option",{key:o,value:o},o))
      ),
      h("label",{style:G.lbl},"配送・受け渡し"),
      h("select",{value:delivery,onChange:e=>{setDelivery(e.target.value);setDescResult("");},style:G.sel},
        h("option",{value:""},"── 選択してください ──"),
        ["配達可(要相談)","配達可(無料)","自己搬出のみ","発送対応可","引き取り限定","近隣エリア配達対応"].map(o=>h("option",{key:o,value:o},o))
      ),
      h("label",{style:G.lbl},"付属品(任意)"),
      h("input",{placeholder:"例: 本体・取扱説明書・ホースセット付き",value:accessories,onChange:e=>{setAccessories(e.target.value);setDescResult("");},style:{...G.inp,marginBottom:9}}),
      h("label",{style:G.lbl},"傷・状態の記述"),
      h("textarea",{placeholder:"例: 動作良好。外観にわずかなスレはありますが目立ちません。",value:scratchNote,onChange:e=>{setScratchNote(e.target.value);setDescResult("");},style:{...G.ta,minHeight:70,marginBottom:9}}),
      h("div",{style:{display:"flex",gap:12,flexWrap:"wrap"}},
        h("label",{style:{display:"flex",alignItems:"center",gap:5,cursor:"pointer",fontSize:12,color:negotiable?"#fcd34d":"rgba(255,255,255,.32)"}},
          h("input",{type:"checkbox",checked:negotiable,onChange:e=>{setNegotiable(e.target.checked);setDescResult("");},style:{accentColor:"#fcd34d",width:14,height:14}}),"💬 値下げ応相談"),
        h("label",{style:{display:"flex",alignItems:"center",gap:5,cursor:"pointer",fontSize:12,color:urgent?"#f87171":"rgba(255,255,255,.32)"}},
          h("input",{type:"checkbox",checked:urgent,onChange:e=>{setUrgent(e.target.checked);setDescResult("");},style:{accentColor:"#f87171",width:14,height:14}}),"🔥 即売希望(激安バッジ)")
      )
    ),
    h(Err,{msg:error}),
    h("div",{style:G.card},
      h("div",{style:G.ct},"STEP 4 · メルカリ商品説明 自動生成"),
      h("div",{style:{fontSize:11,color:"rgba(255,255,255,.4)",marginBottom:10,lineHeight:1.5}},"ファクトチェック付き・確認できた情報のみで生成します"),
      descLoading&&h(Sp,{msg:"生成・ファクトチェック中..."}),
      h("button",{onClick:runDesc,disabled:descLoading||!images.length||!hasApi,
        style:PB(images.length&&hasApi&&!descLoading?"linear-gradient(135deg,#f59e0b,#ef4444)":"rgba(255,255,255,.05)",images.length&&hasApi&&!descLoading?"#fff":"rgba(255,255,255,.2)",{marginBottom:8,fontSize:13})},
        descLoading?"生成中...":"✨ メルカリ用説明文を自動生成する"
      ),
      descResult&&!descLoading&&h("div",null,
        h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:5}},
          h("span",{style:{fontSize:9,color:"#4ade80",fontWeight:700}},"✅ ファクトチェック済"),
          h("span",{style:{fontSize:10,color:descResult.length>900?"#f87171":descResult.length>600?"#fcd34d":"#4ade80",fontWeight:700}},descResult.length+"文字")
        ),
        h("textarea",{value:descResult,onChange:e=>setDescResult(e.target.value),style:G.ta}),
        h("button",{onClick:()=>{navigator.clipboard?.writeText(descResult).then(()=>{setCopied(true);setTimeout(()=>setCopied(false),2500);});},
          style:PB("rgba(255,255,255,.04)","rgba(255,255,255,.62)",{border:"1px solid rgba(255,255,255,.09)",marginTop:6,marginBottom:0,fontSize:12})},
          copied?"✅ コピー完了！":"📋 コピーする"
        )
      )
    ),
    h("div",{style:G.card},
      h("div",{style:G.ct},"STEP 5 · AI広告画像生成"),
      h("label",{style:G.lbl},"デザイン雰囲気選択"),
      h("div",{style:{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:6,marginBottom:12}},
        Object.entries(PRESETS).map(([id,p])=>{
          const act=styleMode===id;
          return h("button",{key:id,onClick:()=>setStyleMode(id),
            style:{padding:"8px 4px",borderRadius:9,border:act?"2px solid #10b981":"1px solid rgba(255,255,255,.07)",background:act?"rgba(16,185,129,.1)":"rgba(255,255,255,.022)",color:act?"#10b981":"rgba(255,255,255,.36)",cursor:"pointer",fontWeight:act?700:400,fontSize:10,textAlign:"center"}},
            p.l
          );
        })
      ),
      genLoading&&h(Sp,{msg:genMsg}),
      h("button",{onClick:runDalle,disabled:!canGo,
        style:PB(canGo?"linear-gradient(135deg,#10b981,#059669)":"rgba(255,255,255,.06)",canGo?"#fff":"rgba(255,255,255,.22)",{marginBottom:0})},
        genLoading?"生成中...":hasApi?"🎨 DB情報から広告画像を生成":"🎨 AI広告生成(要API設定)"
      )
    ),
    aiImgUrl&&!genLoading&&h("div",{style:{...G.card,textAlign:"center"}},
      h("div",{style:G.ct},"🎨 STEP5 AI広告生成 完了"),
      h("img",{src:aiImgUrl,style:{width:"100%",borderRadius:9,marginBottom:11,boxShadow:"0 6px 26px rgba(0,0,0,.5)"}}),
      h("button",{onClick:()=>window.open(aiImgUrl,"_blank"),style:{padding:"11px 22px",borderRadius:8,background:"linear-gradient(135deg,#10b981,#059669)",border:"none",color:"#fff",fontWeight:900,fontSize:13,cursor:"pointer"}},"⬇️ 画像を開く(長押しで保存)")
    ),
    h("div",{style:{height:14}})
  );
}
function App(){const [ok,setOk]=useState(false);return ok?h(Main,{logout:()=>setOk(false)}):h(Login,{ok:()=>setOk(true)});}
ReactDOM.createRoot(document.getElementById("R")).render(h(App));
</script>
</body>
