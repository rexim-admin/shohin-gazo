// ════════════════════════════════════════════
//  PERSISTENT STORAGE
// ════════════════════════════════════════════
function loadSettings(){
  try{var s=localStorage.getItem(STORAGE_KEY);return s?JSON.parse(s):{};}catch(e){return{};}
}
function saveSettings(obj){
  try{var cur=loadSettings();var merged=Object.assign({},cur,obj);localStorage.setItem(STORAGE_KEY,JSON.stringify(merged));}catch(e){}
}

// ════════════════════════════════════════════
//  IMAGE PROCESSING
// ════════════════════════════════════════════

// 正方形自動クロップ(中央寄せ)
function cropSquare(img){
  var nw=img.naturalWidth||img.width||800,nh=img.naturalHeight||img.height||800,sz=Math.min(nw,nh);
  var c=document.createElement("canvas");c.width=sz;c.height=sz;
  c.getContext("2d").drawImage(img,(nw-sz)/2,(nh-sz)/2,sz,sz,0,0,sz,sz);
  return c;
}

// 簡易背景除去(白〜薄グレー背景を透明化)
function removeWhiteBG(canvas,threshold){
  threshold=threshold||220;
  var ctx=canvas.getContext("2d");
  var img=ctx.getImageData(0,0,canvas.width,canvas.height);
  var d=img.data;
  for(var i=0;i<d.length;i+=4){
    var r=d[i],g=d[i+1],b=d[i+2];
    // 白〜薄グレー判定
    if(r>threshold&&g>threshold&&b>threshold&&Math.abs(r-g)<20&&Math.abs(g-b)<20){
      // 端からの距離も考慮
      var px=(i/4)%canvas.width,py=Math.floor((i/4)/canvas.width);
      var edge=Math.min(px,py,canvas.width-px,canvas.height-py);
      if(edge<canvas.width*0.3){
        // フェード透明化
        var fade=Math.max(0,1-edge/(canvas.width*0.05));
        d[i+3]=Math.round(d[i+3]*(1-fade));
      }
    }
  }
  ctx.putImageData(img,0,0);
  return canvas;
}

// 商品自動切り抜き＆中央配置(ベスト効果用)
function smartCrop(img){
  // 元画像をキャンバスに描画
  var nw=img.naturalWidth||img.width,nh=img.naturalHeight||img.height;
  var c=document.createElement("canvas");c.width=nw;c.height=nh;
  c.getContext("2d").drawImage(img,0,0);

  // 商品領域を推定(中央寄り・暗い部分を商品とする簡易ロジック)
  var ctx=c.getContext("2d");
  var idata=ctx.getImageData(0,0,nw,nh).data;
  var minX=nw,maxX=0,minY=nh,maxY=0;
  for(var y=0;y<nh;y+=4){
    for(var x=0;x<nw;x+=4){
      var i=(y*nw+x)*4;
      var r=idata[i],g=idata[i+1],b=idata[i+2];
      var brightness=(r+g+b)/3;
      if(brightness<200){
        if(x<minX)minX=x;if(x>maxX)maxX=x;
        if(y<minY)minY=y;if(y>maxY)maxY=y;
      }
    }
  }
  // 余白を追加
  var pad=Math.min(nw,nh)*0.06;
  minX=Math.max(0,minX-pad);minY=Math.max(0,minY-pad);
  maxX=Math.min(nw,maxX+pad);maxY=Math.min(nh,maxY+pad);
  var cw=maxX-minX,ch=maxY-minY;
  if(cw<nw*0.3||ch<nh*0.3){return cropSquare(img);} // 検出失敗時は中央クロップ

  // 正方形にして切り出し
  var size=Math.max(cw,ch);
  var cx=(minX+maxX)/2,cy=(minY+maxY)/2;
  var sx=Math.max(0,cx-size/2),sy=Math.max(0,cy-size/2);
  var actualSize=Math.min(size,nw-sx,nh-sy);

  var out=document.createElement("canvas");out.width=actualSize;out.height=actualSize;
  out.getContext("2d").drawImage(c,sx,sy,actualSize,actualSize,0,0,actualSize,actualSize);
  return out;
}

// ════════════════════════════════════════════
//  CANVAS UTILITIES
// ════════════════════════════════════════════
function rrect(ctx,x,y,w,h,r){
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();
}
function radialGlow(ctx,cx,cy,r,rgb,a){
  var g=ctx.createRadialGradient(cx,cy,0,cx,cy,r);
  g.addColorStop(0,"rgba("+rgb+","+a+")");g.addColorStop(1,"rgba("+rgb+",0)");
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fill();
}
function starBurst(ctx,cx,cy,ro,ri,n,fill){
  ctx.beginPath();
  for(var i=0;i<n*2;i++){var a=(i*Math.PI)/n-Math.PI/2,r=i%2===0?ro:ri;i===0?ctx.moveTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r):ctx.lineTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r);}
  ctx.closePath();ctx.fillStyle=fill;ctx.fill();
}
function fitFont(ctx,text,maxW,maxSz,minSz,fontStr){
  for(var sz=maxSz;sz>=minSz;sz-=2){ctx.font=sz+"px "+fontStr;if(ctx.measureText(text).width<=maxW)return sz;}
  return minSz;
}
function shadowText(ctx,text,x,y,fill,sc,sb,ox,oy){
  ctx.save();ctx.shadowColor=sc||"rgba(0,0,0,0.85)";ctx.shadowBlur=sb||20;ctx.shadowOffsetX=ox||0;ctx.shadowOffsetY=oy||3;ctx.fillStyle=fill;ctx.fillText(text,x,y);ctx.restore();
}

// 商品を背景にうまく溶け込ませる影付き描画
function drawProductWithShadow(ctx,src,x,y,w,h,opts){
  opts=opts||{};
  var nw=src.naturalWidth||src.width||1,nh=src.naturalHeight||src.height||1;
  var sc=Math.min(w/nw,h/nh);var dw=nw*sc,dh=nh*sc;
  var dx=x+(w-dw)/2,dy=y+(h-dh)/2;

  // 床影(楕円グラデーション)
  if(opts.floorShadow!==false){
    ctx.save();
    var shadowY=dy+dh*0.98;
    var shadowGrad=ctx.createRadialGradient(dx+dw/2,shadowY,0,dx+dw/2,shadowY,dw*0.45);
    shadowGrad.addColorStop(0,"rgba(0,0,0,"+(opts.shadowAlpha||0.5)+")");
    shadowGrad.addColorStop(0.5,"rgba(0,0,0,"+(opts.shadowAlpha||0.5)*0.5+")");
    shadowGrad.addColorStop(1,"rgba(0,0,0,0)");
    ctx.fillStyle=shadowGrad;
    ctx.translate(dx+dw/2,shadowY);
    ctx.scale(1,0.22);
    ctx.beginPath();ctx.arc(0,0,dw*0.45,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }

  // ドロップシャドウ付き画像
  ctx.save();
  ctx.shadowColor=opts.dropShadowColor||"rgba(0,0,0,0.5)";
  ctx.shadowBlur=opts.dropBlur||40;
  ctx.shadowOffsetX=opts.dropX||0;
  ctx.shadowOffsetY=opts.dropY||14;
  ctx.drawImage(src,dx,dy,dw,dh);
  ctx.restore();
  return {dx:dx,dy:dy,dw:dw,dh:dh};
}

// ════════════════════════════════════════════
//  TEMPLATES (改良版・写真切り抜き対応)
// ════════════════════════════════════════════

// ── 白物家電: 強訴求型(参考画像のスタイル) ─
function tmpl_Appliance_Impact(ctx,src,d,W,H){
  // 背景: 明るい黄色グラデ(参考画像通り)
  var bg=ctx.createRadialGradient(W*0.5,H*0.5,0,W*0.5,H*0.5,W*0.8);
  bg.addColorStop(0,"#FFE055");bg.addColorStop(0.6,"#FFC820");bg.addColorStop(1,"#FF9800");
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

  // 放射状ライン(薄く)
  ctx.save();ctx.translate(W/2,H/2);ctx.globalAlpha=0.08;
  for(var i=0;i<24;i++){
    ctx.rotate(Math.PI/12);
    ctx.fillStyle="#fff";
    ctx.fillRect(-W,-6,W*2,12);
  }
  ctx.restore();

  // 商品(中央寄り・大)
  var iX=W*0.30,iY=H*0.08,iW=W*0.65,iH=H*0.78;
  var r=drawProductWithShadow(ctx,src,iX,iY,iW,iH,{shadowAlpha:0.35,dropBlur:30,dropY:18,dropShadowColor:"rgba(40,20,0,0.4)"});

  // 左上: ブランドロゴ風
  var brand=(d.brand||"").toUpperCase();
  if(brand&&brand!=="その他"&&brand!=="不明"){
    ctx.font="900 78px "+FE;
    var brW=ctx.measureText(brand).width;
    ctx.fillStyle="#E62020";
    ctx.fillText(brand,38,108);
    // 下線
    ctx.fillStyle="#E62020";ctx.fillRect(38,118,brW,4);
  }

  // 左: メインスペック(青で巨大)
  var ms=d.capacity||d.mainSpec||"";
  if(ms){
    var msz=fitFont(ctx,ms,W*0.42,150,80,FE);
    ctx.font="900 "+msz+"px "+FE;
    // 白フチ＋紺色
    ctx.strokeStyle="#ffffff";ctx.lineWidth=14;ctx.lineJoin="round";
    ctx.strokeText(ms,36,220+msz*0.8);
    ctx.fillStyle="#003399";ctx.fillText(ms,36,220+msz*0.8);
  }

  // 中央左: カテゴリ大バナー(縦書き風横書き)
  var cat=d.detailCategory||d.subCategory||"";
  if(cat){
    var catSz=fitFont(ctx,cat,W*0.42,72,42,FJ_HEAVY);
    ctx.font="900 "+catSz+"px "+FJ_HEAVY;
    // オレンジグラデーション
    var catGrad=ctx.createLinearGradient(0,400,0,500);
    catGrad.addColorStop(0,"#FF6B00");catGrad.addColorStop(1,"#E62020");
    ctx.strokeStyle="#ffffff";ctx.lineWidth=10;ctx.lineJoin="round";
    ctx.strokeText(cat,36,400+catSz*0.85);
    ctx.fillStyle=catGrad;ctx.fillText(cat,36,400+catSz*0.85);
  }

  // 下部キャッチコピー
  var copy=d.catchCopy||d.subtitle||"";
  if(copy){
    var cy=H*0.62;
    ctx.fillStyle="rgba(0,30,80,0.9)";
    var cph=72;
    rrect(ctx,28,cy,W*0.45,cph,12);ctx.fill();
    var copySz=fitFont(ctx,copy,W*0.42,30,16,FJ);
    ctx.font="700 "+copySz+"px "+FJ;
    ctx.fillStyle="#ffffff";
    ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.fillText(copy,28+(W*0.45)/2,cy+cph/2);
    ctx.textAlign="left";ctx.textBaseline="alphabetic";
  }

  // バッジ：丸い「動作確認済み」「美品」アイコン
  var aY=H*0.72;
  if(d.condition){
    ctx.save();
    ctx.fillStyle="#1E88E5";
    ctx.beginPath();ctx.arc(80,aY,52,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle="#fff";ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(80,aY,52,0,Math.PI*2);ctx.stroke();
    ctx.font="700 16px "+FJ;ctx.fillStyle="#fff";
    ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.fillText(d.condition.length>5?d.condition.slice(0,5):d.condition,80,aY-8);
    ctx.font="600 11px "+FJ;
    ctx.fillText("OK",80,aY+12);
    ctx.restore();
    ctx.textAlign="left";ctx.textBaseline="alphabetic";
  }

  // 下部赤バナー
  var bH=82,bY=H-bH;
  ctx.fillStyle="#E62020";ctx.fillRect(0,bY,W*0.55,bH);
  // 配達アイコン
  if(d.delivery){
    ctx.font="900 38px "+FJ_HEAVY;
    ctx.fillStyle="#ffffff";
    ctx.fillText("🚚 "+(d.delivery.length>10?"配達可！":d.delivery),24,bY+54);
  }

  // 右下: 激安スターバースト(大)
  if(d.urgent){
    var sbX=W-130,sbY=H-130;
    starBurst(ctx,sbX,sbY,118,78,14,"#E62020");
    ctx.save();
    ctx.shadowColor="rgba(0,0,0,0.4)";ctx.shadowBlur=10;
    ctx.font="900 44px "+FJ_HEAVY;ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillStyle="#FFE000";
    ctx.fillText("激安",sbX,sbY-12);
    ctx.font="900 28px "+FJ_HEAVY;
    ctx.fillText("!",sbX,sbY+22);
    ctx.restore();
    ctx.textAlign="left";ctx.textBaseline="alphabetic";
  }
}

// ── Apple: ミニマル白 ─────────────────────
function tmpl_Apple(ctx,src,d,W,H){
  var bg=ctx.createLinearGradient(0,0,W,H);bg.addColorStop(0,"#fafbfc");bg.addColorStop(1,"#e9ecef");
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  ctx.fillStyle="#1d1d1f";ctx.fillRect(0,0,W,5);
  var iX=W*.08,iY=H*.06,iW=W*.84,iH=H*.58;
  var r=drawProductWithShadow(ctx,src,iX,iY,iW,iH,{shadowAlpha:0.25,dropBlur:35,dropY:16,dropShadowColor:"rgba(0,20,60,0.15)"});
  var sy=iY+iH+24;
  ctx.strokeStyle="rgba(0,0,0,.08)";ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(40,sy);ctx.lineTo(W-40,sy);ctx.stroke();
  var tx=40,ty=sy+30;
  ctx.font="700 18px "+FE;ctx.fillStyle="rgba(0,0,0,.4)";ctx.fillText("APPLE"+(d.model&&d.model!=="不明"?" / "+d.model:""),tx,ty);ty+=8;
  ctx.strokeStyle="rgba(0,0,80,.15)";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(tx,ty);ctx.lineTo(tx+200,ty);ctx.stroke();ty+=24;
  var ms=d.capacity||d.mainSpec||d.detailCategory||d.subCategory||"";
  if(ms){var msz=fitFont(ctx,ms,W-80,72,38,FE);ctx.font="900 "+msz+"px "+FE;ctx.fillStyle="#1d1d1f";ctx.fillText(ms,tx,ty+msz*.86);ty+=msz+10;}
  if(d.color&&d.color!=="不明"){ctx.font="400 18px "+FJ;ctx.fillStyle="rgba(0,0,0,.45)";ctx.fillText(d.color,tx,ty);ty+=24;}
  ty+=8;
  var bx=tx;
  [{t:d.condition},{t:d.delivery&&d.delivery.includes("配達")?"配達対応":null}].filter(function(b){return b.t;}).forEach(function(b){
    ctx.font="700 16px "+FJ;var tw=ctx.measureText(b.t).width+22;
    ctx.fillStyle="#f0f0f3";rrect(ctx,bx,ty,tw,30,15);ctx.fill();
    ctx.strokeStyle="#ddd";ctx.lineWidth=1;rrect(ctx,bx,ty,tw,30,15);ctx.stroke();
    ctx.fillStyle="#333";ctx.fillText(b.t,bx+11,ty+21);bx+=tw+8;
  });
  ctx.fillStyle="#1d1d1f";ctx.fillRect(0,H-44,W,44);
  if(d.delivery){ctx.font="600 17px "+FJ;ctx.fillStyle="rgba(255,255,255,.85)";ctx.fillText(d.delivery,20,H-15);}
}

// ── IKEA・家具: ナチュラル ────────────────
function tmpl_IKEA(ctx,src,d,W,H){
  var bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,"#fdfbf6");bg.addColorStop(1,"#eee5d5");
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  // ノイズ
  ctx.save();ctx.globalAlpha=.02;
  for(var i=0;i<2500;i++){ctx.fillStyle="#000";ctx.fillRect(Math.random()*W,Math.random()*H,1,1);}
  ctx.restore();
  // IKEA青ヘッダー
  ctx.fillStyle="#0058A3";ctx.fillRect(0,0,W,6);
  var iX=0,iY=12,iW=W,iH=H*.56;
  drawProductWithShadow(ctx,src,iX+30,iY,iW-60,iH,{shadowAlpha:0.3,dropBlur:30,dropY:14,dropShadowColor:"rgba(80,50,20,0.25)"});
  var ty=iY+iH+30,tx=36;
  ctx.font="800 22px "+FE;ctx.fillStyle="#0058A3";ctx.fillText("IKEA",tx,ty);
  ctx.font="500 14px "+FJ;ctx.fillStyle="rgba(80,50,20,.5)";ctx.fillText(" "+(d.detailCategory||d.subCategory||""),tx+90,ty);ty+=34;
  var ms=d.detailCategory||d.mainSpec||d.subCategory||"";
  if(ms){var msz=fitFont(ctx,ms,W-72,56,30,FJ_HEAVY);ctx.font="800 "+msz+"px "+FJ_HEAVY;ctx.fillStyle="#3d2b1f";ctx.fillText(ms,tx,ty+msz*.86);ty+=msz+8;}
  if(d.model&&d.model!=="不明"){ctx.font="400 17px 'Courier New',monospace";ctx.fillStyle="rgba(80,50,20,.5)";ctx.fillText(d.model,tx,ty);ty+=24;}
  ty+=6;
  if(d.condition){ctx.font="500 17px "+FJ;ctx.fillStyle="#6b4f3a";ctx.fillText("● 状態：" +d.condition,tx,ty);ty+=24;}
  if(d.delivery){ctx.font="500 15px "+FJ;ctx.fillStyle="#8b6f47";ctx.fillText("🚚 "+d.delivery,tx,ty);}
  ctx.fillStyle="#FFDB00";ctx.fillRect(0,H-50,W,50);
  ctx.fillStyle="#0058A3";ctx.fillRect(0,H-50,W,5);
  if(d.negotiable){ctx.font="800 19px "+FJ_HEAVY;ctx.fillStyle="#0058A3";ctx.fillText("💬 価格応相談",20,H-18);}
}

// ── Dyson: 漆黒プレミアム ─────────────────
function tmpl_Dyson(ctx,src,d,W,H){
  ctx.fillStyle="#060608";ctx.fillRect(0,0,W,H);
  ctx.save();ctx.globalAlpha=.04;
  for(var x=0;x<W;x+=28){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.strokeStyle="#9333ea";ctx.lineWidth=.5;ctx.stroke();}
  for(var y=0;y<H;y+=28){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.strokeStyle="#9333ea";ctx.lineWidth=.5;ctx.stroke();}
  ctx.restore();
  ctx.save();ctx.globalAlpha=.15;radialGlow(ctx,W*.5,H*.4,W*.6,"147,51,234",.45);ctx.restore();
  ctx.save();ctx.globalAlpha=.08;radialGlow(ctx,W*.2,H*.15,W*.35,"180,100,255",.4);ctx.restore();
  var iX=W*.06,iY=H*.05,iW=W*.88,iH=H*.62;
  var r=drawProductWithShadow(ctx,src,iX,iY,iW,iH,{shadowAlpha:0.3,floorShadow:false,dropBlur:70,dropShadowColor:"rgba(147,51,234,0.4)"});
  // 床反射
  ctx.save();ctx.globalAlpha=.08;ctx.transform(1,0,0,-.2,0,(r.dy+r.dh)*1.2);ctx.drawImage(src,r.dx,r.dy,r.dw,r.dh);ctx.restore();
  var refGrad=ctx.createLinearGradient(0,r.dy+r.dh,0,r.dy+r.dh+80);
  refGrad.addColorStop(0,"rgba(6,6,8,0)");refGrad.addColorStop(1,"rgba(6,6,8,1)");
  ctx.fillStyle=refGrad;ctx.fillRect(0,r.dy+r.dh,W,80);
  ctx.textAlign="center";
  var ty=H*.75;
  ctx.font="500 19px "+FE;ctx.fillStyle="rgba(200,150,255,.5)";ctx.fillText("DYSON",W*.5,ty);ty+=32;
  var ms=d.detailCategory||d.subCategory||d.mainSpec||"";
  if(ms){var msz=fitFont(ctx,ms,W*.85,58,30,FJ_HEAVY);ctx.font="900 "+msz+"px "+FJ_HEAVY;
    var tg=ctx.createLinearGradient(W*.15,0,W*.85,0);tg.addColorStop(0,"#c084fc");tg.addColorStop(.5,"#ffffff");tg.addColorStop(1,"#a855f7");
    ctx.fillStyle=tg;ctx.fillText(ms,W*.5,ty+msz*.86);ty+=msz+6;}
  if(d.model&&d.model!=="不明"){ctx.font="300 16px 'Courier New',monospace";ctx.fillStyle="rgba(255,255,255,.28)";ctx.fillText(d.model,W*.5,ty);ty+=24;}
  ctx.textAlign="left";
  var bs=[];if(d.condition)bs.push(d.condition);if(d.delivery&&d.delivery.includes("配達"))bs.push("配達可");
  var bW=0;ctx.font="700 16px "+FJ;bs.forEach(function(t){bW+=ctx.measureText(t).width+34;});
  var bx=(W-bW)/2;
  bs.forEach(function(t){var tw=ctx.measureText(t).width+30;
    ctx.strokeStyle="rgba(167,139,250,.4)";ctx.lineWidth=1;rrect(ctx,bx,ty,tw,30,15);ctx.stroke();
    ctx.fillStyle="rgba(255,255,255,.06)";rrect(ctx,bx,ty,tw,30,15);ctx.fill();
    ctx.fillStyle="rgba(200,170,255,.85)";ctx.fillText(t,bx+15,ty+20);bx+=tw+7;});
}

async function callClaude(msgs,max){
  var r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:max||800,messages:msgs})});
  var d=await r.json();if(d.error)throw new Error("Claude: "+d.error.message);
  return d.content.map(function(c){return c.text||"";}).join("");
}
async function callOAI(key,msgs,max){
  var r=await fetch("https://api.openai.com/v1/chat/completions",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+key},body:JSON.stringify({model:"gpt-4o",max_tokens:max||800,messages:msgs})});
  var d=await r.json();if(d.error)throw new Error("OpenAI: "+d.error.message);
  return d.choices[0].message.content;
}
function parseJSON(txt){var m=txt.match(/\{[\s\S]*\}/);if(!m)throw new Error("JSON解析失敗");return JSON.parse(m[0]);}

// OCR(複数画像対応)
async function doMultiOCR(b64Array,apiKey){
  var prompt='これらの商品画像(複数枚)を高精度OCR解析してください。型番ラベル・銘板・操作パネル等を重点的に読み取り。\n\n優先抽出(順):\n1.型番 2.メーカー 3.容量/サイズ 4.年式 5.カテゴリ 6.色\n\n厳守: 画像から読めない情報は"不明"。推測・補完禁止。\n\nJSONのみ:\n{"brand":"","model":"","capacity":"","year":"","category":"","color":"","confidence":{"brand":0.0,"model":0.0,"capacity":0.0},"rawOCR":"読み取れたテキスト全部","suggestCategoryId":"appliance|ikea|apple|dyson|pc|small|other","suggestSubCategory":"具体的サブカテゴリ名"}';
  var content;
  if(apiKey&&apiKey.startsWith("sk-")){
    content=b64Array.map(function(b64){return {type:"image_url",image_url:{url:"data:image/jpeg;base64,"+b64}};});
    content.push({type:"text",text:prompt});
    var text=await callOAI(apiKey,[{role:"user",content:content}],700);
    return parseJSON(text);
  }else{
    content=b64Array.map(function(b64){return {type:"image",source:{type:"base64",media_type:"image/jpeg",data:b64}};});
    content.push({type:"text",text:prompt});
    var text=await callClaude([{role:"user",content:content}],700);
    return parseJSON(text);
  }
}

// 商品説明＋ハルシネーション2段検証
async function genDescription(platform,ocr,userInputs,b64,apiKey){
  var pCfg={
    mercari:{r:"iPhoneの絵文字を積極使用(📦✅💡🔧🌟🚚💬など)。目標500文字以内(最大1000字)。改行で整理。最後に「お気軽にコメントどうぞ😊」",f:"絵文字なし・情報過多"},
    yahoo:{r:"絵文字禁止。【】★●◆■のみ使用。【商品名】【状態】【特徴】【配送】の構造で整理。目標500字以内。丁寧語。",f:"絵文字・くだけた表現"},
    jimoty:{r:"300字以内・超簡潔。絵文字最大2個。場所・受け渡し・価格交渉の可否を必ず明記。即売を意識した直接的な文体。",f:"長文・装飾"},
  };
  var pc=pCfg[platform];
  var ocrStr=["メーカー:"+(ocr.brand||"不明"),"型番:"+(ocr.model||"不明"),"容量:"+(ocr.capacity||"不明"),"年式:"+(ocr.year||"不明"),"カテゴリ:"+(ocr.category||"不明")].join(" / ");
  var userStr=Object.entries(userInputs).filter(function(kv){return kv[1];}).map(function(kv){return kv[0]+": "+kv[1];}).join("\n");
  var genP="あなたは中古販売のプロです。\n\n【確認済み情報・これ以外を絶対に記述してはいけません】\n"+ocrStr+"\n\n【ユーザー入力】\n"+userStr+"\n\n【ルール】"+pc.r+"\n【禁止】"+pc.f+"\n画像で確認できない機能・付属品・バッテリー状態・消耗品状態・年式の推測一切禁止。\n\n説明文のみ返答:";
  var imgMsgClaude={type:"image",source:{type:"base64",media_type:"image/jpeg",data:b64}};
  var draft;
  if(apiKey&&apiKey.startsWith("sk-")){
    draft=await callOAI(apiKey,[{role:"user",content:[{type:"image_url",image_url:{url:"data:image/jpeg;base64,"+b64}},{type:"text",text:genP}]}],900);
  }else{
    draft=await callClaude([{role:"user",content:[imgMsgClaude,{type:"text",text:genP}]}],900);
  }

  // 1段目検証
  var checkP1="以下の商品説明文を厳格に検証してください。\n\n【確認済み情報】\n"+ocrStr+"\n【ユーザー入力】\n"+userStr+"\n\n【検証対象】\n"+draft+"\n\n以下の問題箇所を修正:\n- 確認情報にない機能・スペック記述\n- 推測語(〜と思われる/〜でしょう/〜のはず)\n- 付属品の推測\n- バッテリー・消耗品状態の推測\n- 年式・製造時期の推測\n- メーカー独自機能の推測\n\n修正版のみ返答(説明不要)。問題なければそのまま返答。";
  var v1;
  if(apiKey&&apiKey.startsWith("sk-"))v1=await callOAI(apiKey,[{role:"user",content:checkP1}],900);
  else v1=await callClaude([{role:"user",content:checkP1}],900);

  // 2段目最終チェック
  var checkP2="以下のテキストに残っているハルシネーション(画像にない情報・推測)を再度チェックして、最終的に画像で確認できる情報とユーザー入力のみの記述にしてください。\n\n確認情報: "+ocrStr+"\nユーザー: "+userStr+"\n\nテキスト:\n"+v1+"\n\n最終版のみ返答。";
  var v2;
  if(apiKey&&apiKey.startsWith("sk-"))v2=await callOAI(apiKey,[{role:"user",content:checkP2}],900);
  else v2=await callClaude([{role:"user",content:checkP2}],900);
  return v2.trim();
}

// GPT-4o によるAI画像合成プロンプト生成
async function genAIImagePrompt(b64,catId,subCat,detail,data,apiKey){
  var lockedStyle = STYLE_LOCKED[catId] || STYLE_LOCKED.other;
  var productInfo = [
    data.brand ? "Brand: "+data.brand : "",
    data.capacity || data.mainSpec ? "Spec: "+(data.capacity||data.mainSpec) : "",
    subCat ? "Category: "+subCat : "",
    detail ? "Detail: "+detail : "",
    data.catchCopy ? "Catchphrase: "+data.catchCopy : "",
    data.condition ? "Condition: "+data.condition : "",
    data.delivery ? "Delivery: "+data.delivery : "",
  ].filter(Boolean).join(", ");

  // GPT-4oに写真を見せて、商品の正確な英語説明文を作らせる
  var analyzePrompt = "Look at this product photo carefully. Describe ONLY what you can clearly see: the product type, exact color, shape, position, visible text/labels, and material. Be precise and concrete. Output 2-3 sentences in English. Do not speculate.";
  var productDesc;
  if(apiKey&&apiKey.startsWith("sk-")){

  }else{
    productDesc=await callClaude([{role:"user",content:[{type:"image",source:{type:"base64",media_type:"image/jpeg",data:b64}},{type:"text",text:analyzePrompt}]}],300);
  }

  // 最終的なDALL-Eプロンプト(バックエンド強制スタイル)
  var finalPrompt = "Professional Japanese product advertisement image, 1:1 square composition.\n\n"+
    "PRODUCT VISIBLE IN PHOTO: "+productDesc.trim()+"\n\n"+
    "PRODUCT INFO: "+productInfo+"\n\n"+
    "STYLE REQUIREMENTS (MANDATORY): "+lockedStyle+"\n\n"+
    "CRITICAL RULES:\n"+
    "- The product must be CLEANLY CUT OUT from any original background (no white edges, no halo)\n"+
    "- Natural realistic drop shadow under the product\n"+
    "- Subtle floor/surface reflection or ground shadow\n"+
    "- Large clear readable Japanese text where specified\n"+
    "- NO watermarks, NO logos other than the brand mentioned\n"+
    "- NO price tags or numbers (we don't show prices)\n"+
    "- Print-quality professional advertising photograph\n"+
    "- The product appearance must match the original photo exactly (same color, same shape, same model)\n"+
    (data.urgent ? "- Include a large red explosive starburst badge saying '激安' (super cheap) in yellow text\n" : "")+
    "Style: like a real Japanese used-goods reseller's professional photoshop ad, NOT an AI-generated look.";

  // 文字数制限(DALL-Eは4000字まで)
  if(finalPrompt.length>3800) finalPrompt = finalPrompt.substring(0,3800);
  return finalPrompt;
}

// DALL-E 3 で画像生成(OpenAI APIキー必須)
async function genAIImage(b64,catId,subCat,detail,data,apiKey){
  if(!apiKey||!apiKey.startsWith("sk-"))throw new Error("AI画像生成にはOpenAI APIキーが必要です。API設定画面で登録してください。");
  var promptText=await genAIImagePrompt(b64,catId,subCat,detail,data,apiKey);
  var r=await fetch("https://api.openai.com/v1/images/generations",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+apiKey},body:JSON.stringify({model:"dall-e-3",prompt:promptText,n:1,size:"1024x1024",quality:"hd",style:"vivid"})});
  var d=await r.json();if(d.error)throw new Error("DALL-E: "+d.error.message);
  return d.data[0].url;
}
