<body>

<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script>
// ════════════════════════════════════════════
//  CONFIG
// ════════════════════════════════════════════
const APP_PW = "shop2024";
const FJ = "'Noto Sans JP',sans-serif";
const FE = "'Montserrat','Noto Sans JP',sans-serif";
const {useState,useRef,useEffect} = React;
const E = React.createElement;

// ── 大カテゴリ定義 ─────────────────────────
const CATEGORIES = [
  {id:"appliance", label:"🏠 白物家電", color:"#FF8C00", theme:"dark"},
  {id:"apple",     label:"🍎 Apple",   color:"#aaaaaa", theme:"light"},
  {id:"furniture", label:"🛋 家具",    color:"#8B6F47", theme:"warm"},
  {id:"dyson",     label:"💜 Dyson",   color:"#9333ea", theme:"dark"},

  {id:"other",     label:"📦 その他",  color:"#6b7280", theme:"dark"},
];

// ── スタイル定数 ───────────────────────────
const S = {
  wrap: {minHeight:"100vh",background:"linear-gradient(160deg,#090912,#0f0f1e,#07070f)",padding:13},
  inn:  {maxWidth:640,margin:"0 auto"},
  card: {background:"rgba(255,255,255,0.048)",borderRadius:14,padding:"14px 16px",marginBottom:11,border:"1px solid rgba(255,255,255,0.065)"},
  card2:{background:"rgba(255,255,255,0.028)",borderRadius:11,padding:"11px 13px",marginBottom:10,border:"1px solid rgba(255,255,255,0.05)"},
  ct:   {fontSize:10,color:"#FFD700",fontWeight:700,marginBottom:9,letterSpacing:1.5,textTransform:"uppercase"},
  sel:  {width:"100%",padding:"11px 13px",borderRadius:9,border:"1px solid rgba(255,255,255,0.11)",background:"rgba(255,255,255,0.055)",color:"#fff",fontSize:14,marginBottom:10,outline:"none"},
  inp:  {width:"100%",padding:"11px 13px",borderRadius:9,border:"1px solid rgba(255,255,255,0.11)",background:"rgba(255,255,255,0.055)",color:"#fff",fontSize:14,outline:"none",boxSizing:"border-box"},
  ta:   {width:"100%",padding:"12px 14px",borderRadius:10,border:"1px solid rgba(255,255,255,0.1)",background:"rgba(0,0,0,0.35)",color:"#ddd",fontSize:13,outline:"none",boxSizing:"border-box",resize:"vertical",lineHeight:1.8,minHeight:190},
  err:  {background:"rgba(220,38,38,0.09)",border:"1px solid rgba(220,38,38,0.28)",borderRadius:9,padding:"10px 14px",marginBottom:11,color:"#fca5a5",fontSize:13},
  lbl:  {display:"block",fontSize:11,color:"#777",marginBottom:4,letterSpacing:.4},
};
function PB(bg,fc,ex){return Object.assign({width:"100%",padding:"14px",borderRadius:12,background:bg,border:"none",color:fc,fontWeight:900,fontSize:15,cursor:"pointer",marginBottom:10,transition:"opacity .15s"},ex||{});}

// ════════════════════════════════════════════
//  CANVAS ENGINE
// ════════════════════════════════════════════
function rrect(ctx,x,y,w,h,r){
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();
}
function radialGlow(ctx,cx,cy,r,rgb,a){
  var g=ctx.createRadialGradient(cx,cy,0,cx,cy,r);
  g.addColorStop(0,"rgba("+rgb+","+a+")");g.addColorStop(1,"rgba("+rgb+",0)");
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fill();
}
function starBurst(ctx,cx,cy,ro,ri,n,fill){
  ctx.beginPath();
  for(var i=0;i<n*2;i++){var a=(i*Math.PI)/n-Math.PI/2,r=i%2===0?ro:ri;i===0?ctx.moveTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r):ctx.lineTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r);}
  ctx.closePath();ctx.fillStyle=fill;ctx.fill();
}
function fitFont(ctx,text,maxW,maxSz,minSz,fontStr){
  for(var sz=maxSz;sz>=minSz;sz-=2){ctx.font=sz+"px "+fontStr;if(ctx.measureText(text).width<=maxW)return sz;}
  return minSz;
}
function shadowText(ctx,text,x,y,fill,sc,sb,ox,oy){
  ctx.save();ctx.shadowColor=sc||"rgba(0,0,0,0.85)";ctx.shadowBlur=sb||20;ctx.shadowOffsetX=ox||0;ctx.shadowOffsetY=oy||3;ctx.fillStyle=fill;ctx.fillText(text,x,y);ctx.restore();
}
function drawImg(ctx,img,x,y,w,h){
  var nw=img.naturalWidth||img.width||1,nh=img.naturalHeight||img.height||1;
  var sc=Math.min(w/nw,h/nh);var dw=nw*sc,dh=nh*sc;
  ctx.drawImage(img,x+(w-dw)/2,y+(h-dh)/2,dw,dh);
  return {dw,dh,dx:x+(w-dw)/2,dy:y+(h-dh)/2};
}

// ── 白物家電: 強訴求型 ────────────────────
function tmpl_Appliance_Impact(ctx,img,d,W,H){
  // 背景
  var bg=ctx.createLinearGradient(0,0,W,H);
  bg.addColorStop(0,"#0b1828");bg.addColorStop(.55,"#0e1f3a");bg.addColorStop(1,"#060d18");
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  // 斜めストライプ
  ctx.save();ctx.globalAlpha=.025;
  for(var i=-W;i<W*2;i+=55){ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i+35,H);ctx.lineTo(i+44,H);ctx.lineTo(i+9,0);ctx.closePath();ctx.fillStyle="#fff";ctx.fill();}
  ctx.restore();
  // アクセントグロー
  ctx.save();ctx.globalAlpha=.18;radialGlow(ctx,0,0,W*.55,"255,150,0",.28);ctx.restore();
  ctx.save();ctx.globalAlpha=.07;radialGlow(ctx,W,H,W*.5,"0,80,200",.35);ctx.restore();
  // 商品画像(右・大)
  var iX=W*.36,iY=H*.08,iW=W*.6,iH=H*.74;
  ctx.save();ctx.shadowColor="rgba(0,15,50,.65)";ctx.shadowBlur=50;ctx.shadowOffsetX=-8;ctx.shadowOffsetY=18;
  var ir=drawImg(ctx,img,iX,iY,iW,iH);ctx.restore();
  // 床影
  ctx.save();ctx.globalAlpha=.3;
  var sg=ctx.createRadialGradient(ir.dx+ir.dw*.5,ir.dy+ir.dh+10,0,ir.dx+ir.dw*.5,ir.dy+ir.dh+10,ir.dw*.45);
  sg.addColorStop(0,"rgba(0,0,0,.7)");sg.addColorStop(1,"rgba(0,0,0,0)");
  ctx.fillStyle=sg;ctx.scale(1,.22);ctx.beginPath();ctx.arc(ir.dx+ir.dw*.5,(ir.dy+ir.dh+10)*4.5,ir.dw*.45,0,Math.PI*2);ctx.fill();
  ctx.restore();
  // 左テキスト
  var lx=36,ly=58,lw=W*.34;
  // ブランド
  var br=(d.brand||"").toUpperCase();
  if(br&&br!=="その他"&&br!=="不明"){
    var bsz=fitFont(ctx,br,lw*.92,56,28,FE);
    ctx.font="900 "+bsz+"px "+FE;
    shadowText(ctx,br,lx,ly+bsz*.86,"#ffffff","rgba(0,0,0,.9)",28,0,4);ly+=bsz+6;
  }
  // カテゴリ
  var cat=d.detailCategory||d.autoCategory||"";
  if(cat){ctx.font="300 20px "+FJ;ctx.fillStyle="rgba(255,255,255,.45)";ctx.fillText(cat,lx,ly);ly+=30;}
  // メインスペック(超大)
  var ms=d.capacity||d.mainSpec||"";
  if(ms){
    var msz=fitFont(ctx,ms,lw*.93,104,46,FE);
    ctx.font="900 "+msz+"px "+FE;
    shadowText(ctx,ms,lx,ly+msz*.88,"#FFD700","rgba(0,0,0,.9)",32,0,4);ly+=msz+6;
  }
  // 型番
  if(d.model&&d.model!=="不明"){ctx.font="400 18px 'Courier New',monospace";ctx.fillStyle="rgba(255,255,255,.35)";ctx.fillText(d.model,lx,ly);ly+=27;}
  ly+=10;
  // バッジ
  var badges=[];
  if(d.condition==="美品")badges.push({t:"✨ 美品",bg:"rgba(74,222,128,.18)",fc:"#4ade80",bc:"rgba(74,222,128,.38)"});
  else if(d.condition==="動作確認済み")badges.push({t:"✅ 動作確認済",bg:"rgba(74,222,128,.14)",fc:"#86efac",bc:"rgba(74,222,128,.3)"});
  else if(d.condition)badges.push({t:d.condition,bg:"rgba(255,255,255,.07)",fc:"rgba(255,255,255,.7)",bc:"rgba(255,255,255,.15)"});
  if(d.delivery&&d.delivery.includes("配達"))badges.push({t:"🚚 配達可",bg:"rgba(96,165,250,.16)",fc:"#93c5fd",bc:"rgba(96,165,250,.35)"});
  if(d.negotiable)badges.push({t:"💬 値下げ相談OK",bg:"rgba(251,191,36,.13)",fc:"#fcd34d",bc:"rgba(251,191,36,.3)"});
  badges.forEach(function(b){
    ctx.font="700 19px "+FJ;var tw=ctx.measureText(b.t).width+30;
    ctx.fillStyle=b.bg;rrect(ctx,lx,ly,tw,32,16);ctx.fill();
    ctx.strokeStyle=b.bc;ctx.lineWidth=1;rrect(ctx,lx,ly,tw,32,16);ctx.stroke();
    ctx.fillStyle=b.fc;ctx.fillText(b.t,lx+15,ly+22);ly+=40;
  });
  // 下帯
  var bH=65,bY=H-bH;
  var bar=ctx.createLinearGradient(0,bY,W,bY);
  bar.addColorStop(0,"rgba(230,90,0,.88)");bar.addColorStop(.5,"rgba(200,20,0,.93)");bar.addColorStop(1,"rgba(160,0,0,.88)");
  ctx.fillStyle=bar;ctx.fillRect(0,bY,W,bH);
  ctx.strokeStyle="rgba(255,200,0,.4)";ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(0,bY);ctx.lineTo(W,bY);ctx.stroke();
  if(d.delivery){ctx.font="700 24px "+FJ;shadowText(ctx,"🚚 "+d.delivery,22,bY+42,"#ffffff","rgba(0,0,0,.5)",8,0,2);}
  // スターバースト
  if(d.urgent){
    starBurst(ctx,W-86,bY-86,78,52,12,"#CC0000");
    ctx.save();ctx.font="900 28px "+FJ;ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillStyle="#FFE000";ctx.fillText("激安",W-86,bY-86);ctx.restore();ctx.textAlign="left";ctx.textBaseline="alphabetic";
  }
}

// ── Apple: ミニマル白 ──────────────────────
function tmpl_Apple(ctx,img,d,W,H){
  // 白背景グラデ
  var bg=ctx.createLinearGradient(0,0,W,H);bg.addColorStop(0,"#f8f9fa");bg.addColorStop(1,"#e9ecef");
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  // 上部アクセントライン(細・黒)
  ctx.fillStyle="#1d1d1f";ctx.fillRect(0,0,W,5);
  // 商品(中央・余白たっぷり)
  var iX=W*.08,iY=H*.06,iW=W*.84,iH=H*.58;
  ctx.save();ctx.shadowColor="rgba(0,0,0,.15)";ctx.shadowBlur=40;ctx.shadowOffsetX=0;ctx.shadowOffsetY=16;
  var ir=drawImg(ctx,img,iX,iY,iW,iH);ctx.restore();
  // 区切り
  var sy=iY+iH+20;
  ctx.strokeStyle="rgba(0,0,0,.1)";ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(40,sy);ctx.lineTo(W-40,sy);ctx.stroke();
  // テキスト
  var tx=40,ty=sy+26;
  // Apple ロゴ的表記
  ctx.font="700 18px "+FE;ctx.fillStyle="rgba(0,0,0,.35)";ctx.fillText("APPLE"+(d.model&&d.model!=="不明"?" / "+d.model:""),tx,ty);ty+=4;
  ctx.strokeStyle="rgba(0,0,80,.1)";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(tx,ty);ctx.lineTo(tx+200,ty);ctx.stroke();ty+=22;
  // 商品名・スペック
  var ms=d.capacity||d.mainSpec||d.detailCategory||"";
  if(ms){var msz=fitFont(ctx,ms,W-80,68,36,FE);ctx.font="900 "+msz+"px "+FE;ctx.fillStyle="#1d1d1f";ctx.fillText(ms,tx,ty+msz*.86);ty+=msz+8;}
  if(d.color&&d.color!=="不明"){ctx.font="300 17px "+FJ;ctx.fillStyle="rgba(0,0,0,.4)";ctx.fillText(d.color,tx,ty);ty+=24;}
  ty+=8;
  // バッジ(グレー系)
  var bx=tx;
  [{t:d.condition,bg:"#f0f0f0",fc:"#333",bc:"#ddd"},{t:d.delivery&&d.delivery.includes("配達")?"配達対応":null}].filter(function(b){return b.t;}).forEach(function(b){
    ctx.font="700 16px "+FJ;var tw=ctx.measureText(b.t).width+20;
    ctx.fillStyle=b.bg||"#f0f0f0";rrect(ctx,bx,ty,tw,28,14);ctx.fill();
    ctx.strokeStyle=b.bc||"#ddd";ctx.lineWidth=1;rrect(ctx,bx,ty,tw,28,14);ctx.stroke();
    ctx.fillStyle=b.fc||"#333";ctx.fillText(b.t,bx+10,ty+19);bx+=tw+8;
  });
  // 下部バー(黒)
  ctx.fillStyle="#1d1d1f";ctx.fillRect(0,H-42,W,42);
  if(d.delivery){ctx.font="600 17px "+FJ;ctx.fillStyle="rgba(255,255,255,.8)";ctx.fillText(d.delivery,20,H-14);}
}

// ── 家具: ナチュラル北欧 ──────────────────
function tmpl_Furniture(ctx,img,d,W,H){
  var bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,"#faf7f2");bg.addColorStop(1,"#f0ebe0");
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  // ノイズテクスチャ風(点)
  ctx.save();ctx.globalAlpha=.025;
  for(var i=0;i<W;i+=4)for(var j=0;j<H;j+=4){if(Math.random()>.5){ctx.fillStyle="rgba(0,0,0,.5)";ctx.fillRect(i,j,1,1);}}
  ctx.restore();
  // 上部カラー帯
  ctx.fillStyle="#6b4f3a";ctx.fillRect(0,0,W,6);
  // 商品(上部・大)
  var iX=0,iY=6,iW=W,iH=H*.58;
  ctx.save();ctx.shadowColor="rgba(60,30,0,.18)";ctx.shadowBlur=30;ctx.shadowOffsetX=0;ctx.shadowOffsetY=14;
  drawImg(ctx,img,iX,iY,iW,iH);ctx.restore();
  // テキストエリア
  var ty=iY+iH+24,tx=30;
  ctx.font="700 18px "+FE;ctx.fillStyle="rgba(80,50,20,.45)";ctx.fillText((d.brand||"").toUpperCase(),tx,ty);ty+=28;
  var ms=d.detailCategory||d.mainSpec||"";
  if(ms){var msz=fitFont(ctx,ms,W-60,54,30,FJ);ctx.font="900 "+msz+"px "+FJ;ctx.fillStyle="#3d2b1f";ctx.fillText(ms,tx,ty+msz*.86);ty+=msz+6;}
  ctx.font="300 18px "+FJ;ctx.fillStyle="rgba(80,50,20,.5)";
  if(d.model&&d.model!=="不明"){ctx.fillText(d.model,tx,ty);ty+=24;}
  ty+=8;
  if(d.condition){ctx.font="400 17px "+FJ;ctx.fillStyle="#6b4f3a";ctx.fillText("状態："+d.condition,tx,ty);ty+=24;}
  if(d.delivery){ctx.font="400 16px "+FJ;ctx.fillStyle="#8b6f47";ctx.fillText("🚚 "+d.delivery,tx,ty);}
  ctx.fillStyle="#6b4f3a";ctx.fillRect(0,H-40,W,40);
  if(d.negotiable){ctx.font="700 18px "+FJ;ctx.fillStyle="rgba(255,255,255,.85)";ctx.fillText("💬 価格応相談",20,H-12);}
}

// ── Dyson: 漆黒プレミアム ─────────────────
function tmpl_Dyson(ctx,img,d,W,H){
  ctx.fillStyle="#070709";ctx.fillRect(0,0,W,H);
  // マイクログリッド
  ctx.save();ctx.globalAlpha=.035;
  for(var x=0;x<W;x+=28){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.strokeStyle="#9333ea";ctx.lineWidth=.5;ctx.stroke();}
  for(var y=0;y<H;y+=28){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.strokeStyle="#9333ea";ctx.lineWidth=.5;ctx.stroke();}
  ctx.restore();
  // パープルグロー(複数)
  ctx.save();ctx.globalAlpha=.12;radialGlow(ctx,W*.5,H*.38,W*.6,"147,51,234",.4);ctx.restore();
  ctx.save();ctx.globalAlpha=.06;radialGlow(ctx,W*.2,H*.2,W*.35,"180,100,255",.35);ctx.restore();
  // 商品(中央・大・グロー)
  var iX=W*.06,iY=H*.06,iW=W*.88,iH=H*.62;
  ctx.save();ctx.shadowColor="rgba(147,51,234,.35)";ctx.shadowBlur=70;ctx.shadowOffsetX=0;ctx.shadowOffsetY=0;
  var ir=drawImg(ctx,img,iX,iY,iW,iH);ctx.restore();
  // 床反射
  ctx.save();ctx.globalAlpha=.06;ctx.transform(1,0,0,-.2,0,(ir.dy+ir.dh)*1.2);drawImg(ctx,img,iX,iY,iW,iH);ctx.restore();
  var refGrad=ctx.createLinearGradient(0,ir.dy+ir.dh,0,ir.dy+ir.dh+70);
  refGrad.addColorStop(0,"rgba(7,7,9,0)");refGrad.addColorStop(1,"rgba(7,7,9,1)");
  ctx.fillStyle=refGrad;ctx.fillRect(0,ir.dy+ir.dh,W,70);
  // テキスト(中央下)
  ctx.textAlign="center";
  var ty=H*.74;
  ctx.font="300 19px "+FE;ctx.fillStyle="rgba(200,150,255,.45)";ctx.fillText("DYSON",W*.5,ty);ty+=28;
  var ms=d.detailCategory||d.mainSpec||"";
  if(ms){var msz=fitFont(ctx,ms,W*.8,60,32,FE);ctx.font="900 "+msz+"px "+FE;
    var tg=ctx.createLinearGradient(W*.15,0,W*.85,0);tg.addColorStop(0,"#c084fc");tg.addColorStop(.5,"#ffffff");tg.addColorStop(1,"#a855f7");
    ctx.fillStyle=tg;ctx.fillText(ms,W*.5,ty+msz*.86);ty+=msz+4;}
  if(d.model&&d.model!=="不明"){ctx.font="300 16px 'Courier New',monospace";ctx.fillStyle="rgba(255,255,255,.22)";ctx.fillText(d.model,W*.5,ty);ty+=22;}
  ctx.textAlign="left";
  // バッジ中央
  var bs=[];if(d.condition)bs.push(d.condition);if(d.delivery&&d.delivery.includes("配達"))bs.push("配達可");
  var bW=0;ctx.font="700 16px "+FJ;bs.forEach(function(t){bW+=ctx.measureText(t).width+36;});
  var bx=(W-bW)/2;
  bs.forEach(function(t){var tw=ctx.measureText(t).width+30;
    ctx.strokeStyle="rgba(167,139,250,.35)";ctx.lineWidth=1;rrect(ctx,bx,ty,tw,28,14);ctx.stroke();
    ctx.fillStyle="rgba(255,255,255,.05)";rrect(ctx,bx,ty,tw,28,14);ctx.fill();
    ctx.fillStyle="rgba(200,170,255,.8)";ctx.fillText(t,bx+15,ty+19);bx+=tw+7;});
}

// ── PC・ガジェット: モダンテック ─────────
function tmpl_PC(ctx,img,d,W,H){
  var bg=ctx.createLinearGradient(0,0,W,H);bg.addColorStop(0,"#0c1220");bg.addColorStop(.5,"#0f1828");bg.addColorStop(1,"#080d18");
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  // ブルーグロー
  ctx.save();ctx.globalAlpha=.1;radialGlow(ctx,W*.75,H*.25,W*.5,"59,130,246",.4);ctx.restore();
  ctx.save();ctx.globalAlpha=.06;radialGlow(ctx,W*.25,H*.75,W*.4,"16,185,129",.35);ctx.restore();
  // 商品(右寄せ)
  var iX=W*.32,iY=H*.06,iW=W*.64,iH=H*.7;
  ctx.save();ctx.shadowColor="rgba(59,130,246,.3)";ctx.shadowBlur=50;ctx.shadowOffsetX=0;ctx.shadowOffsetY=10;
  drawImg(ctx,img,iX,iY,iW,iH);ctx.restore();
  // 左テキスト
  var lx=28,ly=60,lw=W*.30;
  if(d.brand){var bsz=fitFont(ctx,d.brand.toUpperCase(),lw*.92,44,22,FE);ctx.font="900 "+bsz+"px "+FE;shadowText(ctx,d.brand.toUpperCase(),lx,ly+bsz*.86,"#fff","rgba(0,0,0,.9)",20,0,3);ly+=bsz+6;}
  if(d.detailCategory||d.autoCategory){ctx.font="300 18px "+FJ;ctx.fillStyle="rgba(255,255,255,.38)";ctx.fillText(d.detailCategory||d.autoCategory,lx,ly);ly+=28;}

function renderCanvas(ctx,img,data,catId,tmplId,W,H){

  if(catId==="apple")tmpl_Apple(ctx,img,data,W,H);

async function callClaude(msgs,max){
  var r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:max||700,messages:msgs})});
  var d=await r.json();if(d.error)throw new Error("Claude: "+d.error.message);
  return d.content.map(function(c){return c.text||"";}).join("");
}
async function callOAI(key,msgs,max){
  var r=await fetch("https://api.openai.com/v1/chat/completions",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+key},body:JSON.stringify({model:"gpt-4o",max_tokens:max||700,messages:msgs})});
  var d=await r.json();if(d.error)throw new Error("OpenAI: "+d.error.message);
  return d.choices[0].message.content;
}
function parseJSON(txt){var m=txt.match(/\{[\s\S]*\}/);if(!m)throw new Error("JSON解析失敗");return JSON.parse(m[0]);}

async function doOCR(b64,apiKey){
  var prompt='この商品画像を高精度解析してください。\n\n優先抽出(順):\n1.型番 2.メーカー 3.容量/サイズ 4.年式 5.カテゴリ 6.色\n\n厳守: 画像から読めない情報は"不明"。推測・補完禁止。\n\nJSONのみ返答:\n{"brand":"","model":"","capacity":"","year":"","category":"","color":"","confidence":{"brand":0.0,"model":0.0,"capacity":0.0},"rawOCR":"","suggestCategoryId":"appliance|apple|furniture|dyson|pc|other"}';
  var imgContent={type:"image",source:{type:"base64",media_type:"image/jpeg",data:b64}};
  var text;
  if(apiKey&&apiKey.startsWith("sk-")){
    text=await callOAI(apiKey,[{role:"user",content:[{type:"image_url",image_url:{url:"data:image/jpeg;base64,"+b64}},{type:"text",text:prompt}]}],600);
  }else{
    text=await callClaude([{role:"user",content:[imgContent,{type:"text",text:prompt}]}],600);
  }
  return parseJSON(text);
}

async function genDescription(platform,ocr,userInputs,b64,apiKey){
  var pCfg={

  var userStr=Object.entries(userInputs).filter(function(kv){return kv[1];}).map(function(kv){return kv[0]+": "+kv[1];}).join("\n");
  var genP="あなたは中古販売のプロです。\n\n【確認済み情報】\n"+ocrStr+"\n\n【ユーザー入力】\n"+userStr+"\n\n【ルール】"+pc.r+"\n【禁止】"+pc.f+"\n画像で確認できない機能・付属品・バッテリー状態の記述禁止。\n\n説明文のみ返答:";
  var imgMsgClaude={type:"image",source:{type:"base64",media_type:"image/jpeg",data:b64}};
  var draft;
  if(apiKey&&apiKey.startsWith("sk-")){
    draft=await callOAI(apiKey,[{role:"user",content:[{type:"image_url",image_url:{url:"data:image/jpeg;base64,"+b64}},{type:"text",text:genP}]}],900);
  }else{
    draft=await callClaude([{role:"user",content:[imgMsgClaude,{type:"text",text:genP}]}],900);
  }
  // ハルシネーション検証
  var checkP="以下の商品説明文を検証してください。\n\n確認済み情報: "+ocrStr+"\nユーザー入力: "+userStr+"\n\n検証対象:\n"+draft+"\n\n推測・画像にない情報・付属品推測・バッテリー推測があれば削除して修正版のみ返答。問題なければそのまま返答。";
  var verified;
  if(apiKey&&apiKey.startsWith("sk-")){
    verified=await callOAI(apiKey,[{role:"user",content:checkP}],900);
  }else{

  return verified.trim();
}


// 型番→正式名称補完
async function enrichProductInfo(ocr,apiKey){
  if(!ocr || !ocr.model || ocr.model==="不明") return ocr;

  var prompt = `
あなたは中古販売データ補完AIです。

以下の商品情報を元に、
正式名称と正式カラーを補完してください。

型番: ${ocr.model}
メーカー: ${ocr.brand || "不明"}
OCR色: ${ocr.color || "不明"}

推測は禁止。
実在確認できる場合のみ補完。

JSONのみ:
{
 "officialName":"",
 "officialColor":""
}
`;

  try{
    var text;

    if(apiKey&&apiKey.startsWith("sk-")){
      text=await callOAI(apiKey,[{
        role:"user",
        content:prompt
      }],300);
    }else{
      text=await callClaude([{
        role:"user",
        content:prompt
      }],300);
    }

    var enriched=parseJSON(text);

    ocr.officialName=enriched.officialName||"";
    ocr.officialColor=enriched.officialColor||"";

    return ocr;

  }catch(e){
    console.log(e);
    return ocr;
  }
}

function MainApp(p){

  var [imgEl,setImgEl]=useState(null);
  var [imgSrc,setImgSrc]=useState(null);
  var [photoB64,setPhotoB64]=useState(null);
  var [photoLoading,setPhotoLoading]=useState(false);
  // OCR

  var [ocrLoading,setOcrLoading]=useState(false);
  // カテゴリ
  var [catId,setCatId]=useState("appliance");
  var [detailCat,setDetailCat]=useState("");
  // ユーザー入力
  var [condition,setCondition]=useState("");
  var [delivery,setDelivery]=useState("");
  var [negotiable,setNegotiable]=useState(false);
  var [urgent,setUrgent]=useState(false);
  var [mainSpec,setMainSpec]=useState("");
  // 生成
  var [loading,setLoading]=useState(false);
  var [loadMsg,setLoadMsg]=useState("");
  var [result,setResult]=useState(null);
  var [error,setError]=useState("");
  // 説明文
  var [descPlatform,setDescPlatform]=useState("mercari");
  var [descResult,setDescResult]=useState("");
  var [descLoading,setDescLoading]=useState(false);
  var [copied,setCopied]=useState(false);
  var canvasRef=useRef(null);
  var hasApi=apiKey&&apiKey.startsWith("sk-")&&apiKey.length>20;

  if(screen==="api")return E(ApiPage,{apiKey:apiKey,onSave:function(k){setApiKey(k);},back:function(){setScreen("main");}});

  // 写真読み込み
  function handlePhoto(ev){
    var file=ev.target.files&&ev.target.files[0];if(!file)return;
    setPhotoLoading(true);setImgSrc(null);setImgEl(null);setPhotoB64(null);setOcrData(null);setResult(null);setError("");
    var reader=new FileReader();
    reader.onload=function(e){
      var img=new Image();
      img.onload=function(){
        try{
          setImgEl(img);setImgSrc(e.target.result);
          var sm=document.createElement("canvas");sm.width=900;sm.height=900;
          var sc=Math.min(900/img.naturalWidth,900/img.naturalHeight);
          var sw=img.naturalWidth*sc,sh=img.naturalHeight*sc;
          sm.getContext("2d").drawImage(img,(900-sw)/2,(900-sh)/2,sw,sh);
          var b64=sm.toDataURL("image/jpeg",.88).split(",")[1];
          setPhotoB64(b64);
          setOcrLoading(true);
          doOCR(b64,apiKey).then(function(ocr){
            setOcrData(ocr);
            if(ocr.suggestCategoryId)setCatId(ocr.suggestCategoryId);
          }).catch(function(e){setError("OCR: "+e.message);}).finally(function(){setOcrLoading(false);});
        }catch(err){setError("写真処理エラー: "+err.message);}
        setPhotoLoading(false);
      };
      img.onerror=function(){setError("画像読み込み失敗");setPhotoLoading(false);};
      img.src=e.target.result;
    };
    reader.onerror=function(){setError("ファイル読み込み失敗");setPhotoLoading(false);};
    reader.readAsDataURL(file);ev.target.value="";
  }

  // サムネイル生成
  async function doGenerate(){
    if(!imgEl)return;setLoading(true);setLoadMsg("レイアウト計算中...");setError("");
    try{
      await document.fonts.ready;
      var cv=canvasRef.current;cv.width=1080;cv.height=1080;var ctx=cv.getContext("2d");
      var data={
        brand:ocrData&&ocrData.brand!=="不明"?ocrData.brand:"",
        model:ocrData&&ocrData.model!=="不明"?ocrData.model:"",
        capacity:ocrData&&ocrData.capacity!=="不明"?ocrData.capacity:mainSpec,
        mainSpec:mainSpec||(ocrData&&ocrData.capacity!=="不明"?ocrData.capacity:""),
        year:ocrData&&ocrData.year!=="不明"?ocrData.year:"",
        autoCategory:ocrData&&ocrData.category!=="不明"?ocrData.category:"",
        detailCategory:detailCat,
        condition:condition,delivery:delivery,negotiable:negotiable,urgent:urgent,
      };
      setLoadMsg("画像生成中...");
      renderCanvas(ctx,imgEl,data,catId,null,1080,1080);
      setResult(cv.toDataURL("image/png"));
    }catch(e){setError("生成失敗: "+e.message);}
    setLoading(false);setLoadMsg("");
  }

  // 商品説明生成
  async function doDesc(){
    if(!photoB64){setError("写真をアップロードしてください");return;}
    setDescLoading(true);setDescResult("");setError("");
    try{
      var ui={状態:condition,配送:delivery,詳細カテゴリ:detailCat,スペック:mainSpec,値下げ応相談:negotiable?"可":""};
      var txt=await genDescription(descPlatform,ocrData||{},ui,photoB64,apiKey);
      setDescResult(txt);
    }catch(e){setError("説明文生成: "+e.message);}
    setDescLoading(false);
