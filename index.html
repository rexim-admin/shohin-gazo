// ── Canvas ─────────────────────────────────
function rr(c,x,y,w,ht,r){c.beginPath();c.moveTo(x+r,y);c.lineTo(x+w-r,y);c.quadraticCurveTo(x+w,y,x+w,y+r);c.lineTo(x+w,y+ht-r);c.quadraticCurveTo(x+w,y+ht,x+w-r,y+ht);c.lineTo(x+r,y+ht);c.quadraticCurveTo(x,y+ht,x,y+ht-r);c.lineTo(x,y+r);c.quadraticCurveTo(x,y,x+r,y);c.closePath();}
function burst(c,cx,cy,ro,ri,n,col){c.beginPath();for(var i=0;i<n*2;i++){var a=(i*Math.PI)/n-Math.PI/2,r=i%2===0?ro:ri;i===0?c.moveTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r):c.lineTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r);}c.closePath();c.fillStyle=col;c.fill();}
function ds(c,t,x,y,f,s,sw){c.strokeStyle=s;c.lineWidth=sw;c.lineJoin="round";c.strokeText(t,x,y);c.fillStyle=f;c.fillText(t,x,y);}
function wt(c,txt,x,y,mw,lh){if(!txt)return;var ch=[...txt],ln="",cy=y;for(var i=0;i<ch.length;i++){var ts=ln+ch[i];if(c.measureText(ts).width>mw&&ln){c.fillText(ln,x,cy);ln=ch[i];cy+=lh;}else ln=ts;}if(ln)c.fillText(ln,x,cy);}
function cropSq(img){var nw=img.naturalWidth||img.width||800,nh=img.naturalHeight||img.height||800,sz=Math.min(nw,nh);var cv=document.createElement("canvas");cv.width=sz;cv.height=sz;cv.getContext("2d").drawImage(img,(nw-sz)/2,(nh-sz)/2,sz,sz,0,0,sz,sz);return cv;}

function drawAd(c,src,f,ai,W,H){
  var br=(ai&&ai.brand)||f.brand||"BRAND",cp=(ai&&ai.capacity)||f.capacity||"",ft=(ai&&ai.feature)||f.feature||"",sb=(ai&&ai.subtitle)||f.subtitle||"",t1=(ai&&ai.tag1)||f.tag1||"",t2=(ai&&ai.tag2)||f.tag2||"",dv=(ai&&ai.delivery)||f.delivery||"",cc=(ai&&ai.catchCopy)||"";
  var bg=c.createLinearGradient(0,0,W,H);bg.addColorStop(0,"#FFE000");bg.addColorStop(0.45,"#FF8C00");bg.addColorStop(1,"#CC0000");
  c.fillStyle=bg;c.fillRect(0,0,W,H);
  c.save();c.translate(W/2,H/2);for(var i=0;i<28;i++){c.beginPath();c.moveTo(0,0);c.arc(0,0,W,(i*2*Math.PI)/28,((i+0.5)*2*Math.PI)/28);c.fillStyle=i%2===0?"rgba(255,255,255,0.09)":"rgba(0,0,0,0.04)";c.fill();}c.restore();
  var iS=H*0.65;c.save();c.shadowColor="rgba(0,0,0,0.45)";c.shadowBlur=55;c.shadowOffsetX=16;c.shadowOffsetY=16;c.drawImage(src,W-iS-6,H-iS,iS,iS);c.restore();
  c.textBaseline="alphabetic";
  c.font="900 68px "+FONT;ds(c,br,44,100,"#fff","rgba(0,0,0,0.3)",6);
  c.font="900 130px "+FONT;ds(c,cp,36,248,"#003399","#fff",10);
  c.font="900 50px "+FONT;ds(c,ft,36,322,"#fff","#CC0000",7);
  if(cc){c.font="700 34px "+FONT;c.fillStyle="#FFF9C4";c.shadowColor="rgba(0,0,0,0.6)";c.shadowBlur=10;wt(c,cc,36,376,W*0.54,42);c.shadowBlur=0;}
  else{c.font="700 28px "+FONT;c.fillStyle="#FFF9C4";c.shadowColor="rgba(0,0,0,0.5)";c.shadowBlur=8;c.fillText(sb,36,374);c.shadowBlur=0;}
  [t1,t2].filter(Boolean).forEach(function(tag,i){var ty=440+i*76;c.font="700 24px "+FONT;var tw=c.measureText(tag).width+50;c.fillStyle="#003399";rr(c,36,ty-34,tw,48,10);c.fill();c.fillStyle="#fff";c.fillText((i===0?"🌀":"☀️")+" "+tag,50,ty);});
  if(dv){c.fillStyle="#CC0000";c.fillRect(0,H-108,W*0.63,68);c.font="700 23px "+FONT;c.fillStyle="#FFE000";c.fillText("🚚 "+dv,18,H-68);}
  burst(c,W-153,H-148,138,88,14,"#CC0000");

function drawFlea(c,src,f,ai,W,H){

  c.fillStyle="#FAF7F3";c.fillRect(0,0,W,H);

  var iS=H*0.50;c.save();c.shadowColor="rgba(0,0,0,0.12)";c.shadowBlur=28;c.drawImage(src,(W-iS)/2,46,iS,iS);c.restore();
  var sp=H*0.60;c.fillStyle="#E0D8D0";c.fillRect(40,sp,W-80,2);

  if(cd){c.font="700 22px "+FONT;var cw=c.measureText(cd).width+30;c.fillStyle="#E8F5E9";rr(c,44,sp+86,cw,44,10);c.fill();c.fillStyle="#2E7D32";c.fillText("✅ "+cd,60,sp+114);}
  var px=44;[t1,t2].filter(Boolean).forEach(function(t){c.font="600 19px "+FONT;var pw=c.measureText(t).width+22;c.fillStyle="#FFF3E0";rr(c,px,sp+144,pw,36,8);c.fill();c.fillStyle="#E65100";c.fillText(t,px+11,sp+168);px+=pw+9;});
  c.font="400 22px "+FONT;c.fillStyle="#666";c.fillText(dv,44,sp+224);c.font="400 18px "+FONT;c.fillStyle="#999";c.fillText(nt,44,sp+254);
  c.fillStyle="#FF6157";c.beginPath();c.moveTo(0,0);c.lineTo(152,0);c.lineTo(0,152);c.fill();
  c.save();c.translate(18,50);c.rotate(-Math.PI/4);c.font="700 18px "+FONT;c.fillStyle="#fff";c.textAlign="center";c.fillText("中古品",0,0);c.restore();c.textAlign="left";

function drawShop(c,src,f,ai,W,H){
  var br=(ai&&ai.brand)||f.brand||"BRAND",mo=(ai&&ai.model)||f.model||"",cp=(ai&&ai.capacity)||f.capacity||"",fs=(ai&&ai.features)||f.features||"",cd=(ai&&ai.condition)||f.condition||"",nt=(ai&&ai.note)||f.note||"";
  c.fillStyle="#fff";c.fillRect(0,0,W,H);c.fillStyle="#0D1B3E";c.fillRect(0,0,W,104);

  if(cd){c.font="400 18px "+FONT;var cw=c.measureText(cd).width+22;c.fillStyle="rgba(255,255,255,0.15)";rr(c,W-cw-30,25,cw,44,8);c.fill();c.fillStyle="#CCDDFF";c.fillText(cd,W-cw-16,55);}
  var iS=H*0.47;c.save();c.shadowColor="rgba(0,0,0,0.08)";c.shadowBlur=24;c.drawImage(src,(W-iS)/2,120,iS,iS);c.restore();
  var mid=120+iS+22;var lg=c.createLinearGradient(0,0,W,0);lg.addColorStop(0,"#0D1B3E");lg.addColorStop(0.5,"#4A90D9");lg.addColorStop(1,"#0D1B3E");
  c.fillStyle=lg;c.fillRect(44,mid,W-88,3);c.font="400 22px 'Courier New',monospace";c.fillStyle="#9999AA";c.fillText(mo,44,mid+38);
  c.font="900 84px "+FONT;c.fillStyle="#0D1B3E";c.fillText(cp,44,mid+136);
  var sx=44,sy=mid+162;fs.split(",").filter(Boolean).forEach(function(s,i){c.font="600 18px "+FONT;var sw=c.measureText(s.trim()).width+24;c.fillStyle=i%2===0?"#0D1B3E":"#EEF2FF";rr(c,sx,sy,sw,40,20);c.fill();c.fillStyle=i%2===0?"#fff":"#0D1B3E";c.fillText(s.trim(),sx+12,sy+26);sx+=sw+8;if(sx>W-140){sx=44;sy+=49;}});
  c.font="400 20px "+FONT;c.fillStyle="#888";c.fillText(nt,44,H-28);c.fillStyle=lg;c.fillRect(0,H-7,W,7);

// ── API呼び出し ────────────────────────────
async function callOAI(key,msgs,max){
  var r=await fetch("https://api.openai.com/v1/chat/completions",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+key},body:JSON.stringify({model:"gpt-4o",max_tokens:max||800,messages:msgs})});
  var d=await r.json();if(d.error)throw new Error(d.error.message);return d.choices[0].message.content;
}
async function callClaude(msgs,max){
  var r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:max||800,messages:msgs})});
  var d=await r.json();if(d.error)throw new Error(d.error.message);return d.content.map(function(c){return c.text||"";}).join("");
}
async function aiEnhance(tmplId,fields,b64,key){
  var tdesc={ad:"派手な日本の中古家電広告（黄色〜赤グラデーション・インパクト重視）",flea:"メルカリ・ジモティー風フリマ出品",shop:"ECサイト・ショップ風クリーンな商品ページ"};
  var fs=Object.entries(fields).filter(function(kv){return kv[1];}).map(function(kv){return kv[0]+": "+kv[1];}).join("\n");
  var prompt="この商品写真を見て、"+tdesc[tmplId]+"のための最適な広告コピーをJSONのみで返答（説明不要）:\n"+fs+'\n\n{"brand":"","capacity":"","feature":"","subtitle":"改善キャッチ","catchCopy":"写真の特徴一言(20字以内)","tag1":"","tag2":"","delivery":"","condition":"","note":"","extraNote":"外観コメント","model":"","features":""}';
  var text;
  if(key&&key.startsWith("sk-")){
    text=await callOAI(key,[{role:"user",content:[{type:"image_url",image_url:{url:"data:image/jpeg;base64,"+b64}},{type:"text",text:prompt}]}],600);
  }else{
    text=await callClaude([{role:"user",content:[{type:"image",source:{type:"base64",media_type:"image/jpeg",data:b64}},{type:"text",text:prompt}]}],600);
  }
  var m=text.match(/\{[\s\S]*\}/);if(!m)throw new Error("JSON取得失敗");return JSON.parse(m[0]);
}
async function genDesc(platform,fields,b64,key){
  var prompts={
    mercari:"あなたはメルカリの販売のプロです。以下の商品情報から、メルカリ用商品説明文を作成してください。\n\n【ルール】\n- iPhoneの絵文字を積極的に使う（📦✅🔧💡🚚🌟など）\n- 目標500文字以内、最大1000文字\n- 見やすく改行を活用\n- 状態・特徴・注意点・配送方法を含める\n- 最後に「お気軽にコメントどうぞ😊」を入れる\n\n【商品情報】\n",
    yahoo:"あなたはYahoo!フリマの販売のプロです。以下の商品情報から、Yahoo!フリマ用商品説明文を作成してください。\n\n【ルール】\n- 絵文字は使用禁止。【】★●◆■▼などの記号のみ使用\n- 目標500文字以内、最大1000文字\n- 記号で項目を整理し見やすく\n- 状態・特徴・注意点・配送方法を含める\n- 丁寧でわかりやすい文体\n\n【商品情報】\n",
    jimoty:"あなたはジモティーの販売のプロです。以下の商品情報から、ジモティー用商品説明文を作成してください。\n\n【ルール】\n- 即売・直接取引を重視した超簡潔な文体\n- 300文字以内でコンパクトに\n- 絵文字は最小限（1〜2個まで）\n- 場所・受け渡し方法・価格交渉の可否を明記\n- 余計な装飾なし・要点のみ\n\n【商品情報】\n",
  };
  var fs=Object.entries(fields).filter(function(kv){return kv[1];}).map(function(kv){return kv[0]+": "+kv[1];}).join("\n");
  var p=prompts[platform]+fs;
  if(b64){
    if(key&&key.startsWith("sk-"))return await callOAI(key,[{role:"user",content:[{type:"image_url",image_url:{url:"data:image/jpeg;base64,"+b64}},{type:"text",text:p}]}],900);
    return await callClaude([{role:"user",content:[{type:"image",source:{type:"base64",media_type:"image/jpeg",data:b64}},{type:"text",text:p}]}],900);
  }
  if(key&&key.startsWith("sk-"))return await callOAI(key,[{role:"user",content:p}],900);
  return await callClaude([{role:"user",content:p}],900);
}

function Login(props){
  var [pw,setPw]=useState("");var [err,setErr]=useState(false);var [shake,setShake]=useState(false);
  function go(){if(pw===APP_PASSWORD){props.ok();}else{setErr(true);setShake(true);setPw("");setTimeout(function(){setShake(false);},450);}}
  return h("div",{style:{minHeight:"100vh",background:"linear-gradient(160deg,#0f0f23,#1a1a3e,#0a1628)",display:"flex",alignItems:"center",justifyContent:"center"}},
    h("div",{style:{background:"rgba(255,255,255,0.07)",borderRadius:24,padding:"44px 32px",border:"1px solid rgba(255,255,255,0.12)",width:"88%",maxWidth:320,textAlign:"center",animation:shake?"shake 0.4s":"none"}},
      h("div",{style:{fontSize:46,marginBottom:11}},"🔒"),
      h("h2",{style:{color:"#fff",fontSize:19,fontWeight:900,margin:"0 0 5px"}},"スタッフ専用"),
      h("p",{style:{color:"#777",fontSize:12,marginBottom:22}},"合言葉を入力"),
      h("input",{type:"password",placeholder:"合言葉",value:pw,autoFocus:true,
        onChange:function(e){setPw(e.target.value);setErr(false);},
        onKeyDown:function(e){if(e.key==="Enter")go();},
        style:Object.assign({},CS.inp,{textAlign:"center",marginBottom:8,letterSpacing:6,border:err?"2px solid #ef4444":"1px solid rgba(255,255,255,0.2)"})}),
      err&&h("div",{style:{color:"#f87171",fontSize:12,marginBottom:8}},"合言葉が違います"),
      h("button",{onClick:go,style:pb("linear-gradient(135deg,#FFD700,#FF6B00)","#1a1a2e")},"入室する →")
    )
  );
}

    h("button",{onClick:isAI?doAI:doInstant,disabled:!canGo,style:pb(gBg,gCl)},

    h("canvas",{ref:canvasRef,style:{display:"none"}}),

    result&&!loading&&h("div",{style:Object.assign({},CS.card,{textAlign:"center"})},
      h("div",{style:CS.ct},"✅ 完成！"),
      h("img",{src:result,alt:"result",style:{width:"100%",borderRadius:9,marginBottom:13}}),
      h("div",{style:{display:"flex",gap:8,justifyContent:"center",flexWrap:"wrap"}},
        h("button",{onClick:download,style:{padding:"12px 28px",borderRadius:9,background:"#0f0f23",border:"2px solid #FFD700",color:"#FFD700",fontWeight:700,fontSize:14,cursor:"pointer"}},"⬇️ PNG保存"),
        h("button",{onClick:function(){setScreen("desc");},style:{padding:"12px 20px",borderRadius:9,background:"rgba(245,158,11,0.12)",border:"1px solid rgba(245,158,11,0.3)",color:"#f59e0b",fontWeight:700,fontSize:13,cursor:"pointer"}},"📝 説明文も作る")
      )
    ),

    h("div",{style:{textAlign:"center",marginTop:14}},
      h("button",{onClick:props.logout,style:{background:"none",border:"none",color:"#444",fontSize:11,cursor:"pointer"}},"🔒 ログアウト")
    )
  ));
}

// ── ルート ─────────────────────────────────
function App(){
  var [ok,setOk]=useState(false);
  return ok?h(Main,{logout:function(){setOk(false);}}):h(Login,{ok:function(){setOk(true);}});
}
ReactDOM.createRoot(document.getElementById("app")).render(h(App));
</script>
</body>
</html>
