"use strict";

const VER="v2.1.0";

// ── STORAGE ──────────────────────────────

// ── STYLES ───────────────────────────────
const G={
  bg:"linear-gradient(150deg,#090912,#0d0d1e,#07070f)",
  card:{background:"rgba(255,255,255,.047)",borderRadius:13,padding:"13px 15px",marginBottom:10,border:"1px solid rgba(255,255,255,.063)"},

  ta:{width:"100%",padding:"11px 13px",borderRadius:9,border:"1px solid rgba(255,255,255,.09)",background:"rgba(0,0,0,.3)",color:"#ddd",fontSize:13,outline:"none",boxSizing:"border-box",resize:"vertical",lineHeight:1.8,minHeight:200},

// ── CATEGORIES ───────────────────────────
const CATS={
  appliance:{l:"🏠 白物家電",c:"#FF8C00",subs:["冷蔵庫","洗濯機","電子レンジ","オーブンレンジ","エアコン","テレビ","モニター","炊飯器","掃除機","ロボット掃除機","空気清浄機","加湿器","除湿機","扇風機","ヒーター","食洗機","IHクッキングヒーター","ガスコンロ","ホットプレート","その他"]},
  ikea:{l:"🪑 IKEA・家具",c:"#0058A3",subs:["IKEAソファ","IKEAソファカバー","IKEAテーブル","IKEAサイドテーブル","IKEAチェスト","IKEA照明","IKEA雑貨","ダイニングテーブル","椅子","ベッド","収納家具","ラグ","ブランド家具","その他"]},
  apple:{l:"🍎 Apple",c:"#aaa",subs:["iPhone","iPad","iPad mini","iPad Air","iPad Pro","iPod touch","iPod classic","iPod nano","MacBook","MacBook Air","MacBook Pro","iMac","Mac mini","Apple Watch","AirPods","Apple TV","純正アクセサリ","その他Apple"]},
  dyson:{l:"💜 Dyson",c:"#9333ea",subs:["Dyson掃除機(コードレス)","Dyson掃除機(コード式)","Dyson空気清浄機","Dysonドライヤー","Dyson扇風機","Dysonヒーター","その他Dyson"]},
  pc:{l:"💻 PC・ガジェット",c:"#3b82f6",subs:["ノートPC","デスクトップPC","ゲーミングPC","タブレット","Androidスマホ","Wi-Fiルーター","プリンター","PCパーツ","ゲーミングモニター","キーボード","マウス","ヘッドホン","スピーカー","カメラ","プロジェクター","その他"]},
  small:{l:"🔌 小物・付属品",c:"#f59e0b",subs:["ACアダプター","充電器","ケーブル","リモコン","電源タップ","ハンディ掃除機","その他小物"]},

};

// ── CANVAS UTILS ─────────────────────────
function rr(c,x,y,w,ht,r){c.beginPath();c.moveTo(x+r,y);c.lineTo(x+w-r,y);c.quadraticCurveTo(x+w,y,x+w,y+r);c.lineTo(x+w,y+ht-r);c.quadraticCurveTo(x+w,y+ht,x+w-r,y+ht);c.lineTo(x+r,y+ht);c.quadraticCurveTo(x,y+ht,x,y+ht-r);c.lineTo(x,y+r);c.quadraticCurveTo(x,y,x+r,y);c.closePath();}
function glow(c,cx,cy,r,rgb,a){const g=c.createRadialGradient(cx,cy,0,cx,cy,r);g.addColorStop(0,`rgba(${rgb},${a})`);g.addColorStop(1,`rgba(${rgb},0)`);c.fillStyle=g;c.beginPath();c.arc(cx,cy,r,0,Math.PI*2);c.fill();}
function star(c,cx,cy,ro,ri,n,f){c.beginPath();for(let i=0;i<n*2;i++){const a=(i*Math.PI)/n-Math.PI/2,r=i%2?ri:ro;i?c.lineTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r):c.moveTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r);}c.closePath();c.fillStyle=f;c.fill();}
function fit(c,t,mw,ms,mn,f){for(let s=ms;s>=mn;s-=2){c.font=`${s}px ${f}`;if(c.measureText(t).width<=mw)return s;}return mn;}
function sdw(c,t,x,y,fc,sc,sb,ox,oy){c.save();c.shadowColor=sc||"rgba(0,0,0,.85)";c.shadowBlur=sb||18;c.shadowOffsetX=ox||0;c.shadowOffsetY=oy||3;c.fillStyle=fc;c.fillText(t,x,y);c.restore();}
function cropSq(img){const nw=img.naturalWidth||img.width,nh=img.naturalHeight||img.height,sz=Math.min(nw,nh);const c=document.createElement("canvas");c.width=sz;c.height=sz;c.getContext("2d").drawImage(img,(nw-sz)/2,(nh-sz)/2,sz,sz,0,0,sz,sz);return c;}
function dropImg(c,src,x,y,w,h,sc,sb){const nw=src.naturalWidth||src.width,nh=src.naturalHeight||src.height,sc2=Math.min(w/nw,h/nh),dw=nw*sc2,dh=nh*sc2,dx=x+(w-dw)/2,dy=y+(h-dh)/2;c.save();c.shadowColor=sc||"rgba(0,0,0,.5)";c.shadowBlur=sb||38;c.shadowOffsetY=14;c.drawImage(src,dx,dy,dw,dh);c.restore();return{dx,dy,dw,dh};}

// ── TEMPLATES ────────────────────────────
function tmplAppliance(c,img,d,W,H){
  // 黄色グラデ背景
  const bg=c.createLinearGradient(0,0,W,H);bg.addColorStop(0,"#FFE040");bg.addColorStop(.5,"#FFC107");bg.addColorStop(1,"#FF9800");
  c.fillStyle=bg;c.fillRect(0,0,W,H);
  // 放射線
  c.save();c.translate(W/2,H/2);c.globalAlpha=.07;
  for(let i=0;i<20;i++){c.rotate(Math.PI/10);c.fillStyle="#fff";c.fillRect(-W*1.5,-5,W*3,10);}
  c.restore();
  // 商品(右)
  const {dx,dy,dw,dh}=dropImg(c,img,W*.32,H*.06,W*.64,H*.78,"rgba(50,20,0,.4)",45);
  // 床影
  c.save();c.globalAlpha=.25;const sg=c.createRadialGradient(dx+dw/2,dy+dh,0,dx+dw/2,dy+dh,dw*.45);sg.addColorStop(0,"rgba(0,0,0,.7)");sg.addColorStop(1,"rgba(0,0,0,0)");c.fillStyle=sg;c.scale(1,.18);c.fillRect(dx,( dy+dh)*5.5,dw,dw*.8);c.restore();
  // 左テキスト
  let lx=34,ly=70,lw=W*.30;
  const br=(d.brand||"").toUpperCase();
  if(br&&br!=="不明"){const bsz=fit(c,br,lw*.9,70,32,FE);c.font=`900 ${bsz}px ${FE}`;sdw(c,br,lx,ly+bsz*.85,"#CC0000","rgba(0,0,0,.8)",20,0,3);c.fillStyle="#CC0000";c.fillRect(lx,ly+5,c.measureText(br).width,4);ly+=bsz+10;}
  const ms=d.capacity||d.mainSpec||"";
  if(ms){const msz=fit(c,ms,lw*.92,130,60,FE);c.font=`900 ${msz}px ${FE}`;sdw(c,ms,lx,ly+msz*.88,"#003399","#fff",14,0,4);c.strokeStyle="#fff";c.lineWidth=10;c.lineJoin="round";c.strokeText(ms,lx,ly+msz*.88);c.fillStyle="#003399";c.fillText(ms,lx,ly+msz*.88);ly+=msz+8;}
  const cat=d.subCat||d.freeCat||"";
  if(cat){const csz=fit(c,cat,lw*.92,68,36,FH);c.font=`900 ${csz}px ${FH}`;c.strokeStyle="#fff";c.lineWidth=8;c.lineJoin="round";c.strokeText(cat,lx,ly+csz*.88);c.fillStyle="#E65100";c.fillText(cat,lx,ly+csz*.88);ly+=csz+10;}
  // バッジ
  const badges=[];
  if(d.condition==="美品"||d.condition==="動作確認済み")badges.push({t:d.condition==="美品"?"✨美品":"✅動作OK",bg:"rgba(74,222,128,.25)",fc:"#4ade80",bc:"rgba(74,222,128,.5)"});
  if(d.delivery&&d.delivery.includes("配達"))badges.push({t:"🚚配達可",bg:"rgba(96,165,250,.2)",fc:"#93c5fd",bc:"rgba(96,165,250,.45)"});
  if(d.negotiable)badges.push({t:"💬値下相談",bg:"rgba(251,191,36,.15)",fc:"#fcd34d",bc:"rgba(251,191,36,.4)"});
  badges.forEach(b=>{c.font=`700 18px ${FJ}`;const tw=c.measureText(b.t).width+28;c.fillStyle=b.bg;rr(c,lx,ly,tw,30,15);c.fill();c.strokeStyle=b.bc;c.lineWidth=1;rr(c,lx,ly,tw,30,15);c.stroke();c.fillStyle=b.fc;c.fillText(b.t,lx+14,ly+21);ly+=37;});
  // 下帯
  const bH=70,bY=H-bH;
  const bar=c.createLinearGradient(0,bY,W,bY);bar.addColorStop(0,"rgba(220,38,0,.92)");bar.addColorStop(1,"rgba(160,0,0,.95)");
  c.fillStyle=bar;c.fillRect(0,bY,W*0.58,bH);
  c.strokeStyle="rgba(255,200,0,.5)";c.lineWidth=1.5;c.beginPath();c.moveTo(0,bY);c.lineTo(W,bY);c.stroke();
  if(d.delivery){c.font=`800 24px ${FH}`;sdw(c,"🚚 "+d.delivery,20,bY+44,"#fff","rgba(0,0,0,.5)",8);}
  if(d.urgent){star(c,W-125,H-bH-120,110,72,14,"#CC0000");c.save();c.font=`900 38px ${FH}`;c.textAlign="center";c.textBaseline="middle";c.fillStyle="#FFE000";c.fillText("激安！",W-125,H-bH-120);c.restore();c.textAlign="left";c.textBaseline="alphabetic";}
}
function tmplApple(c,img,d,W,H){
  const bg=c.createLinearGradient(0,0,W,H);bg.addColorStop(0,"#fafbfc");bg.addColorStop(1,"#e9ecef");c.fillStyle=bg;c.fillRect(0,0,W,H);
  c.fillStyle="#1d1d1f";c.fillRect(0,0,W,5);
  dropImg(c,img,W*.08,H*.06,W*.84,H*.56,"rgba(0,20,60,.12)",32);
  const sy=H*.68,tx=40;let ty=sy+28;
  c.strokeStyle="rgba(0,0,0,.07)";c.lineWidth=1;c.beginPath();c.moveTo(40,sy);c.lineTo(W-40,sy);c.stroke();
  const br=(d.brand||"Apple").toUpperCase()+(d.model&&d.model!=="不明"?" / "+d.model:"");
  c.font=`700 17px ${FE}`;c.fillStyle="rgba(0,0,0,.38)";c.fillText(br,tx,ty);ty+=8;
  c.strokeStyle="rgba(0,0,80,.12)";c.lineWidth=2;c.beginPath();c.moveTo(tx,ty);c.lineTo(tx+180,ty);c.stroke();ty+=22;
  const ms=d.capacity||d.mainSpec||d.subCat||"";
  if(ms){const msz=fit(c,ms,W-80,66,36,FE);c.font=`900 ${msz}px ${FE}`;c.fillStyle="#1d1d1f";c.fillText(ms,tx,ty+msz*.86);ty+=msz+8;}
  c.fillStyle="#1d1d1f";c.fillRect(0,H-42,W,42);
  if(d.delivery){c.font=`600 16px ${FJ}`;c.fillStyle="rgba(255,255,255,.85)";c.fillText(d.delivery,20,H-14);}
}
function tmplDyson(c,img,d,W,H){
  c.fillStyle="#060608";c.fillRect(0,0,W,H);
  c.save();c.globalAlpha=.15;glow(c,W*.5,H*.4,W*.6,"147,51,234",.45);c.restore();
  const r=dropImg(c,img,W*.06,H*.05,W*.88,H*.62,"rgba(147,51,234,.35)",70);
  c.save();c.globalAlpha=.07;c.transform(1,0,0,-.2,0,(r.dy+r.dh)*1.2);c.drawImage(img,r.dx,r.dy,r.dw,r.dh);c.restore();
  const fg=c.createLinearGradient(0,r.dy+r.dh,0,r.dy+r.dh+80);fg.addColorStop(0,"rgba(6,6,8,0)");fg.addColorStop(1,"rgba(6,6,8,1)");c.fillStyle=fg;c.fillRect(0,r.dy+r.dh,W,80);
  c.textAlign="center";let ty=H*.75;
  c.font=`500 18px ${FE}`;c.fillStyle="rgba(200,150,255,.45)";c.fillText("DYSON",W*.5,ty);ty+=28;
  const ms=d.subCat||d.mainSpec||"";
  if(ms){const msz=fit(c,ms,W*.85,56,30,FH);c.font=`900 ${msz}px ${FH}`;const tg=c.createLinearGradient(W*.15,0,W*.85,0);tg.addColorStop(0,"#c084fc");tg.addColorStop(.5,"#fff");tg.addColorStop(1,"#a855f7");c.fillStyle=tg;c.fillText(ms,W*.5,ty+msz*.86);ty+=msz+6;}
  c.textAlign="left";
}
function tmplPC(c,img,d,W,H){
  const bg=c.createLinearGradient(0,0,W,H);bg.addColorStop(0,"#0d1426");bg.addColorStop(1,"#080d18");c.fillStyle=bg;c.fillRect(0,0,W,H);
  c.save();c.globalAlpha=.12;glow(c,W*.75,H*.25,W*.5,"59,130,246",.45);c.restore();
  dropImg(c,img,W*.32,H*.05,W*.64,H*.7,"rgba(59,130,246,.3)",50);
  let lx=28,ly=70,lw=W*.30;
  if(d.brand){const bsz=fit(c,d.brand.toUpperCase(),lw*.9,44,22,FE);c.font=`900 ${bsz}px ${FE}`;sdw(c,d.brand.toUpperCase(),lx,ly+bsz*.86,"#fff","rgba(0,0,0,.95)",20,0,3);ly+=bsz+8;}
  const ms=d.capacity||d.mainSpec||"";
  if(ms){const msz=fit(c,ms,lw*.9,80,38,FE);c.font=`900 ${msz}px ${FE}`;const tg=c.createLinearGradient(0,0,msz*2,0);tg.addColorStop(0,"#60a5fa");tg.addColorStop(1,"#34d399");c.fillStyle=tg;c.fillText(ms,lx,ly+msz*.88);ly+=msz+8;}
  if(d.subCat){c.font=`500 17px ${FJ}`;c.fillStyle="rgba(255,255,255,.4)";c.fillText(d.subCat,lx,ly);ly+=26;}
  const bY=H-55;const bar=c.createLinearGradient(0,bY,W,bY);bar.addColorStop(0,"rgba(37,99,235,.9)");bar.addColorStop(1,"rgba(29,78,216,.95)");c.fillStyle=bar;c.fillRect(0,bY,W,55);
  if(d.delivery){c.font=`700 21px ${FH}`;sdw(c,"🚚 "+d.delivery,18,bY+36,"#fff","rgba(0,0,0,.5)",8);}
}
function tmplOther(c,img,d,W,H){
  const bg=c.createLinearGradient(0,0,W,H);bg.addColorStop(0,"#111118");bg.addColorStop(1,"#0a0a10");c.fillStyle=bg;c.fillRect(0,0,W,H);
  dropImg(c,img,W*.06,H*.06,W*.88,H*.58,"rgba(0,0,0,.5)",40);
  let ty=H*.7,tx=32;
  if(d.brand){c.font=`800 19px ${FE}`;c.fillStyle="rgba(255,255,255,.4)";c.fillText(d.brand.toUpperCase(),tx,ty);ty+=28;}
  const ms=d.capacity||d.mainSpec||d.subCat||"";
  if(ms){const msz=fit(c,ms,W-64,60,32,FH);c.font=`900 ${msz}px ${FH}`;sdw(c,ms,tx,ty+msz*.88,"#FFD700","rgba(0,0,0,.9)",22);ty+=msz+8;}
  c.fillStyle="rgba(255,215,0,.85)";c.fillRect(0,H-5,W,5);
}
function render(ctx,src,d,catId,W,H){
  if(catId==="apple")tmplApple(ctx,src,d,W,H);
  else if(catId==="dyson")tmplDyson(ctx,src,d,W,H);
  else if(catId==="pc")tmplPC(ctx,src,d,W,H);
  else if(catId==="appliance")tmplAppliance(ctx,src,d,W,H);
  else tmplOther(ctx,src,d,W,H);
}

// ── AI CALLS ─────────────────────────────
async function aiClaude(msgs,max=800){
  const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:max,messages:msgs})});
  const d=await r.json();if(d.error)throw new Error("Claude: "+d.error.message);
  return d.content.map(c=>c.text||"").join("");
}
async function aiOAI(key,msgs,max=800){
  const r=await fetch("https://api.openai.com/v1/chat/completions",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+key},body:JSON.stringify({model:"gpt-4o",max_tokens:max,messages:msgs})});
  const d=await r.json();if(d.error)throw new Error("OpenAI: "+d.error.message);
  return d.choices[0].message.content;
}
function pickAI(key){return key&&key.startsWith("sk-")?"oai":"claude";}
async function callAI(key,msgs,max){return pickAI(key)==="oai"?aiOAI(key,msgs,max):aiClaude(msgs,max);}
function parseJ(t){const m=t.match(/\{[\s\S]*\}/);if(!m)throw new Error("JSON解析失敗");return JSON.parse(m[0]);}

// 画像コンテンツビルダー
function imgContent(b64,text,isOAI){
  if(isOAI)return [{type:"image_url",image_url:{url:`data:image/jpeg;base64,${b64}`}},{type:"text",text}];
  return [{type:"image",source:{type:"base64",media_type:"image/jpeg",data:b64}},{type:"text",text}];
}

// ── OCR (拡張版) ──────────────────────────
async function doOCR(b64s,key){
  const isOAI=pickAI(key)==="oai";
  const prompt=`これらの商品画像を徹底的に解析してください。

抽出優先順位:
1. 型番(メーカー固有の英数字コード)
2. メーカー・ブランド名
3. 容量・サイズ(単位必須: kg/L/インチ等)
4. 年式・製造年
5. 消費電力(W数)
6. 外形寸法(幅×奥行×高さ mm/cm)
7. 商品カテゴリ
8. 色・カラー
9. シリーズ名
10. JANコード・バーコード

読取元: 前面・背面・銘板・操作パネル・ラベル・シール全て確認

厳守: 読めない情報は"不明"。推測禁止。

JSONのみ返答:
{"brand":"","model":"","capacity":"","year":"","wattage":"","dimensions":"","category":"","color":"","series":"","janCode":"","confidence":{"brand":0.0,"model":0.0,"capacity":0.0},"rawOCR":"","suggestCatId":"appliance|ikea|apple|dyson|pc|small|other","suggestSubCat":"","specSuggestions":["スペックの候補1","候補2","候補3"]}`;

  const allContent=isOAI
    ? [...b64s.map(b=>({type:"image_url",image_url:{url:`data:image/jpeg;base64,${b}`}})),{type:"text",text:prompt}]
    : [...b64s.map(b=>({type:"image",source:{type:"base64",media_type:"image/jpeg",data:b}})),{type:"text",text:prompt}];

  const msgs=[{role:"user",content:allContent}];
  const text=isOAI?await aiOAI(key,msgs,900):await aiClaude(msgs,900);
  return parseJ(text);
}

// ── 傷・状態解析 ─────────────────────────
async function doScratchAnalysis(b64,key){
  const isOAI=pickAI(key)==="oai";
  const prompt=`この商品の画像を見て、傷・汚れ・使用感の状態を詳細に分析してください。

分析項目:
1. 全体的な状態評価(美品/良品/普通/やや使用感あり/使用感あり)
2. 目視できる傷・汚れの箇所と程度
3. 変色・焼け・錆の有無
4. 動作に影響しそうな損傷の有無

        const sc=Math.min(900/img.naturalWidth,900/img.naturalHeight);
        sm.getContext("2d").drawImage(img,(900-sm.width*(1-sc))/2,(900-sm.height*(1-sc))/2,img.naturalWidth*sc,img.naturalHeight*sc);
        const b64=sm.toDataURL("image/jpeg",.88).split(",")[1];
        setOcrImgs(prev=>[...prev,{src:e.target.result,b64}]);
      };
      img.src=e.target.result;
    };
    reader.readAsDataURL(file);ev.target.value="";
  }

  async function runOCR(){
    if(!photoB64){setError("メイン写真をアップロードしてください");return;}
    setOcrLoading(true);setError("");
    try{
      const all=[photoB64,...ocrImgs.map(o=>o.b64)];
      const ocr=await doOCR(all,apiKey);
      setOcrData(ocr);
      if(ocr.suggestCatId&&CATS[ocr.suggestCatId])setCatId(ocr.suggestCatId);
      if(ocr.suggestSubCat)setSubCat(ocr.suggestSubCat);
      // スペック候補を主要スペック欄にサジェスト(空の場合のみ)
      if(!mainSpec&&ocr.capacity&&ocr.capacity!=="不明")setMainSpec(ocr.capacity);
    }catch(e){setError("OCR: "+e.message);}
    setOcrLoading(false);
  }

  async function runScratch(){
    if(!photoB64){setError("写真をアップロードしてください");return;}
    setScratchLoading(true);setError("");
    try{
      const r=await doScratchAnalysis(photoB64,apiKey);
      setScratchResult(r);
    }catch(e){setError("傷解析: "+e.message);}
    setScratchLoading(false);
  }

  async function doInstant(){
    if(!imgEl)return;
    setLoading(true);setLoadMsg("生成中...");setError("");setAiImgUrl(null);
    try{
      await document.fonts.ready;
      const cv=cvRef.current;cv.width=1080;cv.height=1080;
      const ctx=cv.getContext("2d");
      const src=croppedC||cropSq(imgEl);
      const data={
        brand:ocrData?.brand!=="不明"?ocrData?.brand:"",
        model:ocrData?.model!=="不明"?ocrData?.model:"",
        capacity:ocrData?.capacity!=="不明"?ocrData?.capacity:mainSpec,
        mainSpec,catchCopy,
        subCat:isOther?freeCat:subCat,
        condition,delivery,negotiable,urgent,
      };
      render(ctx,src,data,catId,1080,1080);
      setResult(cv.toDataURL("image/png"));
    }catch(e){setError("生成失敗: "+e.message);}
    setLoading(false);setLoadMsg("");
  }

  async function doAI(){
    if(!photoB64){setError("写真をアップロードしてください");return;}
    if(!hasApi){setError("DALL-E生成にはOpenAI APIキーが必要です");return;}
    setLoading(true);setLoadMsg("🤖 GPT-4oで商品解析中...");setError("");setResult(null);
    try{
      const data={brand:ocrData?.brand,capacity:mainSpec||ocrData?.capacity,catchCopy,condition,delivery,urgent};
      setLoadMsg("🎨 DALL-E 3で生成中(20〜40秒)...");
      const url=await doDalleGen(photoB64,catId,isOther?freeCat:subCat,data,apiKey);
      setAiImgUrl(url);
    }catch(e){setError("AI生成: "+e.message);}
    setLoading(false);setLoadMsg("");
  }

  async function runDesc(){
    if(!photoB64){setError("写真をアップロードしてください");return;}
    setDescLoading(true);setDescResult("");setError("");
    try{
      const ui={状態:condition,配送:delivery,カテゴリ:isOther?freeCat:subCat,スペック:mainSpec,キャッチコピー:catchCopy,付属品:accessories,値下げ:negotiable?"応相談":"",傷状態:scratchNote};
      const txt=await doDesc(descPlatform,ocrData||{},ui,photoB64,apiKey);
      setDescResult(txt);
    }catch(e){setError("説明文: "+e.message);}
    setDescLoading(false);
  }

  function dl(url,ai){
    const a=document.createElement("a");a.download=`CTR_${catId}_${Date.now()}.png`;a.href=url;
    if(ai)a.target="_blank";a.click();
  }

  const canGo=!!imgEl&&!loading&&!photoLoading&&!ocrLoading;

  return h("div",{style:{minHeight:"100vh",background:G.bg,padding:12}},
    h("div",{style:{maxWidth:620,margin:"0 auto"}},

    // Header
    h("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:14}},
      h("div",null,
        h("h1",{style:{fontSize:15,fontWeight:900,background:"linear-gradient(90deg,#FFD700,#FF8C00)",WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent",margin:0}},"🏷️ 中古販売CTRエンジン"),
        h("p",{style:{color:"rgba(255,255,255,.25)",fontSize:9,margin:"1px 0 0"}},(hasApi?"GPT-4o":"Claude AI")+" · "+VER)
      ),
      h("div",{style:{display:"flex",gap:5}},
        h("button",{onClick:()=>setScreen("api"),style:{padding:"5px 10px",borderRadius:7,background:hasApi?"rgba(74,222,128,.1)":"rgba(255,255,255,.05)",border:hasApi?"1px solid rgba(74,222,128,.28)":"1px solid rgba(255,255,255,.09)",color:hasApi?"#4ade80":"rgba(255,255,255,.3)",fontSize:9,cursor:"pointer",fontWeight:700}},hasApi?"🔑 GPT-4o":"⚙️ API"),
        h("button",{onClick:logout,style:{padding:"5px 9px",borderRadius:7,background:"rgba(255,255,255,.04)",border:"1px solid rgba(255,255,255,.08)",color:"rgba(255,255,255,.25)",fontSize:9,cursor:"pointer"}},"🔒")
      )
    ),

    // Step1 写真
    h("div",{style:G.card},
      h("div",{style:G.ct},"Step 1 · 商品写真(自動クロップ)"),
      h("div",{style:{border:"2px dashed rgba(255,255,255,.09)",borderRadius:11,minHeight:95,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",background:"rgba(0,0,0,.15)",overflow:"hidden",padding:8}},
        photoLoading?h(Sp,{msg:"読み込み中..."})
        :croppedC?[h("img",{key:"i",src:croppedC.toDataURL(),style:{maxHeight:160,maxWidth:"100%",borderRadius:8,marginBottom:5}}),h("div",{key:"t",style:{fontSize:10,color:"#4ade80"}},"✅ 自動クロップ完了")]
        :[h("div",{key:"ic",style:{fontSize:34,marginBottom:6}},"📷"),h("div",{key:"t",style:{color:"rgba(255,255,255,.5)",fontSize:13,fontWeight:700}},"写真をアップロード")]
      ),
      h("div",{style:{display:"flex",gap:7,marginTop:8}},
        h("label",{style:{flex:1,display:"block"}},h("div",{style:{padding:"9px",borderRadius:8,background:"rgba(255,255,255,.05)",border:"1px solid rgba(255,255,255,.09)",textAlign:"center",cursor:"pointer",fontSize:12,color:"rgba(255,255,255,.65)",fontWeight:600}},"🖼️ 写真から"),h("input",{type:"file",accept:"image/*",onChange:handlePhoto,style:{display:"none"}})),
        h("label",{style:{flex:1,display:"block"}},h("div",{style:{padding:"9px",borderRadius:8,background:"rgba(255,255,255,.05)",border:"1px solid rgba(255,255,255,.09)",textAlign:"center",cursor:"pointer",fontSize:12,color:"rgba(255,255,255,.65)",fontWeight:600}},"📸 カメラ"),h("input",{type:"file",accept:"image/*",capture:"environment",onChange:handlePhoto,style:{display:"none"}}))
      ),
      // 傷解析ボタン
      photoB64&&h("button",{onClick:runScratch,disabled:scratchLoading,style:PB(scratchLoading?"rgba(255,255,255,.06)":"rgba(245,158,11,.12)","#f59e0b",{marginTop:7,marginBottom:0,border:"1px solid rgba(245,158,11,.28)",fontSize:12,padding:"9px"})},scratchLoading?"🔍 傷を解析中...":"🔍 傷・状態を画像解析する")
    ),

    scratchLoading&&h(Sp,{msg:"画像から傷・状態を解析中..."}),
    h(ScratchPanel,{result:scratchResult,onSelect:t=>{setScratchNote(t);setScratchResult(null);}}),

    // Step2 OCR追加画像
    h("div",{style:G.card},
      h("div",{style:G.ct},"Step 2 · OCR用追加画像(型番ラベル等・最大3枚)"),
      h("div",{style:{fontSize:11,color:"rgba(255,255,255,.4)",marginBottom:8,lineHeight:1.5}},"型番ラベル・銘板・操作パネルの写真を追加するとOCR精度が大幅向上"),
      ocrImgs.length>0&&h("div",{style:{display:"flex",gap:5,marginBottom:8,flexWrap:"wrap"}},
        ocrImgs.map((o,i)=>h("div",{key:i,style:{position:"relative"}},
          h("img",{src:o.src,style:{width:64,height:64,objectFit:"cover",borderRadius:7,border:"1px solid rgba(255,255,255,.12)"}}),
          h("button",{onClick:()=>setOcrImgs(prev=>prev.filter((_,j)=>j!==i)),style:{position:"absolute",top:-3,right:-3,width:18,height:18,borderRadius:"50%",background:"#ef4444",border:"none",color:"#fff",fontSize:10,cursor:"pointer",fontWeight:900,lineHeight:1}},"×")
        ))
      ),
      ocrImgs.length<3&&h("label",{style:{display:"block"}},h("div",{style:{padding:"8px",borderRadius:8,background:"rgba(96,165,250,.07)",border:"1px dashed rgba(96,165,250,.28)",textAlign:"center",cursor:"pointer",fontSize:11,color:"#60a5fa",fontWeight:600}},`➕ OCR用画像を追加 (${ocrImgs.length}/3)`),h("input",{type:"file",accept:"image/*",onChange:handleOcrPhoto,style:{display:"none"}})),
      photoB64&&h("button",{onClick:runOCR,disabled:ocrLoading,style:PB(ocrLoading?"rgba(255,255,255,.06)":"linear-gradient(135deg,#60a5fa,#3b82f6)",ocrLoading?"rgba(255,255,255,.3)":"#fff",{marginTop:8,marginBottom:0,fontSize:12,padding:"10px"})},ocrLoading?"🔍 OCR解析中...":"🔍 "+(ocrData?"再OCR解析":"OCR自動解析を実行"))
    ),

    ocrLoading&&h(Sp,{msg:"OCR解析中..."}),
    h(OcrTags,{ocrData,setOcrData}),

    // Step3 カテゴリ
    h("div",{style:G.card},
      h("div",{style:G.ct},"Step 3 · カテゴリ"),
      h("div",{style:{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:6,marginBottom:10}},
        Object.entries(CATS).map(([id,cat])=>{
          const active=catId===id;
          return h("button",{key:id,onClick:()=>{setCatId(id);setSubCat("");setFreeCat("");},
            style:{padding:"9px 4px",borderRadius:9,border:active?`2px solid ${cat.c}`:"1px solid rgba(255,255,255,.07)",background:active?"rgba(255,255,255,.06)":"rgba(255,255,255,.022)",color:active?cat.c:"rgba(255,255,255,.38)",cursor:"pointer",fontWeight:active?700:400,fontSize:11,textAlign:"center"}},
            cat.l
          );
        })
      ),
      h(Lbl,null,"サブカテゴリ"),
      h(Sel,{value:subCat,onChange:e=>setSubCat(e.target.value),opts:catTree.subs,placeholder:"選択してください"}),
      isOther&&h("div",null,
        h(Lbl,null,"フリー入力(詳細カテゴリ)"),
        h(Inp,{placeholder:"例: スマートウォッチ・ゲーム機・古書 など",value:freeCat,onChange:e=>setFreeCat(e.target.value),style:{...G.inp,marginBottom:0}})
      )
    ),

    // Step4 商品情報
    h("div",{style:G.card},
      h("div",{style:G.ct},"Step 4 · 商品情報"),
      // スペックサジェスト
      ocrData?.specSuggestions?.length>0&&h("div",{style:{marginBottom:9}},
        h(Lbl,null,"スペック候補(タップで入力)"),
        h("div",{style:{display:"flex",flexWrap:"wrap",gap:4,marginBottom:6}},
          ocrData.specSuggestions.map((s,i)=>h("button",{key:i,onClick:()=>setMainSpec(s),style:{padding:"4px 10px",borderRadius:6,background:"rgba(255,215,0,.08)",border:"1px solid rgba(255,215,0,.2)",color:"#fcd34d",fontSize:11,cursor:"pointer"}},s))
        )
      ),
      h(Lbl,null,"主要スペック(容量・世代など)"),
      h(Inp,{placeholder:"例: 5.5kg / 256GB / 65インチ",value:mainSpec,onChange:e=>setMainSpec(e.target.value),style:{...G.inp,marginBottom:9}}),
      h(Lbl,null,"キャッチコピー(任意)"),
      h(Inp,{placeholder:"例: しっかり洗えてふんわり乾燥！",value:catchCopy,onChange:e=>setCatchCopy(e.target.value),style:{...G.inp,marginBottom:9}}),
      h(Lbl,null,"商品の状態"),
      h(Sel,{value:condition,onChange:e=>setCondition(e.target.value),opts:["美品","動作確認済み","良品","やや使用感あり","ジャンク・現状渡し"]}),
      h(Lbl,null,"配送・受け渡し"),
      h(Sel,{value:delivery,onChange:e=>setDelivery(e.target.value),opts:["配達可(要相談)","配達可(無料)","自己搬出のみ","発送対応可","引き取り限定","近隣エリア配達対応"]}),
      h(Lbl,null,"付属品(任意)"),
      h(Inp,{placeholder:"例: 本体・取扱説明書・ホースセット付き",value:accessories,onChange:e=>setAccessories(e.target.value),style:{...G.inp,marginBottom:9}}),
      // 傷状態テキスト
      h(Lbl,null,"傷・状態の記述(画像解析から自動入力 or 手入力)"),
      h("textarea",{placeholder:"例: 動作良好。外観にわずかなスレはありますが目立ちません。変色もなく清潔感あり。",value:scratchNote,onChange:e=>setScratchNote(e.target.value),style:{...G.ta,minHeight:70,marginBottom:9}}),
      h("div",{style:{display:"flex",gap:12,flexWrap:"wrap"}},
        h("label",{style:{display:"flex",alignItems:"center",gap:5,cursor:"pointer",fontSize:12,color:negotiable?"#fcd34d":"rgba(255,255,255,.35)"}},h("input",{type:"checkbox",checked:negotiable,onChange:e=>setNegotiable(e.target.checked),style:{accentColor:"#fcd34d",width:14,height:14}}),"💬 値下げ応相談"),
        h("label",{style:{display:"flex",alignItems:"center",gap:5,cursor:"pointer",fontSize:12,color:urgent?"#f87171":"rgba(255,255,255,.35)"}},h("input",{type:"checkbox",checked:urgent,onChange:e=>setUrgent(e.target.checked),style:{accentColor:"#f87171",width:14,height:14}}),"🔥 即売希望(激安バッジ)")
      )
    ),

    h(Err,{msg:error}),
    loading&&h(Sp,{msg:loadMsg}),

    // 生成ボタン(2つ)
    h("div",{style:{display:"flex",gap:7,marginBottom:9}},
      h("button",{onClick:doInstant,disabled:!canGo,style:{...PB(canGo?"linear-gradient(135deg,#FFD700,#FF8C00)":"rgba(255,255,255,.06)",canGo?"#090912":"rgba(255,255,255,.2)"),flex:1,marginBottom:0,fontSize:13}},loading?"...":"⚡ 即時生成"),
      h("button",{onClick:doAI,disabled:!canGo||!hasApi,style:{...PB(canGo&&hasApi?"linear-gradient(135deg,#10b981,#059669)":"rgba(255,255,255,.06)",canGo&&hasApi?"#fff":"rgba(255,255,255,.2)"),flex:1,marginBottom:0,fontSize:13}},loading?"...":hasApi?"🤖 GPT-4o AI生成":"🤖 AI生成 (要API)")
    ),
    !hasApi&&h("div",{style:{fontSize:10,color:"rgba(255,255,255,.35)",textAlign:"center",marginBottom:9}},"DALL-E 3 AI生成はOpenAI APIキーが必要です(右上 ⚙️ API)"),

    h("canvas",{ref:cvRef,style:{display:"none"}}),

    // 結果
    result&&!loading&&h("div",{style:{...G.card,textAlign:"center"}},
      h("div",{style:G.ct},"⚡ 即時生成"),
      h("img",{src:result,style:{width:"100%",borderRadius:9,marginBottom:11,boxShadow:"0 6px 28px rgba(0,0,0,.5)"}}),
      h("button",{onClick:()=>dl(result),style:{padding:"11px 24px",borderRadius:8,background:"linear-gradient(135deg,#FFD700,#FF8C00)",border:"none",color:"#090912",fontWeight:900,fontSize:13,cursor:"pointer"}},"⬇️ PNG保存")
    ),
    aiImgUrl&&!loading&&h("div",{style:{...G.card,textAlign:"center"}},
      h("div",{style:G.ct},"🤖 GPT-4o AI生成"),
      h("img",{src:aiImgUrl,style:{width:"100%",borderRadius:9,marginBottom:11,boxShadow:"0 6px 28px rgba(0,0,0,.5)"}}),
      h("button",{onClick:()=>window.open(aiImgUrl,"_blank"),style:{padding:"11px 24px",borderRadius:8,background:"linear-gradient(135deg,#10b981,#059669)",border:"none",color:"#fff",fontWeight:900,fontSize:13,cursor:"pointer"}},"⬇️ 画像を開く(長押しで保存)")
    ),

    // 説明文
    h("div",{style:G.card},
      h("div",{style:G.ct},"📝 商品説明生成 · ファクトチェック付き"),
      h("div",{style:{display:"flex",gap:6,marginBottom:10}},
        [{id:"mercari",icon:"📦",name:"メルカリ",c:"#FF6257"},{id:"yahoo",icon:"🛒",name:"Yahoo!",c:"#FF0033"},{id:"jimoty",icon:"📍",name:"ジモティー",c:"#00A0E9"}].map(pl=>{
          const act=descPlatform===pl.id;
          return h("button",{key:pl.id,onClick:()=>{setDescPlatform(pl.id);setDescResult("");},
            style:{flex:1,padding:"9px 4px",borderRadius:9,border:act?`2px solid ${pl.c}`:"1px solid rgba(255,255,255,.07)",background:act?"rgba(255,255,255,.055)":"rgba(255,255,255,.02)",color:act?pl.c:"rgba(255,255,255,.32)",cursor:"pointer",fontWeight:act?700:400,fontSize:11,textAlign:"center"}},
            h("div",{style:{fontSize:17,marginBottom:2}},pl.icon),h("div",{style:{fontWeight:700,fontSize:10}},pl.name)
          );
        })
      ),
      descLoading&&h(Sp,{msg:"生成→ファクトチェック→修正中..."}),
      h("button",{onClick:runDesc,disabled:descLoading||!photoB64,style:PB(photoB64&&!descLoading?"linear-gradient(135deg,#f59e0b,#ef4444)":"rgba(255,255,255,.05)",photoB64&&!descLoading?"#fff":"rgba(255,255,255,.2)",{marginBottom:8,fontSize:13})},descLoading?"検証中...":"✨ 説明文を自動生成する"),
      descResult&&!descLoading&&h("div",null,
        h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:5}},
          h("span",{style:{fontSize:9,color:"#4ade80",fontWeight:700}},"✅ ファクトチェック済"),
          h("span",{style:{fontSize:10,color:descResult.length>800?"#f87171":descResult.length>500?"#fcd34d":"#4ade80",fontWeight:700}},descResult.length+"文字")
        ),
        h("textarea",{value:descResult,onChange:e=>setDescResult(e.target.value),style:G.ta}),
        h("button",{onClick:()=>{if(!descResult)return;navigator.clipboard?.writeText(descResult).then(()=>{setCopied(true);setTimeout(()=>setCopied(false),2500);});},style:PB("rgba(255,255,255,.04)","rgba(255,255,255,.65)",{border:"1px solid rgba(255,255,255,.09)",marginTop:6,marginBottom:0,fontSize:12})},copied?"✅ コピー完了！":"📋 コピーする")
      )
    ),
    h("div",{style:{height:14}})
  ));
}

// ── ROOT ─────────────────────────────────
function App(){const [ok,setOk]=useState(false);return ok?h(Main,{logout:()=>setOk(false)}):h(Login,{ok:()=>setOk(true)});}
ReactDOM.createRoot(document.getElementById("R")).render(h(App));
</script>
